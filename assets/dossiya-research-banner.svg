<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Dossiya Dakou | Physics-based mathematical engineering</title>
  <desc id="bannerDesc">A white and sky-blue scientific portfolio banner with the name Dossiya Dakou, research areas and an exact illustrative normalized first-order unit-step response x(s) = 1 - exp(-s). Animated points trace the response as a visual example, not measured research data.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .navy { fill: #142638; }
    .muted { fill: #526679; }
    .tick { font-size: 10px; fill: #536B7F; }
    .point { fill: #00BFFF; stroke: #FFFFFF; stroke-width: 1.8; opacity: .65; transform-box: fill-box; transform-origin: center; animation: heartbeat 3.6s ease-in-out infinite; }
    .p0 { animation-delay: 0s; }
    .p1 { animation-delay: 1.2s; }
    .p2 { animation-delay: 2.4s; }
    .signal { fill: #0072BC; stroke: #FFFFFF; stroke-width: 1.8; }
    .hairline { fill: none; stroke: #D5E9F5; stroke-width: 1; }
    @keyframes heartbeat { 0%,22%,100% { opacity: .35; transform: scale(1); } 10% { opacity: 1; transform: scale(1.65); } }
    @media (prefers-reduced-motion: reduce) { .point { animation: none; opacity: .85; } }
  </style>
  <rect width="1200" height="260" fill="#FFFFFF"/>
  <path d="M42 38V161" stroke="#87CEFA" stroke-width="7" stroke-linecap="round"/>
  <text x="65" y="48" class="muted" font-size="14" letter-spacing="2.1">RESEARCH PORTFOLIO</text>
  <text x="65" y="120" class="navy" font-size="67" font-weight="700" letter-spacing="-2.5">Dossiya Dakou</text>
  <text x="67" y="153" class="navy" font-size="18" font-weight="600">Physics-Based Mathematical Engineering</text>
  <text x="67" y="185" class="muted" font-size="13" letter-spacing=".6">PHYSICAL SYSTEMS   /   MATHEMATICAL MODELS   /   COMPUTATIONAL EVIDENCE</text>
  <path d="M67 204H610" stroke="#BFDDED" stroke-width="1"/>
  <g font-size="12.5" font-weight="600" fill="#2878CD">
    <text x="67" y="229">Numerical Methods</text>
    <text x="234" y="229">Optimization</text>
    <text x="365" y="229">Uncertainty</text>
    <text x="500" y="229">Validation</text>
  </g>
  <rect x="661" y="25" width="497" height="210" rx="12" fill="#F6FBFF" stroke="#D4EAF7" stroke-width="1.5"/>
  <path d="M679 25h112" stroke="#87CEFA" stroke-width="5" stroke-linecap="round"/>
  <text x="685" y="51" class="muted" font-size="12" font-weight="700" letter-spacing="1">ILLUSTRATIVE DYNAMICAL SYSTEM</text>
  <text x="685" y="81" class="navy" font-size="19" font-weight="500">dx/ds = 1 - x</text>
  <text x="899" y="81" class="navy" font-size="17">x(s) = 1 - e</text>
  <text x="1008" y="72" class="navy" font-size="10">-s</text>
  <text x="684" y="105" class="muted" font-size="11">Unit-step response with x(0) = 0; s is normalized time</text>
