<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Physics-grounded research method for interdependent infrastructure</title>
  <desc id="desc">A research transformation from physical power and transportation infrastructure through causal mechanisms and mathematical dynamics to viability and engineering intervention.</desc>
  <defs>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#57606a"/></marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9a6700"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0969da"/></marker>
  </defs>
  <rect width="1440" height="760" rx="28" fill="#ffffff"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">
    <text x="70" y="72" fill="#161b22" font-size="30" font-weight="760">From physical system to engineering action</text>
    <text x="70" y="105" fill="#57606a" font-size="17">Each representation must preserve a defensible link to the mechanism it claims to model.</text>

    <g transform="translate(70 155)">
      <text x="0" y="0" fill="#57606a" font-size="14" font-weight="800" letter-spacing="1.8">01 · PHYSICAL REALITY</text>
      <rect x="0" y="28" width="330" height="210" rx="18" fill="#f6f8fa" stroke="#d0d7de"/>
      <text x="22" y="58" fill="#161b22" font-size="17" font-weight="700">Power + Transportation</text>
      <g transform="translate(22 86)" stroke="#161b22" stroke-width="2" fill="#ffffff">
        <circle cx="24" cy="36" r="7"/><circle cx="86" cy="18" r="7"/><circle cx="138" cy="54" r="7"/>
        <path d="M31 34L79 21M92 24L132 49M31 39L131 52"/>
        <circle cx="214" cy="26" r="7"/><circle cx="268" cy="50" r="7"/>
        <path d="M221 29L261 47"/>
        <path d="M150 56C170 82 190 82 207 35" stroke="#9a6700" stroke-width="2.5" marker-end="url(#arrowGold)"/>
      </g>
      <text x="22" y="174" fill="#57606a" font-size="14">components · flows · services · limits</text>
      <text x="22" y="198" fill="#57606a" font-size="14">hazards · timescales · measurements</text>
    </g>

    <path d="M420 286H505" stroke="#57606a" stroke-width="2" marker-end="url(#arrowMuted)"/>
    <g transform="translate(525 155)">
      <text x="0" y="0" fill="#57606a" font-size="14" font-weight="800" letter-spacing="1.8">02 · CAUSALITY</text>
      <rect x="0" y="28" width="330" height="210" rx="18" fill="#f6f8fa" stroke="#9a6700" stroke-width="1.5"/>
      <text x="22" y="58" fill="#161b22" font-size="17" font-weight="700">Interface mechanism</text>
      <text x="22" y="99" fill="#9a6700" font-size="19" font-family="Georgia,'Times New Roman',serif">source → mechanism → receiver</text>
      <text x="22" y="138" fill="#161b22" font-size="17" font-family="Georgia,'Times New Roman',serif">𝕀ᵅᵝᵢⱼ = (Eᵢ, Eⱼ, Mᵢⱼ, …)</text>
      <text x="22" y="174" fill="#57606a" font-size="14">direction · sign · magnitude · delay</text>
      <text x="22" y="198" fill="#57606a" font-size="14">activation · evidence · validity context</text>
    </g>

    <path d="M875 286H960" stroke="#57606a" stroke-width="2" marker-end="url(#arrowMuted)"/>
    <g transform="translate(980 155)">
      <text x="0" y="0" fill="#57606a" font-size="14" font-weight="800" letter-spacing="1.8">03 · MATHEMATICS</text>
      <rect x="0" y="28" width="390" height="210" rx="18" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/>
      <text x="22" y="58" fill="#161b22" font-size="17" font-weight="700">Structure + dynamics</text>
      <text x="22" y="100" fill="#0969da" font-size="21" font-family="Georgia,'Times New Roman',serif">𝒢 ,  Ẏ = F𝒢(Y,u,η;θ)</text>
      <text x="22" y="138" fill="#161b22" font-size="17" font-family="Georgia,'Times New Roman',serif">C(Y,u,η;θ)=0</text>
      <text x="204" y="138" fill="#161b22" font-size="17" font-family="Georgia,'Times New Roman',serif">G(Y,u,η;θ)≤0</text>
      <text x="22" y="174" fill="#57606a" font-size="14">graphs · ODE/DAE/PDE · topology</text>
      <text x="22" y="198" fill="#57606a" font-size="14">probability · geometry · optimization</text>
    </g>

    <path d="M1175 405V463" stroke="#0969da" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
    <g transform="translate(755 478)">
      <text x="0" y="0" fill="#57606a" font-size="14" font-weight="800" letter-spacing="1.8">04 · VIABILITY + UNCERTAINTY</text>
      <rect x="0" y="28" width="615" height="196" rx="18" fill="#f6f8fa" stroke="#d0d7de"/>
      <path d="M54 132 C150 56 300 54 422 105 C480 130 524 127 570 91" fill="none" stroke="#d0d7de" stroke-width="1.5"/>
      <path d="M70 153 C155 92 300 88 408 128 C480 154 528 149 578 118" fill="none" stroke="#d0d7de" stroke-width="1.5"/>
      <path d="M110 144 C210 82 345 83 487 127" fill="none" stroke="#0969da" stroke-width="3"/>
      <circle cx="319" cy="96" r="7" fill="#0969da"/>
      <path d="M319 96L394 64" stroke="#0969da" stroke-width="2.3" marker-end="url(#arrowBlue)"/>
      <text x="407" y="68" fill="#0969da" font-size="18" font-family="Georgia,'Times New Roman',serif">ρ₍g₎</text>
      <path d="M477 91L527 91" stroke="#cf222e" stroke-width="2" stroke-dasharray="5 5"/>
      <text x="24" y="58" fill="#161b22" font-size="17" font-weight="700">Admissible trajectories and critical boundaries</text>
      <text x="24" y="184" fill="#57606a" font-size="14">𝒱 · ∂𝒱 · sensitivity · uncertainty propagation · model validity</text>
    </g>

    <path d="M735 590H650" stroke="#57606a" stroke-width="2" marker-end="url(#arrowMuted)"/>
    <g transform="translate(70 478)">
      <text x="0" y="0" fill="#57606a" font-size="14" font-weight="800" letter-spacing="1.8">05 · ENGINEERING DECISION</text>
      <rect x="0" y="28" width="550" height="196" rx="18" fill="#f6f8fa" stroke="#d0d7de"/>
      <text x="24" y="62" fill="#161b22" font-size="17" font-weight="700">Compare interventions under constraints</text>
      <text x="24" y="112" fill="#161b22" font-size="24" font-family="Georgia,'Times New Roman',serif">u★ = arg min  J(u)</text>
      <text x="24" y="148" fill="#57606a" font-size="14">control · restoration · design · resource allocation</text>
      <text x="24" y="174" fill="#57606a" font-size="14">service · safety · resilience · sustainability</text>
    </g>

    <text x="70" y="724" fill="#57606a" font-size="14">Scientific invariant: mathematical elegance ≠ physical validity ≠ empirical validation.</text>
  </g>
</svg>