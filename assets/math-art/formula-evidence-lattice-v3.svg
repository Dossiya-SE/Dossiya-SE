<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Formula evidence lattice</title>
  <desc id="desc">A scientific presentation pipeline showing how formulas move from source or assumptions to model, computation, verification, validation, and bounded decision. Separate evidence-state tags prevent source mathematics, model choices, hypotheses, and empirical results from being conflated.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111e"/><stop offset="1" stop-color="#0b1c31"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#7899ba"/></marker>
    <style>
      .title{font:700 38px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#f3f8ff}
      .sub{font:400 17px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#a8bed4}
      .h{font:700 17px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#f5f9ff}
      .b{font:400 13px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#abc0d6}
      .tag{font:700 13px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#fff}
      .math{font:600 17px Georgia,Times New Roman,serif;fill:#eef6ff}
      .node{fill:#0e243b;stroke:#305572;stroke-width:1.4}
      .source{fill:#121f46;stroke:#596cd9;stroke-width:1.4}
      .model{fill:#102a38;stroke:#3a86a8;stroke-width:1.4}
      .verify{fill:#0e2c29;stroke:#43a481;stroke-width:1.4}
      .validate{fill:#2f2814;stroke:#d4ad42;stroke-width:1.4}
      .hyp{fill:#2d1e35;stroke:#b26bd0;stroke-width:1.4;stroke-dasharray:6 5}
      .flow{fill:none;stroke:#7899ba;stroke-width:2;marker-end:url(#a)}
      .thin{stroke:#29465f;stroke-width:1}
    </style>
  </defs>
  <rect width="1600" height="620" rx="28" fill="url(#bg)"/>
  <text x="66" y="66" class="title">Formula Evidence Lattice</text>
  <text x="66" y="99" class="sub">A professional equation display carries provenance, assumptions, interpretation, implementation status, and verification—not typography alone.</text>

  <g transform="translate(66 154)">
    <rect width="210" height="170" rx="20" class="source"/>
    <text x="20" y="34" class="h">1 · Source / Assumptions</text>
    <text x="20" y="69" class="math">[S] theorem / definition</text>
    <text x="20" y="96" class="math">[M] declared assumption</text>
    <text x="20" y="126" class="b">section · page · equation</text>
    <text x="20" y="148" class="b">or explicit modeling premise</text>
  </g>
  <path d="M276 239 L318 239" class="flow"/>

  <g transform="translate(318 154)">
    <rect width="210" height="170" rx="20" class="model"/>
    <text x="20" y="34" class="h">2 · Mathematical Object</text>
    <text x="20" y="68" class="math">definition + domain</text>
    <text x="20" y="96" class="math">equation + symbols</text>
    <text x="20" y="126" class="b">units · regularity</text>
    <text x="20" y="148" class="b">constraints · boundary conditions</text>
  </g>
  <path d="M528 239 L570 239" class="flow"/>

  <g transform="translate(570 154)">
    <rect width="210" height="170" rx="20" class="node"/>
    <text x="20" y="34" class="h">3 · Computation</text>
    <text x="20" y="68" class="math">algorithm → code</text>
    <text x="20" y="96" class="math">solver / estimator</text>
    <text x="20" y="126" class="b">version · seed · tolerance</text>
    <text x="20" y="148" class="b">mesh / timestep / optimizer</text>
  </g>
  <path d="M780 239 L822 239" class="flow"/>

  <g transform="translate(822 154)">
    <rect width="210" height="170" rx="20" class="verify"/>
    <text x="20" y="34" class="h">4 · Verification</text>
    <text x="20" y="68" class="math">identity / invariant</text>
    <text x="20" y="96" class="math">convergence / cross-check</text>
    <text x="20" y="126" class="b">software correctness</text>
    <text x="20" y="148" class="b">≠ real-world validity</text>
  </g>
  <path d="M1032 239 L1074 239" class="flow"/>

  <g transform="translate(1074 154)">
    <rect width="210" height="170" rx="20" class="validate"/>
    <text x="20" y="34" class="h">5 · Validation</text>
    <text x="20" y="68" class="math">model ↔ evidence</text>
    <text x="20" y="96" class="math">error + uncertainty</text>
    <text x="20" y="126" class="b">calibration · external checks</text>
    <text x="20" y="148" class="b">claim-specific evidence</text>
  </g>
  <path d="M1284 239 L1326 239" class="flow"/>

  <g transform="translate(1326 154)">
    <rect width="208" height="170" rx="20" class="validate"/>
    <text x="20" y="34" class="h">6 · Bounded Decision</text>
    <text x="20" y="68" class="math">claim ≤ evidence</text>
    <text x="20" y="96" class="math">decision | constraints</text>
    <text x="20" y="126" class="b">limitations visible</text>
    <text x="20" y="148" class="b">no capability inflation</text>
  </g>

  <line x1="66" y1="366" x2="1534" y2="366" class="thin"/>
  <text x="66" y="407" class="h">Evidence-state legend</text>

  <g transform="translate(66 436)"><rect width="164" height="48" rx="16" class="source"/><text x="18" y="30" class="tag">[S] SOURCE</text></g>
  <g transform="translate(244 436)"><rect width="164" height="48" rx="16" class="model"/><text x="18" y="30" class="tag">[M] MODEL</text></g>
  <g transform="translate(422 436)"><rect width="164" height="48" rx="16" class="node"/><text x="18" y="30" class="tag">[C] COMPUTED</text></g>
  <g transform="translate(600 436)"><rect width="164" height="48" rx="16" class="verify"/><text x="18" y="30" class="tag">[V] VERIFIED</text></g>
  <g transform="translate(778 436)"><rect width="164" height="48" rx="16" class="validate"/><text x="18" y="30" class="tag">[E] EMPIRICAL</text></g>
  <g transform="translate(956 436)"><rect width="164" height="48" rx="16" class="hyp"/><text x="18" y="30" class="tag">[H] HYPOTHESIS</text></g>
  <g transform="translate(1134 436)"><rect width="164" height="48" rx="16" class="hyp"/><text x="18" y="30" class="tag">[T] TARGET</text></g>
  <g transform="translate(1312 436)"><rect width="222" height="48" rx="16" class="node"/><text x="18" y="30" class="tag">[D] DERIVED</text></g>

  <text x="66" y="532" class="math">formula ID → provenance → assumptions → role → implementation → test → visual → bounded claim</text>
  <text x="66" y="568" class="b">Rule: a beautiful equation with no source, assumptions, interpretation, or evidence state is an incomplete scientific display.</text>
</svg>
