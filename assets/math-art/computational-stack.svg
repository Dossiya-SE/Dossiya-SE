<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc"><title id="title">Computational mathematics stack</title><desc id="desc">A layered visual showing mathematical objects, numerical methods, programming languages, verification and deployment roles.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0b2038"/></linearGradient><linearGradient id="flow" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset="0.55" stop-color="#34d399"/><stop offset="1" stop-color="#fbbf24"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6z" fill="#7dd3fc"/></marker></defs><rect width="1600" height="650" rx="30" fill="url(#bg)"/><g font-family="Inter,Segoe UI,Arial"><text x="70" y="70" fill="#eef9ff" font-size="31" font-weight="800">COMPUTATIONAL MATHEMATICS STACK</text><text x="70" y="102" fill="#9bc5dd" font-size="16">notation → algorithms → implementations → tests → evidence artifacts</text>
<path d="M120 330H1480" stroke="url(#flow)" stroke-width="7" marker-end="url(#a)"/>
<g><circle cx="170" cy="330" r="58" fill="#0c4a6e" stroke="#38bdf8" stroke-width="3"/><text x="170" y="322" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">MATHEMATICS</text><text x="170" y="346" text-anchor="middle" fill="#bae6fd" font-size="12">ODE/PDE · graphs</text><text x="170" y="364" text-anchor="middle" fill="#bae6fd" font-size="12">probability · control</text></g>
<g><circle cx="430" cy="330" r="58" fill="#064e3b" stroke="#34d399" stroke-width="3"/><text x="430" y="322" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">NUMERICS</text><text x="430" y="346" text-anchor="middle" fill="#bbf7d0" font-size="12">RK4 · optimization</text><text x="430" y="364" text-anchor="middle" fill="#bbf7d0" font-size="12">Monte Carlo · inverse</text></g>
<g><circle cx="690" cy="330" r="58" fill="#3b0764" stroke="#c084fc" stroke-width="3"/><text x="690" y="322" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">CODE</text><text x="690" y="346" text-anchor="middle" fill="#e9d5ff" font-size="12">Python · Julia · R</text><text x="690" y="364" text-anchor="middle" fill="#e9d5ff" font-size="12">TS/JS · SQL · C/C++</text></g>
<g><circle cx="950" cy="330" r="58" fill="#78350f" stroke="#fbbf24" stroke-width="3"/><text x="950" y="322" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">VERIFY</text><text x="950" y="346" text-anchor="middle" fill="#fde68a" font-size="12">unit/property tests</text><text x="950" y="364" text-anchor="middle" fill="#fde68a" font-size="12">CI · schema checks</text></g>
<g><circle cx="1210" cy="330" r="58" fill="#4c0519" stroke="#fb7185" stroke-width="3"/><text x="1210" y="322" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">VALIDATE</text><text x="1210" y="346" text-anchor="middle" fill="#fecdd3" font-size="12">literature · data</text><text x="1210" y="364" text-anchor="middle" fill="#fecdd3" font-size="12">benchmarks · sensitivity</text></g>
<g><circle cx="1450" cy="330" r="58" fill="#1e293b" stroke="#94a3b8" stroke-width="3"/><text x="1450" y="322" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">DECIDE</text><text x="1450" y="346" text-anchor="middle" fill="#dbe4ed" font-size="12">bounded claim</text><text x="1450" y="364" text-anchor="middle" fill="#dbe4ed" font-size="12">engineering action</text></g>
<g font-size="13" font-weight="700"><rect x="92" y="460" width="190" height="48" rx="12" fill="#0d2740" stroke="#38bdf8"/><text x="187" y="490" text-anchor="middle" fill="#dff7ff">LaTeX · SymPy</text><rect x="328" y="460" width="190" height="48" rx="12" fill="#0d2740" stroke="#34d399"/><text x="423" y="490" text-anchor="middle" fill="#e6fff4">NumPy · SciPy · CVXPY</text><rect x="564" y="460" width="190" height="48" rx="12" fill="#0d2740" stroke="#c084fc"/><text x="659" y="490" text-anchor="middle" fill="#f5ebff">Python · Julia · R · TS</text><rect x="800" y="460" width="190" height="48" rx="12" fill="#0d2740" stroke="#fbbf24"/><text x="895" y="490" text-anchor="middle" fill="#fff5d6">pytest · Actions · schemas</text><rect x="1036" y="460" width="190" height="48" rx="12" fill="#0d2740" stroke="#fb7185"/><text x="1131" y="490" text-anchor="middle" fill="#ffe9ee">UQ · calibration · comparison</text><rect x="1272" y="460" width="220" height="48" rx="12" fill="#0d2740" stroke="#94a3b8"/><text x="1382" y="490" text-anchor="middle" fill="#f0f4f8">reports · APIs · decisions</text></g>
<text x="70" y="585" fill="#9cc7df" font-size="14">Rule: a language appears here only when it has a declared computational role; visual complexity is never used as a substitute for evidence.</text></g></svg>