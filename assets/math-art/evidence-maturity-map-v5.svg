<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1200" width="2400" height="1200" role="img" aria-label="Evidence maturity architecture — ordinal, not numerical"><title>Evidence maturity architecture — ordinal, not numerical</title><desc>Ordinal evidence-maturity architecture separating implementation maturity from validation maturity. Positions represent qualitative categories rather than numerical research scores or certification.</desc><defs><linearGradient id="gline" x1="0" x2="1"><stop offset="0" stop-color="#a8d8b4"/><stop offset=".5" stop-color="#2f8f50"/><stop offset="1" stop-color="#176a38"/></linearGradient><linearGradient id="gfill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3fbf5"/><stop offset="1" stop-color="#a8d8b4"/></linearGradient><radialGradient id="halo"><stop offset="0" stop-color="#a8d8b4" stop-opacity=".35"/><stop offset="1" stop-color="#a8d8b4" stop-opacity="0"/></radialGradient><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176a38"/></marker><marker id="arrdark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0b2114"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="1200" y="92" fill="#0b2114" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="56" font-weight="800" text-anchor="middle" letter-spacing="0" font-style="normal">EVIDENCE MATURITY ARCHITECTURE</text><text x="1200" y="140" fill="#496355" font-family="STIX Two Math,Cambria Math,Georgia,'Times New Roman',serif" font-size="24" font-weight="500" text-anchor="middle" letter-spacing="0" font-style="italic">Implementation maturity and validation maturity are separate, ordinal dimensions</text><text x="485.0" y="205" fill="#176a38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" text-anchor="middle" letter-spacing="0" font-style="normal">CONCEPT</text><text x="485.0" y="232" fill="#496355" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" letter-spacing="0" font-style="normal">Idea</text><text x="795.0" y="205" fill="#176a38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" text-anchor="middle" letter-spacing="0" font-style="normal">SCAFFOLD</text><text x="795.0" y="232" fill="#496355" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" letter-spacing="0" font-style="normal">Framework</text><text x="1105.0" y="205" fill="#176a38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" text-anchor="middle" letter-spacing="0" font-style="normal">EXECUTABLE</text><text x="1105.0" y="232" fill="#496355" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" letter-spacing="0" font-style="normal">Running</text><text x="1415.0" y="205" fill="#176a38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" text-anchor="middle" letter-spacing="0" font-style="normal">REPRODUCIBLE</text><text x="1415.0" y="232" fill="#496355" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" letter-spacing="0" font-style="normal">Repeatable</text><text x="1725.0" y="205" fill="#176a38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" text-anchor="middle" letter-spacing="0" font-style="normal">VERIFIED</text><text x="1725.0" y="232" fill="#496355" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" letter-spacing="0" font-style="normal">Audited</text><text x="285" y="330.5" fill="#0b2114" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="end" letter-spacing="0" font-style="normal">NONE</text><rect x="330" y="250" width="310" height="145" rx="0" fill="#f3fb