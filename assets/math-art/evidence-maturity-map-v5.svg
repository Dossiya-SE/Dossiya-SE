<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
<title id="title">Evidence maturity architecture</title><desc id="desc">A 1920 by 600 ordinal matrix separating implementation maturity from validation maturity without implying numerical scores, rankings or certification.</desc>
<defs><style>:root{--bg:#fff;--ink:#0B3D24;--muted:#496355;--f:#176A38;--e:#2F8F50;--m:#6FBD83;--l:#DDEFE2;--p:#F5FBF7}@media(prefers-color-scheme:dark){:root{--bg:#06130B;--ink:#ECFFF1;--muted:#A8CBB2;--f:#8FE4A4;--e:#69D383;--m:#4BB86A;--l:#164125;--p:#0A1C10}}text{font-family:Inter,Segoe UI,Arial,sans-serif}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--f)"/></marker></defs>
<rect width="1920" height="600" fill="var(--bg)"/>
<text x="960" y="62" text-anchor="middle" fill="var(--ink)" font-size="40" font-weight="800">EVIDENCE MATURITY ARCHITECTURE</text>
<text x="960" y="98" text-anchor="middle" fill="var(--muted)" font-size="19" font-weight="600">Implementation maturity and validation maturity are separate ordinal dimensions</text>
<g fill="var(--f)" font-size="18" font-weight="800" text-anchor="middle"><text x="415" y="137">CONCEPT</text><text x="645" y="137">SCAFFOLD</text><text x="875" y="137">EXECUTABLE</text><text x="1105" y="137">REPRODUCIBLE</text><text x="1335" y="137">VERIFIED</text></g>
<g fill="var(--muted)" font-size="18" font-weight="700" text-anchor="end"><text x="270" y="208">FIELD VALIDATED</text><text x="270" y="280">EMPIRICAL</text><text x="270" y="352">EXTERNAL COMPARISON</text><text x="270" y="424">INTERNAL</text><text x="270" y="496">NONE</text></g>
<rect x="300" y="165" width="1150" height="360" fill="none" stroke="var(--l)" stroke-width="2"/>
<g stroke="var(--l)" stroke-width="1.4"><line x1="530" y1="165" x2="530" y2="525"/><line x1="760" y1="165" x2="760" y2="525"/><line x1="990" y1="165" x2="990" y2="525"/><line x1="1220" y1="165" x2="1220" y2="525"/><line x1="300" y1="237" x2="1450" y2="237"/><line x1="300" y1="309" x2="1450" y2="309"/><line x1="300" y1="381" x2="1450" y2="381"/><line x1="300" y1="453" x2="1450" y2="453"/></g>
<line x1="300" y1="560" x2="1430" y2="560" stroke="var(--f)" stroke-width="2.5" marker-end="url(#a)"/><text x="875" y="590" text-anchor="middle" fill="var(--f)" font-size="18" font-weight="800">IMPLEMENTATION MATURITY</text>
<line x1="205" y1="525" x2="205" y2="180" stroke="var(--f)" stroke-width="2.5" marker-end="url(#a)"/><text x="160" y="350" text-anchor="middle" fill="var(--f)" font-size="18" font-weight="800" transform="rotate(-90 160 350)">VALIDATION MATURITY</text>
<circle cx="1335" cy="345" r="13" fill="var(--f)" stroke="var(--bg)" stroke-width="2"/><circle cx="1105" cy="417" r="13" fill="var(--e)" stroke="var(--bg)" stroke-width="2"/><circle cx="1105" cy="455" r="13" fill="var(--m)" stroke="var(--bg)" stroke-width="2"/><circle cx="875" cy="489" r="13" fill="var(--m)" stroke="var(--bg)" stroke-width="2"/><rect x="632" y="476" width="26" height="26" rx="3" fill="var(--f)" stroke="var(--bg)" stroke-width="2"/>
<g transform="translate(1510 0)"><text y="170" fill="var(--f)" font-size="19" font-weight="800">REPOSITORIES</text><circle cx="11" cy="215" r="11" fill="var(--f)"/><text x="40" y="220" fill="var(--ink)" font-size="18" font-weight="600">Mathematical Research Portfolio</text><circle cx="11" cy="267" r="11" fill="var(--e)"/><text x="40" y="272" fill="var(--ink)" font-size="18" font-weight="600">Africa Energy Dignity</text><circle cx="11" cy="319" r="11" fill="var(--m)"/><text x="40" y="324" fill="var(--ink)" font-size="18" font-weight="600">Financial Engineering Models</text><circle cx="11" cy="371" r="11" fill="var(--m)"/><text x="40" y="376" fill="var(--ink)" font-size="18" font-weight="600">Rapid Engineering EDA</text><rect x="0" y="408" width="22" height="22" rx="3" fill="var(--f)"/><text x="40" y="425" fill="var(--ink)" font-size="18" font-weight="600">Learning / prototype repositories</text><text y="505" fill="var(--f)" font-size="20" font-weight="800">Ordinal, not numerical.</text><text y="538" fill="var(--muted)" font-size="18">Position describes current evidence state;</text><text y="566" fill="var(--muted)" font-size="18">it is not certification or ranking.</text></g>
</svg>