cx="1415.0" cy="483.5" r="13" fill="#2f8f50" stroke="#ffffff" stroke-width="2" opacity="1"/><text x="1437.0" y="489.5" fill="#0b2114" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Africa Energy Dignity</text><circle cx="1415.0" cy="451.5" r="13" fill="#6fbd83" stroke="#ffffff" stroke-width="2" opacity="1"/><text x="1437.0" y="457.5" fill="#0b2114" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Financial Engineering Models</text><circle cx="1105.0" cy="338.5" r="13" fill="#a8d8b4" stroke="#ffffff" stroke-width="2" opacity="1"/><text x="1127.0" y="344.5" fill="#0b2114" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Rapid Engineering EDA</text><circle cx="795.0" cy="306.5" r="13" fill="#a8cf45" stroke="#ffffff" stroke-width="2" opacity="1"/><text x="817.0" y="312.5" fill="#0b2114" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start" letter-spacing="0" font-style="normal">Learning / prototype repositories</text><line x1="270" y1="255" x2="270" y2="965" stroke="#176a38" stroke-width="4" opacity="1" marker-end="url(#arr)"/><text x="85" y="620" fill="#176a38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" text-anchor="middle" letter-spacing="2" font-style="normal">VALIDATION MATURITY ↑</text><line x1="330" y1="1030" x2="1870" y2="1030" stroke="#176a38" stroke-width="4" opacity="1" marker-end="url(#arr)"/><text x="1100" y="1055" fill="#176a38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" text-anchor="middle" letter-spacing="2" font-style="normal">IMPLEMENTATION / REPRODUCIBILITY MATURITY →</text><rect x="1940" y="255" width="360" height="620" rx="28" fill="#f3fbf5" stroke="#a8d8b4" stroke-width="2" opacity="1"/><text x="2120" y="310" fill="#176a38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" text-anchor="middle" letter-spacing="0" font-style="normal">INTERPRETATION</text><text x="1980" y="370" fill="#496355" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start"><tspan x="1980" dy="0">Positions are categories,</tspan><tspan x="1980" dy="24.32">not numerical scores.</tspan><tspan x="1980" dy="24.32"></tspan><tspan x="1980" dy="24.32">Build → validate → verify → impact.</tspan><tspan x="1980" dy="24.32"></tspan><tspan x="1980" dy="24.32">Software verification may increase</tspan><tspan x="1980" dy="24.32">implementation confidence without</tspan><tspan x="1980" dy="24.32">creating field validation.</tspan><tspan x="1980" dy="24.32"></tspan><tspan x="1980" dy="24.32">Repository visibility is not</tspan><tspan x="1980" dy="24.32">evidence maturity.</tspan></text><text x="1200.0" y="1145" fill="#176a38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="4" font-style="normal">RIGOR  •  STRUCTURE  •  ELEGANCE  •  IMPACT</text></svg>