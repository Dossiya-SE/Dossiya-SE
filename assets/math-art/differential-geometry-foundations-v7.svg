<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">Differential Geometry Foundations</title>
<desc id="desc">Modern monochrome mathematical poster covering manifolds, metrics, geodesics, geodesic distance, curvature, normal coordinates, exponential maps, viability margins and coordinate transformations for resilient systems.</desc>
<metadata>Native editable SVG. Mathematical concepts shown schematically; engineering interpretation requires explicit modeling assumptions and validation.</metadata>
<defs><style>
:root{--bg:#fff;--ink:#111;--muted:#626262;--soft:#f3f3f3;--line:#c9c9c9;--shade:#e7e7e7;--mesh:#d5d5d5}
@media(prefers-color-scheme:dark){:root{--bg:#fff;--ink:#111;--muted:#626262;--soft:#f3f3f3;--line:#c9c9c9;--shade:#e7e7e7;--mesh:#d5d5d5}}
text{font-family:Georgia,'Times New Roman',serif;fill:var(--ink)}.math{font-family:'STIX Two Math','Cambria Math',Georgia,serif}.ital{font-style:italic}.caps{letter-spacing:2.1px}.sans{font-family:Inter,Segoe UI,Arial,sans-serif}
</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--ink)"/></marker><pattern id="mesh" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="var(--mesh)" stroke-width=".7"/></pattern></defs>
<rect width="1920" height="1080" fill="var(--bg)"/>
<text x="960" y="72" text-anchor="middle" font-size="64" font-style="italic" font-weight="700">Differential Geometry Foundations</text><text x="960" y="111" text-anchor="middle" font-size="27" class="ital">Geometry for resilient systems</text><line x1="30" y1="132" x2="1890" y2="132" stroke="var(--line)"/>

<!-- top row panels -->
<g transform="translate(20 155)">
<!-- 1 -->
<g><text x="8" y="24" font-size="22" font-weight="700">1. Manifold and local chart</text><text x="8" y="48" font-size="15" class="ital">A smooth manifold looks Euclidean locally.</text><path d="M12 205C64 92 136 77 205 143C260 196 315 191 365 121V252C303 207 249 213 199 254C134 306 66 280 12 236Z" fill="url(#mesh)" stroke="var(--line)"/><text x="26" y="269" font-size="30" class="math">𝓜</text><polygon points="94,102 231,80 284,116 148,142" fill="var(--soft)" stroke="var(--line)"/><circle cx="176" cy="126" r="6" fill="var(--ink)"/><line x1="176" y1="126" x2="218" y2="105" stroke="var(--ink)" stroke-width="2" marker-end="url(#a)"/><line x1="176" y1="126" x2="176" y2="82" stroke="var(--ink)" stroke-width="2" marker-end="url(#a)"/><text x="225" y="103" font-size="16" class="math">e₁</text><text x="183" y="82" font-size="16" class="math">e₂</text><text x="206" y="92" font-size="16" class="math">Tₓ𝓜</text><text x="184" y="124" font-size="16" class="math">x</text><path d="M285 190C324 178 346 161 370 142" fill="none" stroke="var(--ink)" marker-end="url(#a)"/><text x="310" y="166" font-size="18" class="math">φ</text><line x1="405" y1="248" x2="405" y2="150" stroke="var(--ink)" marker-end="url(#a)"/><line x1="385" y1="230" x2="492" y2="230" stroke="var(--ink)" marker-end="url(#a)"/><g stroke="var(--line)"><line x1="405" y1="190" x2="475" y2="190"/><line x1="405" y1="210" x2="475" y2="210"/><line x1="430" y1="160" x2="430" y2="230"/><line x1="455" y1="160" x2="455" y2="230"/></g><text x="396" y="148" font-size="15" class="math">u²</text><text x="494" y="236" font-size="15" class="math">u¹</text><text x="330" y="73" font-size="21" class="math">φ:U⊂𝓜→ℝⁿ</text><text x="8" y="328" font-size="15" class="ital">𝓜: state manifold · Tₓ𝓜: tangent space · φ: local chart</text></g>
<!-- 2 -->
<g transform="translate(510 0)"><text x="8" y="24" font-size="22" font-weight="700">2. Riemannian metric</text><text x="8" y="48" font-size="15" class="ital">Lengths, angles, and intrinsic geometry.</text><rect x="8" y="82" width="360" height="88" rx="8" fill="var(--soft)"/><text x="188" y="117" text-anchor="middle" font-size="27" class="math">g=gᵢⱼ duⁱ⊗duʲ</text><text x="188" y="153" text-anchor="middle" font-size="27" class="math">ds²=gᵢⱼ dxⁱdxʲ</text><path d="M30 276C80 191 145 190 196 247C241 298 303 282 342 219V326C284 296 231 310 188 338C126 378 72 344 30 315Z" fill="url(#mesh)" stroke="var(--line)"/><circle cx="150" cy="286" r="5" fill="var(--ink)"/><line x1="150" y1="286" x2="204" y2="255" stroke="var(--ink)" stroke-width="2" marker-end="url(#a)"/><line x1="150" y1="286" x2="129" y2="233" stroke="var(--ink)" stroke-width="2" marker-end="url(#a)"/><text x="211" y="252" font-size="16" class="math">w</text><text x="118" y="229" font-size="16" class="math">v</text><text x="225" y="209" font-size="16">Length: ‖v‖g</text><text x="225" y="235" font-size="16">Angle: cos θ</text><text x="225" y="261" font-size="16">Intrinsic distance</text></g>
<!-- 3 -->
<g transform="translate(895 0)"><text x="8" y="24" font-size="22" font-weight="700">3. Geodesics</text><text x="8" y="48" font-size="15" class="ital">Locally length-minimizing curves.</text><rect x="8" y="82" width="310" height="68" rx="8" fill="var(--soft)"/><text x="163" y="126" text-anchor="middle" font-size="31" class="math">∇_{γ̇}γ̇=0</text><path d="M10 271C57 181 121 171 179 226C231 275 291 262 342 201V316C287 286 236 298 190 329C127 370 66 345 10 307Z" fill="url(#mesh)" stroke="var(--line)"/><path d="M68 305C122 260 177 251 226 235C266 222 300 201 326 182" fill="none" stroke="var(--ink)" stroke-width="2.5" marker-end="url(#a)"/><circle cx="68" cy="305" r="6" fill="var(--ink)"/><circle cx="326" cy="182" r="6" fill="var(--ink)"/><text x="54" y="329" font-size="17" class="math">p</text><text x="330" y="180" font-size="17" class="math">q</text><text x="205" y="243" font-size="17" class="math">γ(s)</text></g>
<!-- 4 -->
<g transform="translate(1248 0)"><text x="8" y="24" font-size="22" font-weight="700">4. Geodesic distance</text><text x="8" y="48" font-size="15" class="ital">Intrinsic shortest-path distance.</text><rect x="8" y="82" width="335" height="92" rx="8" fill="var(--soft)"/><text x="176" y="120" text-anchor="middle" font-size="24" class="math">d_g(p,q)=inf_{γ∈Γ(p,q)} L(γ)</text><text x="176" y="153" text-anchor="middle" font-size="20" class="math">L(γ)=∫√(g(γ̇,γ̇)) ds</text><path d="M13 285C66 217 123 205 178 236C236 269 287 259 337 205V326C278 292 229 302 180 334C119 373 65 347 13 318Z" fill="url(#mesh)" stroke="var(--line)"/><circle cx="79" cy="305" r="5" fill="var(--ink)"/><circle cx="295" cy="240" r="5" fill="var(--ink)"/><path d="M79 305C140 283 208 268 295 240" fill="none" stroke="var(--ink)" stroke-width="2.5" marker-end="url(#a)"/><path d="M79 305C137 219 213 211 295 240" fill="none" stroke="var(--muted)" stroke-dasharray="7 5"/><text x="63" y="328" font-size="16" class="math">p</text><text x="300" y="240" font-size="16" class="math">q</text></g>
<!-- 5 -->
<g transform="translate(1605 0)"><text x="8" y="24" font-size="22" font-weight="700">5. Curvature</text><text x="8" y="48" font-size="15" class="ital">Intrinsic non-Euclidean structure.</text><rect x="8" y="82" width="275" height="88" rx="8" fill="var(--soft)"/><text x="145" y="119" text-anchor="middle" font-size="19" class="math">R(X,Y)Z=∇ₓ∇ᵧZ−∇ᵧ∇ₓZ−∇_[X,Y]Z</text><text x="145" y="150" text-anchor="middle" font-size="18" class="math">Rⁱⱼₖₗ</text><path d="M16 282C55 203 110 199 158 238C209 280 252 269 290 218V330C244 301 203 308 161 337C105 374 59 351 16 318Z" fill="url(#mesh)" stroke="var(--line)"/><path d="M100 275L155 246L205 274L154 306Z" fill="none" stroke="var(--ink)" stroke-width="2"/><g stroke="var(--ink)" stroke-width="2" marker-end="url(#a)"><line x1="100" y1="275" x2="150" y2="248"/><line x1="155" y1="246" x2="201" y2="271"/><line x1="205" y1="274" x2="160" y2="302"/></g><text x="100" y="347" font-size="14" class="ital">Parallel transport around a loop</text></g>
</g>

<!-- central title band -->
<line x1="30" y1="535" x2="350" y2="535" stroke="var(--line)"/><line x1="1570" y1="535" x2="1890" y2="535" stroke="var(--line)"/><text x="960" y="557" text-anchor="middle" font-size="56" font-style="italic" font-weight="700">Differential Geometry Foundations</text><text x="960" y="594" text-anchor="middle" font-size="25" class="ital">Geometry for resilient systems</text>

<!-- bottom row -->
<g transform="translate(20 625)">
<!-- 6 -->
<g><text x="8" y="24" font-size="22" font-weight="700">6. Normal coordinates</text><text x="8" y="48" font-size="15" class="ital">Locally Euclidean to first order.</text><rect x="8" y="78" width="305" height="64" rx="8" fill="var(--soft)"/><text x="160" y="117" text-anchor="middle" font-size="22" class="math">gᵢⱼ(x)=δᵢⱼ,  ∂ₖgᵢⱼ(x)=0</text><line x1="150" y1="312" x2="150" y2="165" stroke="var(--ink)" marker-end="url(#a)"/><line x1="70" y1="250" x2="285" y2="250" stroke="var(--ink)" marker-end="url(#a)"/><g fill="none" stroke="var(--muted)"><ellipse cx="150" cy="250" rx="92" ry="62"/><ellipse cx="150" cy="250" rx="67" ry="45"/><ellipse cx="150" cy="250" rx="42" ry="28"/></g><circle cx="150" cy="250" r="5" fill="var(--ink)"/><text x="231" y="210" font-size="16" class="math">Bᵣ(x)</text><text x="8" y="358" font-size="14" class="ital">Geodesic balls and local flattening.</text></g>
<!-- 7 -->
<g transform="translate(330 0)"><text x="8" y="24" font-size="22" font-weight="700">7. Exponential map</text><text x="8" y="48" font-size="15" class="ital">Maps tangent vectors to the manifold.</text><rect x="8" y="78" width="292" height="72" rx="8" fill="var(--soft)"/><text x="154" y="108" text-anchor="middle" font-size="23" class="math">expₓ:Tₓ𝓜→𝓜</text><text x="154" y="137" text-anchor="middle" font-size="20" class="math">expₓ(v)=γᵥ(1)</text><path d="M15 294C61 215 116 208 165 250C213 292 264 284 307 230V348C261 318 218 326 172 356C111 396 60 370 15 335Z" fill="url(#mesh)" stroke="var(--line)"/><polygon points="64,205 180,185 230,217 111,239" fill="var(--soft)" stroke="var(--line)"/><circle cx="121" cy="228" r="5" fill="var(--ink)"/><line x1="121" y1="228" x2="176" y2="200" stroke="var(--ink)" stroke-width="2" marker-end="url(#a)"/><path d="M121 228C152 263 183 292 218 320" fill="none" stroke="var(--ink)" stroke-width="2" marker-end="url(#a)"/><text x="178" y="199" font-size="16" class="math">v</text><text x="221" y="324" font-size="16" class="math">expₓ(v)</text><text x="70" y="200" font-size="16" class="math">Tₓ𝓜</text><text x="26" y="353" font-size="26" class="math">𝓜</text></g>
<!-- 8 -->
<g transform="translate(650 0)"><text x="8" y="24" font-size="22" font-weight="700">8. Viability and resilience</text><text x="8" y="48" font-size="15" class="ital">Distance to the boundary quantifies margin.</text><rect x="8" y="78" width="300" height="64" rx="8" fill="var(--soft)"/><text x="158" y="118" text-anchor="middle" font-size="23" class="math">ρ_g(x)=d_g(x,∂𝒱ₛᵤₛ)</text><path d="M12 302C58 211 116 203 172 249C226 293 272 282 315 229V355C263 321 217 329 171 361C110 403 58 373 12 337Z" fill="url(#mesh)" stroke="var(--line)"/><path d="M67 318C54 277 72 233 111 219C154 203 199 217 215 254C232 293 209 326 168 333C127 340 81 342 67 318Z" fill="var(--shade)" stroke="var(--ink)"/><text x="144" y="281" text-anchor="middle" font-size="22" class="math">𝒱ₛᵤₛ</text><circle cx="188" cy="251" r="5" fill="var(--ink)"/><line x1="188" y1="251" x2="213" y2="239" stroke="var(--ink)" stroke-dasharray="5 4"/><text x="194" y="238" font-size="14" class="math">ρ_g(x)</text><text x="218" y="236" font-size="15" class="math">∂𝒱ₛᵤₛ</text><text x="15" y="358" font-size="14" class="ital">Intrinsic safety margin on the manifold.</text></g>
<!-- 9 -->
<g transform="translate(980 0)"><text x="8" y="24" font-size="22" font-weight="700">9. Coordinate transformation</text><text x="8" y="48" font-size="15" class="ital">Geometric quantities are coordinate-invariant.</text><rect x="8" y="78" width="350" height="72" rx="8" fill="var(--soft)"/><text x="183" y="121" text-anchor="middle" font-size="19" class="math">g'ₐᵦ=(∂xⁱ/∂yᵅ)(∂xʲ/∂yᵝ)gᵢⱼ</text><text x="36" y="225" font-size="24" class="math">𝓜</text><line x1="75" y1="216" x2="210" y2="216" stroke="var(--ink)" marker-end="url(#a)"/><text x="135" y="202" font-size="17" class="math">φ</text><text x="224" y="225" font-size="22" class="math">ℝⁿ</text><text x="36" y="315" font-size="24" class="math">𝓜</text><line x1="75" y1="306" x2="210" y2="306" stroke="var(--ink)" marker-end="url(#a)"/><text x="135" y="292" font-size="17" class="math">φ'</text><text x="224" y="315" font-size="22" class="math">ℝⁿ</text><line x1="48" y1="236" x2="48" y2="286" stroke="var(--ink)" marker-end="url(#a)"/><text x="57" y="266" font-size="16" class="math">ψ</text><text x="8" y="358" font-size="14" class="ital">Geometry should not depend on coordinates.</text></g>
<!-- 10 -->
<g transform="translate(1360 0)"><text x="8" y="24" font-size="22" font-weight="700">10. Why it matters for resilient systems</text><text x="8" y="48" font-size="15" class="ital">A unifying language for complex, adaptive systems.</text><rect x="8" y="78" width="505" height="265" rx="8" fill="var(--soft)"/><g font-size="16"><text x="28" y="112">• Intrinsic distance — safety margins and viability</text><text x="28" y="146">• Curvature — constraints, divergence, uncertainty</text><text x="28" y="180">• Geodesics — efficient adaptation pathways</text><text x="28" y="214">• Stability — geometry of dynamical systems</text><text x="28" y="248">• Robustness — invariance under perturbations</text><text x="28" y="282">• Coordinate-free analysis — representation independent</text><text x="28" y="316">• Scalability — connect local structure to global behavior</text></g><text x="258" y="375" text-anchor="middle" font-size="17" class="ital">From geometry to resilient systems.</text></g>
</g>

<line x1="28" y1="1040" x2="1892" y2="1040" stroke="var(--line)"/><text x="960" y="1066" text-anchor="middle" font-size="15" class="caps">MATHEMATICS × SYSTEMS × RESILIENT FUTURES</text>
</svg>