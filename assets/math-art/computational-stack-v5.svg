IENTIFIC RENDERING</text><text x="1853.3333333333335" y="656" fill="#496355" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="middle" letter-spacing="0" font-style="normal">Visualize fields</text><text x="1853.3333333333335" y="694" fill="#176a38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" letter-spacing="0" font-style="normal">PyVista · Makie · Blender · Manim</text><circle cx="2180.0" cy="470" r="76" fill="#ffffff" stroke="#2f8f50" stroke-width="4" opacity="1"/><text x="2180.0" y="486" fill="#176a38" font-family="STIX Two Math,Cambria Math,Georgia,'Times New Roman',serif" font-size="42" font-weight="700" text-anchor="middle" letter-spacing="0" font-style="normal">▤</text><text x="2180.0" y="620" fill="#0b2114" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" text-anchor="middle" letter-spacing="0" font-style="normal">PUBLICATION</text><text x="2180.0" y="656" fill="#496355" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="middle" letter-spacing="0" font-style="normal">Document / share</text><text x="2180.0" y="694" fill="#176a38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" letter-spacing="0" font-style="normal">Quarto · LaTeX · MathJax</text><path d="M 80 800 C 320 720, 520 870, 760 800 S 1210 710, 1450 810 S 1920 885, 2320 785" stroke="#a8d8b4" stroke-width="1.4" fill="none" opacity="0.38"/><path d="M 80 816 C 320 736, 520 886, 760 816 S 1210 726, 1450 826 S 1920 901, 2320 801" stroke="#a8d8b4" stroke-width="1.4" fill="none" opacity="0.38"/><path d="M 80 832 C 320 752, 520 902, 760 832 S 1210 742, 1450 842 S 1920 917, 2320 817" stroke="#a8d8b4" stroke-width="1.4" fill="none" opacity="0.38"/><path d="M 80 848 C 320 768, 520 918, 760 848 S 1210 758, 1450 858 S 1920 933, 2320 833" stroke="#a8d8b4" stroke-width="1.4" fill="none" opacity="0.38