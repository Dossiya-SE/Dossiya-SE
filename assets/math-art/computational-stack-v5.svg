<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
<title id="title">Computational mathematics stack</title><desc id="desc">A 1920 by 600 scientific transformation pipeline from mathematical object to symbolic derivation, numerical method, implementation, verification, scientific rendering and publication.</desc>
<defs><style>:root{--bg:#fff;--ink:#0B3D24;--muted:#496355;--f:#176A38;--e:#2F8F50;--m:#6FBD83;--l:#DDEFE2;--p:#F5FBF7}@media(prefers-color-scheme:dark){:root{--bg:#06130B;--ink:#ECFFF1;--muted:#A8CBB2;--f:#8FE4A4;--e:#69D383;--m:#4BB86A;--l:#164125;--p:#0A1C10}}text{font-family:Inter,Segoe UI,Arial,sans-serif}.math{font-family:Cambria Math,STIX Two Math,Georgia,serif}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--f)"/></marker></defs>
<rect width="1920" height="600" fill="var(--bg)"/>
<text x="960" y="66" text-anchor="middle" fill="var(--ink)" font-size="40" font-weight="800">COMPUTATIONAL MATHEMATICS STACK</text>
<text x="960" y="102" text-anchor="middle" fill="var(--muted)" font-size="19" font-weight="600">Mathematics first · software serves explicit scientific roles</text>
<g stroke="var(--f)" stroke-width="3" marker-end="url(#a)"><line x1="193" y1="255" x2="347" y2="255"/><line x1="463" y1="255" x2="617" y2="255"/><line x1="733" y1="255" x2="887" y2="255"/><line x1="1003" y1="255" x2="1157" y2="255"/><line x1="1273" y1="255" x2="1427" y2="255"/><line x1="1543" y1="255" x2="1697" y2="255"/></g>
<g text-anchor="middle">
<g transform="translate(135 0)"><circle cx="0" cy="255" r="52" fill="var(--bg)" stroke="var(--e)" stroke-width="3"/><text y="269" fill="var(--f)" font-size="32" class="math">π</text><text y="335" fill="var(--ink)" font-size="18" font-weight="800">MATHEMATICAL</text><text y="360" fill="var(--ink)" font-size="18" font-weight="800">OBJECT</text><text y="410" fill="var(--muted)" font-size="18">define variables</text><text y="436" fill="var(--muted)" font-size="18">&amp; invariants</text></g>
<g transform="translate(405 0)"><circle cx="0" cy="255" r="52" fill="var(--bg)" stroke="var(--e)" stroke-width="3"/><text y="269" fill="var(--f)" font-size="32" class="math">∂</text><text y="335" fill="var(--ink)" font-size="18" font-weight="800">SYMBOLIC</text><text y="360" fill="var(--ink)" font-size="18" font-weight="800">DERIVATION</text><text y="410" fill="var(--muted)" font-size="18">SymPy · Mathematica</text><text y="436" fill="var(--muted)" font-size="18">SageMath</text></g>
<g transform="translate(675 0)"><circle cx="0" cy="255" r="52" fill="var(--bg)" stroke="var(--e)" stroke-width="3"/><text y="269" fill="var(--f)" font-size="32" class="math">Σ</text><text y="335" fill="var(--ink)" font-size="18" font-weight="800">NUMERICAL</text><text y="360" fill="var(--ink)" font-size="18" font-weight="800">METHOD</text><text y="410" fill="var(--muted)" font-size="18">NumPy · SciPy</text><text y="436" fill="var(--muted)" font-size="18">Julia · MATLAB</text></g>
<g transform="translate(945 0)"><circle cx="0" cy="255" r="52" fill="var(--bg)" stroke="var(--e)" stroke-width="3"/><text y="269" fill="var(--f)" font-size="30">&lt;/&gt;</text><text y="348" fill="var(--ink)" font-size="18" font-weight="800">IMPLEMENTATION</text><text y="410" fill="var(--muted)" font-size="18">Python · Julia · C++</text><text y="436" fill="var(--muted)" font-size="18">Rust · CUDA</text></g>
<g transform="translate(1215 0)"><circle cx="0" cy="255" r="52" fill="var(--bg)" stroke="var(--e)" stroke-width="3"/><text y="269" fill="var(--f)" font-size="32">✓</text><text y="348" fill="var(--ink)" font-size="18" font-weight="800">VERIFICATION</text><text y="410" fill="var(--muted)" font-size="18">tests · convergence</text><text y="436" fill="var(--muted)" font-size="18">CI · formal checks</text></g>
<g transform="translate(1485 0)"><circle cx="0" cy="255" r="52" fill="var(--bg)" stroke="var(--e)" stroke-width="3"/><text y="269" fill="var(--f)" font-size="32">◇</text><text y="335" fill="var(--ink)" font-size="18" font-weight="800">SCIENTIFIC</text><text y="360" fill="var(--ink)" font-size="18" font-weight="800">RENDERING</text><text y="410" fill="var(--muted)" font-size="18">PyVista · Makie</text><text y="436" fill="var(--muted)" font-size="18">TikZ · Asymptote</text></g>
<g transform="translate(1755 0)"><circle cx="0" cy="255" r="52" fill="var(--bg)" stroke="var(--e)" stroke-width="3"/><text y="269" fill="var(--f)" font-size="32">▤</text><text y="348" fill="var(--ink)" font-size="18" font-weight="800">PUBLICATION</text><text y="410" fill="var(--muted)" font-size="18">SVG · PDF · Quarto</text><text y="436" fill="var(--muted)" font-size="18">GitHub · journal</text></g>
</g>
<path d="M70 505C220 460 350 550 500 505S780 460 930 505S1210 550 1360 505S1650 460 1850 505" fill="none" stroke="var(--l)" stroke-width="2"/>
<text x="960" y="545" text-anchor="middle" fill="var(--f)" font-size="20" font-weight="700" class="math">specification → compute → verify → visualize → publish</text>
<text x="960" y="577" text-anchor="middle" fill="var(--muted)" font-size="18">Software verification increases confidence; it does not create empirical validation.</text>
</svg>