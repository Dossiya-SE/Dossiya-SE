<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1200" width="2400" height="1200" role="img" aria-label="Computational mathematics stack"><title>Computational mathematics stack</title><desc>Computational mathematics stack from mathematical objects and symbolic derivation through numerical methods, implementation, verification, scientific rendering and publication. Software tools are secondary to mathematical specification and validation.</desc><defs><linearGradient id="gline" x1="0" x2="1"><stop offset="0" stop-color="#a8d8b4"/><stop offset=".5" stop-color="#2f8f50"/><stop offset="1" stop-color="#176a38"/></linearGradient><linearGradient id="gfill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3fbf5"/><stop offset="1" stop-color="#a8d8b4"/></linearGradient><radialGradient id="halo"><stop offset="0" stop-color="#a8d8b4" stop-opacity=".35"/><stop offset="1" stop-color="#a8d8b4" stop-opacity="0"/></radialGradient><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176a38"/></marker><marker id="arrdark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0b2114"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="1200" y="92" fill="#0b2114" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="56" font-weight="800" text-anchor="middle" letter-spacing="0" font-style="normal">COMPUTATIONAL MATHEMATICS STACK</text><text x="1200" y="140" fill="#496355" font-family="STIX Two Math,Cambria Math,Georgia,'Times New Roman',serif" font-size="22" font-weight="500" text-anchor="middle" letter-spacing="0" font-style="italic">Mathematical object → symbolic derivation → numerical method → implementation → verification → rendering → publication</text><line x1="298.0" y1="470" x2="468.66666666666674" y2="470" stroke="#2f8f50" stroke-width="5" opacity="1" marker-end="url(#arr)"/><circle cx="220.