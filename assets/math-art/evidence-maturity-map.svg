<g font-size="13" fill="#83a9bf"><text x="183" y="625">scaffold</text><text x="183" y="505">prototype</text><text x="183" y="385">tested implementation</text><text x="183" y="265">controlled research system</text><text x="245" y="665">conceptual</text><text x="580" y="665">synthetic / internal</text><text x="900" y="665">empirical / bounded</text><text x="1200" y="665">field / operational</text></g>
<g font-size="14" font-weight="700">
