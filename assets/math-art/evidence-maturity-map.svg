<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
<title id="title">Portfolio evidence maturity map</title><desc id="desc">Visual map positioning repositories by implementation evidence and validation maturity without overstating unfinished work.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0c233b"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6z" fill="#7dd3fc"/></marker></defs>
<rect width="1600" height="760" rx="32" fill="url(#bg)"/><g font-family="Inter,Segoe UI,Arial"><text x="72" y="76" fill="#edf9ff" font-size="32" font-weight="800">PORTFOLIO EVIDENCE MATURITY MAP</text><text x="72" y="108" fill="#9cc7df" font-size="16">implementation evidence ↑ · external validation → · marker shape encodes epistemic status</text>
<line x1="170" y1="640" x2="1500" y2="640" stroke="#65879b" stroke-width="2" marker-end="url(#a)"/><line x1="170" y1="640" x2="170" y2="150" stroke="#65879b" stroke-width="2" marker-end="url(#a)"/>
<text x="1280" y="690" fill="#b7d4e4" font-size="16">validation maturity</text><text x="70" y="190" fill="#b7d4e4" font-size="16" transform="rotate(-90 70 190)">implementation / reproducibility evidence</text>
