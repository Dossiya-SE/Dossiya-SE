<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc"><title id="title">Evidence maturity map</title><desc id="desc">Adaptive visual separating evidence-bearing research implementations, prototypes, learning artifacts and future validation targets. Position is descriptive, not a ranking or certification.</desc><style>:root{--bg:#fff;--panel:#f8fafc;--fg:#0f172a;--muted:#475569;--border:#94a3b8;--obs:#0369a1;--state:#1d4ed8;--viable:#047857;--unc:#b45309;--hyp:#be185d;--grid:#cbd5e1}@media(prefers-color-scheme:dark){:root{--bg:#07111f;--panel:#0e1d31;--fg:#eaf1f8;--muted:#9eb0c3;--border:#355a7b;--obs:#38bdf8;--state:#60a5fa;--viable:#34d399;--unc:#fbbf24;--hyp:#f472b6;--grid:#28445f}}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--border)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.grid{stroke:var(--grid);fill:none}text{font-family:Inter,Segoe UI,Arial,sans-serif}</style><rect class="bg" width="1600" height="700" rx="26"/><text x="70" y="66" class="fg" font-size="38" font-weight="800">EVIDENCE MATURITY — DESCRIPTIVE, NOT CERTIFICATION</text><text x="70" y="101" class="muted" font-size="17">implementation maturity and validation maturity are separate axes</text><rect x="90" y="150" width="1040" height="450" rx="18" class="panel"/><g class="grid" opacity=".7"><path d="M200 540H1060M200 460H1060M200 380H1060M200 300H1060M200 220H1060"/><path d="M300 190V540M460 190V540M620 190V540M780 190V540M940 190V540"/></g><path d="M200 540H1070" stroke="var(--fg)"/><path d="M200 540V185" stroke="var(--fg)"/><text x="580" y="585" class="muted" font-size="14">implementation / reproducibility maturity →</text><text x="128" y="390" class="muted" font-size="14" transform="rotate(-90 128 390)">external / empirical validation maturity →</text><g font-size="13" font-weight="700"><circle cx="900" cy="320" r="12" fill="var(--obs)"/><text x="920" y="325" class="fg">Mathematical Research Portfolio</text><circle cx="850" cy="350" r="12" fill="var(--viable)"/><text x="870" y="355" class="fg">Africa Energy Dignity</text><circle cx="830" cy="390" r="12" fill="var(--state)"/><text x="850" y="395" class="fg">Financial Engineering Models</text><circle cx="710" cy="430" r="12" fill="var(--unc)"/><text x="730" y="435" class="fg">Rapid Engineering EDA</text><rect x="430" y="470" width="22" height="22" rx="3" fill="var(--hyp)"/><text x="465" y="486" class="fg">Learning / prototype repositories</text></g><rect x="1170" y="150" width="360" height="450" rx="18" class="panel"/><text x="1195" y="190" class="fg" font-size="20" font-weight="700">Interpretation</text><circle cx="1208" cy="235" r="10" fill="var(--obs)"/><text x="1230" y="240" class="muted" font-size="14">circle = evidence-bearing implementation</text><rect x="1198" y="275" width="20" height="20" rx="3" fill="var(--hyp)"/><text x="1230" y="290" class="muted" font-size="14">square = prototype / learning scaffold</text><text x="1195" y="340" class="fg" font-size="18" font-weight="700">Important boundary</text><text x="1195" y="375" class="muted" font-size="14">software verification can increase</text><text x="1195" y="400" class="muted" font-size="14">implementation confidence without</text><text x="1195" y="425" class="muted" font-size="14">creating field validation.</text><text x="1195" y="475" class="muted" font-size="14">Theme changes no position, score,</text><text x="1195" y="500" class="muted" font-size="14">category, or scientific conclusion.</text><text x="1195" y="550" class="fg" font-size="15" font-weight="700">claim strength ≤ evidence strength</text><text x="90" y="650" class="muted" font-size="14">Exact positions are qualitative descriptors of repository state; they are not numeric performance scores, rankings, certifications, or comparative research quality judgments.</text></svg>