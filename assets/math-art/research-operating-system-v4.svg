<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
<title id="title">Mathematical research operating system</title>
<desc id="desc">Adaptive light and dark systems diagram connecting coupled dynamics, inverse problems, uncertainty, viability, control, multi-objective design and evidence validation.</desc>
<style>
:root{--bg:#fff;--panel:#f8fafc;--fg:#0f172a;--muted:#475569;--border:#94a3b8;--state:#1d4ed8;--interface:#7e22ce;--unc:#b45309;--viable:#047857;--recovery:#0f766e;--decision:#a16207;--hazard:#b91c1c;--observed:#0369a1}
@media(prefers-color-scheme:dark){:root{--bg:#07111f;--panel:#0e1d31;--fg:#eaf1f8;--muted:#9eb0c3;--border:#355a7b;--state:#60a5fa;--interface:#c084fc;--unc:#fbbf24;--viable:#34d399;--recovery:#5eead4;--decision:#facc15;--hazard:#fb7185;--observed:#38bdf8}}
.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--border);stroke-width:1.5}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.state{stroke:var(--state);fill:none}.iface{stroke:var(--interface);fill:none}.unc{stroke:var(--unc);fill:none}.viable{stroke:var(--viable);fill:none}.recovery{stroke:var(--recovery);fill:none}.decision{stroke:var(--decision);fill:none}.hazard{stroke:var(--hazard);fill:none}.obs{fill:var(--observed)}text{font-family:Inter,Segoe UI,Arial,sans-serif}.math{font-family:Georgia,'Times New Roman',serif}</style>
<rect class="bg" width="1600" height="820" rx="28"/>
<text x="70" y="65" class="fg" font-size="38" font-weight="800">MATHEMATICAL RESEARCH OPERATING SYSTEM</text><text x="70" y="98" class="muted" font-size="17">physics → evidence → inference → geometry → control → design → validation</text>
<g transform="translate(55 135)">
<rect class="panel" width="355" height="255" rx="18"/><text x="24" y="38" class="fg" font-size="20" font-weight="700">1 · Coupled dynamics</text><text x="24" y="78" class="fg math" font-size="20">ẋᵢ=fᵢ(xᵢ,θᵢ)+Σⱼgᵢⱼ(xᵢ,xⱼ,Gᵢⱼ)+Bᵢuᵢ+ξᵢ</text><circle cx="70" cy="170" r="25" fill="var(--state)"/><circle cx="175" cy="135" r="25" fill="var(--viable)"/><circle cx="280" cy="170" r="25" fill="var(--decision)"/><circle cx="175" cy="220" r="25" fill="var(--interface)"/><path d="M95 166L150 143M199 143L255 166M92 178L151 211M199 211L258 178" class="iface" stroke-width="3"/><g class="fg" font-weight="700"><text x="70" y="176" text-anchor="middle">P</text><text x="175" y="141" text-anchor="middle">W</text><text x="280" y="176" text-anchor="middle">T</text><text x="175" y="226" text-anchor="middle">SW</text></g>
</g>
<g transform="translate(430 135)"><rect class="panel" width="355" height="255" rx="18"/><text x="24" y="38" class="fg" font-size="20" font-weight="700">2 · Inverse problem</text><text x="24" y="78" class="fg math" font-size="20">yₖ=h(xₖ,θ)+εₖ</text><text x="24" y="106" class="fg math" font-size="20">π(θ|y) ∝ L(y|θ)π₀(θ)</text><path d="M35 210C95 165 130 215 175 165S275 145 325 190" class="state" stroke-width="4"/><path d="M35 220C95 185 135 185 180 180S260 165 325 170" class="unc" stroke-width="3" stroke-dasharray="7 5"/><g class="obs"><circle cx="65" cy="197" r="5"/><circle cx="110" cy="186" r="5"/><circle cx="165" cy="177" r="5"/><circle cx="220" cy="160" r="5"/><circle cx="275" cy="164" r="5"/></g></g>
<g transform="translate(805 135)"><rect class="panel" width="355" height="255" rx="18"/><text x="24" y="38" class="fg" font-size="20" font-weight="700">3 · Uncertainty</text><text x="24" y="78" class="fg math" font-size="20">θ∼p(θ), X=Φ(θ,η,u)</text><text x="24" y="106" class="fg math" font-size="20">P_f=ℙ[g(X)≤0]</text><path d="M35 195C95 115 160 110 235 170S310 195 330 175" class="state" stroke-width="4"/><path d="M35 205C95 125 160 120 235 180S310 205 330 185" class="unc" stroke-width="22" opacity=".22"/><path d="M255 120V225" class="hazard" stroke-width="2" stroke-dasharray="7 5"/><text x="265" y="137" class="muted" font-size="12">limit state</text></g>
<g transform="translate(1180 135)"><rect class="panel" width="365" height="255" rx="18"/><text x="24" y="38" class="fg" font-size="20" font-weight="700">4 · Viability geometry</text><text x="24" y="78" class="fg math" font-size="18">V={x₀∈K:∃u(·),x(t)∈K ∀t}</text><ellipse cx="187" cy="166" rx="140" ry="72" class="viable" stroke-width="3"/><ellipse cx="210" cy="166" rx="85" ry="45" class="state" stroke-width="2" stroke-dasharray="7 5"/><path d="M55 212C105 180 125 196 150 170S235 132 322 165" class="recovery" stroke-width="4"/><text x="240" y="228" class="muted" font-size="12">recovery trajectory</text></g>

<g transform="translate(55 420)"><rect class="panel" width="480" height="295" rx="18"/><text x="24" y="38" class="fg" font-size="20" font-weight="700">5 · Control &amp; recovery</text><text x="24" y="78" class="fg math" font-size="20">u*=arg min J(x,u)</text><text x="24" y="106" class="muted" font-size="13">subject to dynamics, budget, service, equity, safety</text><path d="M45 235C120 235 170 175 245 150S360 165 435 115" class="recovery" stroke-width="5"/><path d="M45 235C120 245 175 210 245 175S350 220 435 175" class="hazard" stroke-width="4"/><text x="290" y="135" fill="var(--recovery)" font-size="12">controlled</text><text x="300" y="210" fill="var(--hazard)" font-size="12">uncontrolled</text></g>
<g transform="translate(555 420)"><rect class="panel" width="480" height="295" rx="18"/><text x="24" y="38" class="fg" font-size="20" font-weight="700">6 · Multi-objective design</text><text x="24" y="78" class="fg math" font-size="19">min [cost(d),risk(d),carbon(d)]</text><text x="24" y="106" class="fg math" font-size="19">max [resilience(d),equity(d)]</text><path d="M60 245C120 180 185 145 250 140S365 150 420 185" class="decision" stroke-width="5"/><g fill="var(--decision)"><circle cx="96" cy="206" r="6"/><circle cx="170" cy="160" r="6"/><circle cx="250" cy="140" r="6"/><circle cx="335" cy="149" r="6"/></g><text x="250" y="205" class="muted" font-size="13">Pareto-efficient frontier</text></g>
<g transform="translate(1055 420)"><rect class="panel" width="490" height="295" rx="18"/><text x="24" y="38" class="fg" font-size="20" font-weight="700">7 · Evidence &amp; validation</text><g font-size="14" font-weight="700"><rect x="35" y="90" width="110" height="48" rx="10" fill="var(--observed)"/><text x="90" y="120" text-anchor="middle" fill="#fff">Observed</text><rect x="188" y="90" width="110" height="48" rx="10" fill="var(--viable)"/><text x="243" y="120" text-anchor="middle" fill="#fff">Derived</text><rect x="341" y="90" width="110" height="48" rx="10" fill="var(--decision)"/><text x="396" y="120" text-anchor="middle" fill="#fff">Model output</text><rect x="35" y="185" width="110" height="48" rx="10" fill="var(--interface)"/><text x="90" y="215" text-anchor="middle" fill="#fff">Verify</text><rect x="188" y="185" width="110" height="48" rx="10" fill="var(--hazard)"/><text x="243" y="215" text-anchor="middle" fill="#fff">Validate</text><rect x="341" y="185" width="110" height="48" rx="10" fill="var(--muted)"/><text x="396" y="215" text-anchor="middle" fill="var(--bg)">Bound claim</text></g><text x="35" y="267" class="muted" font-size="14">claim strength ≤ evidence strength</text></g>
<text x="55" y="785" class="muted" font-size="13">visual ontology: solid = declared/implemented · dashed = uncertainty/boundary · geometry = admissibility/viability · trajectories = dynamics/control</text>
</svg>