<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 760" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
<title id="title">Differential Geometry Foundations for resilient systems</title>
<desc id="desc">Native vector mathematical plate showing local coordinates, a smooth manifold, tangent space, metric tensor, geodesic, curvature and distance to a viability boundary.</desc>
<metadata>Native editable SVG. Mathematical foundations are separated from engineering interpretation and empirical validation.</metadata>
<defs><style>
:root{--bg:#fbfaf5;--panel:#fff;--ink:#111613;--muted:#5b665e;--line:#dfe4df;--green:#355f47;--green2:#73927d;--pale:#e8efe8;--gold:#a9781d;--goldp:#eadbbc}
@media(prefers-color-scheme:dark){:root{--bg:#07100b;--panel:#0b1710;--ink:#f0f4f1;--muted:#a9b5ad;--line:#213229;--green:#88c49d;--green2:#5fa577;--pale:#142e20;--gold:#dfb75c;--goldp:#4a3a1d}}
text{font-family:Inter,Segoe UI,Arial,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}.math{font-family:'STIX Two Math','Cambria Math',serif}
</style><pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0H0V46" fill="none" stroke="var(--line)" opacity=".45"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--gold)"/></marker></defs>
<rect width="1920" height="760" fill="var(--bg)"/><rect width="1920" height="760" fill="url(#grid)" opacity=".26"/>
<text x="960" y="62" text-anchor="middle" fill="var(--ink)" font-size="50" font-weight="650" class="serif">Differential Geometry <tspan fill="var(--gold)">Foundations</tspan></text>
<text x="960" y="98" text-anchor="middle" fill="var(--muted)" font-size="16" font-weight="750" letter-spacing="4">MANIFOLDS · GEODESICS · CURVATURE · METRIC STRUCTURE · VIABILITY</text>
<g transform="translate(85 150)"><text x="0" y="0" fill="var(--ink)" font-size="24" font-weight="700" class="serif">Local chart</text><text x="0" y="36" fill="var(--ink)" font-size="24" class="math">φ: U → ℝ²</text><rect x="0" y="65" width="180" height="150" fill="var(--panel)" stroke="var(--line)"/><g stroke="var(--line)" stroke-width="1"><line x1="30" y1="65" x2="30" y2="215"/><line x1="60" y1="65" x2="60" y2="215"/><line x1="90" y1="65" x2="90" y2="215"/><line x1="120" y1="65" x2="120" y2="215"/><line x1="150" y1="65" x2="150" y2="215"/><line x1="0" y1="95" x2="180" y2="95"/><line x1="0" y1="125" x2="180" y2="125"/><line x1="0" y1="155" x2="180" y2="155"/><line x1="0" y1="185" x2="180" y2="185"/></g><path d="M45 180C25 140 45 100 82 89c35-10 62 20 64 55 2 33-23 53-55 50-19-2-31-4-46-14Z" fill="var(--pale)" stroke="var(--green)" stroke-width="2"/><text x="93" y="148" text-anchor="middle" fill="var(--green)" font-size="25" class="math">U</text><line x1="0" y1="215" x2="193" y2="215" stroke="var(--ink)"/><line x1="0" y1="215" x2="0" y2="53" stroke="var(--ink)"/><text x="193" y="235" fill="var(--ink)" class="math">y¹</text><text x="-18" y="54" fill="var(--ink)" class="math">y²</text><text x="0" y="252" fill="var(--muted)" font-size="16" class="math">x=φ⁻¹(y¹,y²)</text></g>
<g transform="translate(420 150)"><path d="M0 320C120 85 260 55 405 142C545 226 650 58 830 132C954 184 1020 255 1100 285C1015 376 885 388 760 339C595 274 470 405 305 360C160 321 78 398 0 320Z" fill="var(--pale)" stroke="var(--green2)" stroke-width="3"/>
<g fill="none" stroke="var(--line)" opacity=".85"><path d="M70 302C160 145 270 120 390 180C500 235 610 135 730 170C840 202 930 286 1020 299"/><path d="M35 333C160 220 280 215 398 245C520 276 616 196 742 228C870 260 935 325 1035 329"/><path d="M165 130C225 210 205 300 155 365"/><path d="M350 120C410 215 405 295 355 370"/><path d="M535 125C590 205 585 295 540 358"/><path d="M720 128C770 210 770 295 725 350"/><path d="M905 152C948 223 950 289 910 342"/></g>
<text x="165" y="310" fill="var(--ink)" font-size="56" class="math">ℳ</text>
<polygon points="355,75 630,100 575,245 302,218" fill="var(--panel)" fill-opacity=".86" stroke="var(--green2)" stroke-width="2"/><circle cx="445" cy="155" r="7" fill="var(--ink)"/><text x="420" y="145" fill="var(--ink)" font-size="25" class="math">p</text><text x="565" y="128" fill="var(--ink)" font-size="27" class="math">Tₚℳ</text><line x1="445" y1="155" x2="565" y2="155" stroke="var(--gold)" stroke-width="4" marker-end="url(#a)"/><line x1="445" y1="155" x2="490" y2="90" stroke="var(--gold)" stroke-width="4" marker-end="url(#a)"/><text x="572" y="160" fill="var(--ink)" font-size="23" class="math">e₁</text><text x="493" y="84" fill="var(--ink)" font-size="23" class="math">e₂</text>
<path d="M445 157C525 220 565 270 650 288C760 310 820 275 908 335" fill="none" stroke="var(--gold)" stroke-width="5" marker-end="url(#a)"/><circle cx="650" cy="288" r="6" fill="var(--green)"/><text x="690" y="275" fill="var(--ink)" font-size="24" class="math">γ(t)</text>
<path d="M770 116L835 178" stroke="var(--green2)" stroke-dasharray="5 5"/><text x="785" y="82" fill="var(--ink)" font-size="22" font-weight="700" class="serif">Metric tensor</text><text x="785" y="109" fill="var(--ink)" font-size="20" class="math">g=gᵢⱼ dxⁱ⊗dxʲ</text>
<text x="935" y="122" fill="var(--ink)" font-size="22" font-weight="700" class="serif">Curvature</text><text x="935" y="150" fill="var(--ink)" font-size="20" class="math">K / κ</text><path d="M935 170C970 125 1010 215 1065 162" fill="none" stroke="var(--green)" stroke-width="2"/><path d="M935 176C970 215 1010 125 1065 182" fill="none" stroke="var(--green2)" stroke-width="2"/>
<text x="885" y="400" fill="var(--ink)" font-size="22" font-weight="700" class="serif">Geodesic</text><text x="885" y="430" fill="var(--ink)" font-size="20" class="math">∇_{γ̇}γ̇=0</text></g>
<g transform="translate(320 570)"><rect x="0" y="0" width="1280" height="82" rx="16" fill="var(--panel)" stroke="var(--line)"/><text x="210" y="50" text-anchor="middle" fill="var(--ink)" font-size="28" class="math">ds²=gᵢⱼ dxⁱdxʲ</text><line x1="420" y1="15" x2="420" y2="67" stroke="var(--gold)"/><text x="640" y="50" text-anchor="middle" fill="var(--ink)" font-size="28" class="math">∇_{γ̇}γ̇=0</text><line x1="860" y1="15" x2="860" y2="67" stroke="var(--gold)"/><text x="1060" y="50" text-anchor="middle" fill="var(--ink)" font-size="28" class="math">ρ_g(x)=d_g(x,∂V)</text></g>
<g transform="translate(120 690)" font-size="13" text-anchor="middle"><g transform="translate(0)"><text x="110" y="0" fill="var(--ink)" font-weight="800">LOCAL COORDINATES</text><text x="110" y="22" fill="var(--muted)">charts · transition maps</text></g><g transform="translate(280)"><text x="110" y="0" fill="var(--ink)" font-weight="800">TANGENT SPACE</text><text x="110" y="22" fill="var(--muted)">linear approximation at p</text></g><g transform="translate(560)"><text x="110" y="0" fill="var(--ink)" font-weight="800">METRIC</text><text x="110" y="22" fill="var(--muted)">lengths · angles · distances</text></g><g transform="translate(840)"><text x="110" y="0" fill="var(--ink)" font-weight="800">GEODESICS</text><text x="110" y="22" fill="var(--muted)">intrinsic paths on ℳ</text></g><g transform="translate(1120)"><text x="110" y="0" fill="var(--ink)" font-weight="800">CURVATURE</text><text x="110" y="22" fill="var(--muted)">intrinsic bending</text></g><g transform="translate(1400)"><text x="110" y="0" fill="var(--ink)" font-weight="800">VIABILITY BOUNDARY</text><text x="110" y="22" fill="var(--muted)">distance to constraints</text></g></g>
</svg>