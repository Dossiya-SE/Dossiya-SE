<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1200" width="2400" height="1200" role="img" aria-label="Differential geometry — source mathematics and research transfer"><title>Differential geometry — source mathematics and research transfer</title><desc>Differential-geometry visual showing a mathematically defined surface, tangent structure, normal direction and geodesic concepts, while separating source mathematics from engineering research transfer and validation.</desc><defs><linearGradient id="gline" x1="0" x2="1"><stop offset="0" stop-color="#a8d8b4"/><stop offset=".5" stop-color="#2f8f50"/><stop offset="1" stop-color="#176a38"/></linearGradient><linearGradient id="gfill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3fbf5"/><stop offset="1" stop-color="#a8d8b4"/></linearGradient><radialGradient id="halo"><stop offset="0" stop-color="#a8d8b4" stop-opacity=".35"/><stop offset="1" stop-color="#a8d8b4" stop-opacity="0"/></radialGradient><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176a38"/></marker><marker id="arrdark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0b2114"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="1200" y="92" fill="#0b2114" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="800" text-anchor="middle" letter-spacing="0" font-style="normal">DIFFERENTIAL GEOMETRY — SOURCE MATHEMATICS</text><text x="1200" y="138" fill="#496355" font-family="STIX Two Math,Cambria Math,Georgia,'Times New Roman',serif" font-size="24" font-weight="500" text-anchor="middle" letter-spacing="0" font-style="italic">Metric → Connection → Curvature → Geodesics → Topology</text><circle cx="1180" cy="620" r="310" fill="#f3fbf5" stroke="#2f8f50" stroke-width="3" opacity="1"/><ellipse cx="1180" cy="813.2968701246866" rx="155.00000000000003" ry="49.60000000000001" fill="none" stroke="#a8d8b4" stroke-width="1.8" opacity=".65"/><ellipse cx="1180" cy="763.4701944820356" rx="237.47377736688318" ry="75.99160875740262" fill="none" stroke="#a8d8b4" stroke-width="1.8" opacity=".65"/><ellipse cx="1180" cy="696.3388959902893" rx="291.3047124436316" ry="93.21750798196211" fill="none" stroke="#a8d8b4" stroke-width="1.8" opacity=".65"/><ellipse cx="1180" cy="620.0" rx="310.0" ry="99.2" fill="none" stroke="#a8d8b4" stroke-width="1.8" opacity=".65"/><ellipse cx="1180" cy="543.6611040097107" rx="291.3047124436316" ry="93.21750798196211" fill="none" stroke="#a8d8b4" stroke-width="1.8" opacity=".65"/><ellipse cx="1180" cy="476.5298055179644" rx="237.47377736688318" ry="75.99160875740262" fill="none" stroke="#a8d8b4" stroke-width="1.8" opacity=".65"/><ellipse cx="1180" cy="426.7031298753133" rx="155.00000000000003" ry="49.60000000000001" fill="none" stroke="#a8d8b4" stroke-width="1.8" opacity=".65"/><ellipse cx="1180" cy="620" rx="311.0" ry="310" fill="none" stroke="#a8d8b4" stroke-width="1.5" opacity=".55" transform="rotate(-75.0 1180 620)"/><ellipse cx="1180" cy="620" rx="269.467875173176" ry="310" fill="none" stroke="#a8d8b4" stroke-width="1.5" opacity=".55" transform="rotate(-45.0 1180 620)"/><ellipse cx="1180" cy="620" rx="156.00000000000003" ry="310" fill="none" stroke="#a8d8b4" stroke-width="1.5" opacity=".55" transform="rotate(-15.0 1180 620)"/><ellipse cx="1180" cy="620" rx="1.0000000000000189" ry="310" fill="none" stroke="#a8d8b4" stroke-width="1.5" opacity=".55" transform="rotate(15.0 1180 620)"/><ellipse cx="1180" cy="620" rx="155.99999999999994" ry="310" fill="none" stroke="#a8d8b4" stroke-width="1.5" opacity=".55" transform="rotate(45.0 1180 620)"/><ellipse cx="1180" cy="620" rx="269.467875173176" ry="310" fill="none" stroke="#a8d8b4" stroke-width="1.5" opacity=".55" transform="rotate(75.0 1180 620)"/><ellipse cx="1180" cy="620" rx="288.3" ry="105.4" fill="none" stroke="#176a38" stroke-width="7" transform="rotate(-18 1180 620)"/><circle cx="1295" cy="500" r="10" fill="#0b2114" stroke="#ffffff" stroke-width="2" opacity="1"/><path d="M 1175 535 L 1410 475 L 1460 570 L 1225 630 Z" stroke="#6fbd83" stroke-width="3" fill="#dbeee0" opacity="0.48"/><line x1="1295" y1="500" x2="1445" y2="460" stroke="#176a38" stroke-width="5" opacity="1" marker-end="url(#arr)"/><text x="1460" y="456" fill="#176a38" font-family="STIX Two Math,Cambria Math,Georgia,'Times New Roman',serif" font-size="25" font-weight="700" text-anchor="start" letter-spacing="0" font-style="normal">e₁</text><line x1="1295" y1="500" x2="1225" y2="635" stroke="#2f8f50" stroke-width="5" opacity="1" marker-end="url(#arr)"/><text x="1210" y="660" fill="#2f8f50" font-family="STIX Two Math,Cambria Math,Georgia,'Times New Roman',serif" font-size="25" font-weight="700" text-anchor="start" letter-spacing="0" font-style="normal">e₂</text><line x1="1295" y1="500" x2="1330" y2="325" stroke="#0b2114" stroke-width="5" opacity="1" marker-end="url(#arr)"/><text x="1347" y="325" fill="#0b2114" font-family="STIX Two Math,Cambria Math,Georgia,'Times New Roman',serif" font-size="26" font-weight="700" text-anchor="start" letter-spacing="0" font-style="normal">n</text><text x="1385" y="825" fill="#176a38" font-family="STIX Two Math,Cambria Math,Georgia,'Times New Roman',serif" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="0" font-style="normal">γ(s)  great-circle geodesic</text><text x="120" y="220" fill="#176a38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="800" text-anchor="start" letter-spacing="0" font-style="normal">[S] MANIFOLD &amp; METRIC</text><text x="120" y="270" fill="#496355" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0" font-style="normal">Sphere</text><text x="120" y="304" fill="#0b2114" font-family="STIX Two Math,Cambria Math,Georgia,'Times New Roman',serif" font-size="22" font-weight="500" text-anchor="start" letter-spacing="0" font-style="normal">r(θ,φ) = (R sinθ cosφ, R sinθ sinφ, R cosθ)</text><text x="120" y="362" fill="#496355" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0" font-style="normal">Tangent basis</text><text x="120" y="396" fill="#0b2114" font-family="STIX Two Math,Cambria Math,Georgia,'Times New Roman',serif" font-size="22" font-weight="500" text-anchor="start" letter-spacing="0" font-style="normal">e₁ = ∂θr,   e₂ = ∂φr</text><text x="120" y="454" fill="#496355" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0" font-style="normal">Metric</text><text x="120" y="488" fill="#0b2114" font-family="STIX Two Math,Cambria Math,Georgia,'Times New Roman',serif" font-size="22" font-weight="500" text-anchor="start" letter-spacing="0" font-style="normal">gᵢⱼ = eᵢ · eⱼ</text><text x="120" y="546" fill="#496355" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0" font-style="normal">Normal</text><text x="120" y="580" fill="#0b2114" font-family="STIX Two Math,Cambria Math,Georgia,'Times New Roman',serif" font-size="22" font-weight="500" text-anchor="start" letter-spacing="0" font-style="normal">n = (e₁ × e₂) / ‖e₁ × e₂‖</text><text x="120" y="638" fill="#496355" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0" font-style="normal">Connection</text><text x="120" y="672" fill="#0b2114" font-family="STIX Two Math,Cambria Math,Georgia,'Times New Roman',serif" font-size="22" font-weight="500" text-anchor="start" letter-spacing="0" font-style="normal">Γᵅβγ = ½gᵅδ(∂βgγδ + ∂γgβδ − ∂δgβγ)</text><text x="120" y="730" fill="#496355" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0" font-style="normal">Curvature</text><text x="120" y="764" fill="#0b2114" font-family="STIX Two Math,Cambria Math,Georgia,'Times New Roman',serif" font-size="22" font-weight="500" text-anchor="start" letter-spacing="0" font-style="normal">K = 1/R²,   H = 1/R</text><text x="120" y="822" fill="#496355" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0" font-style="normal">Geodesic</text><text x="120" y="856" fill="#0b2114" font-family="STIX Two Math,Cambria Math,Georgia,'Times New Roman',serif" font-size="22" font-weight="500" text-anchor="start" letter-spacing="0" font-style="normal">d²uᵅ/ds² + Γᵅβγ (duᵝ/ds)(duᵞ/ds) = 0</text><text x="120" y="914" fill="#496355" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0" font-style="normal">Gauss–Bonnet</text><text x="120" y="948" fill="#0b2114" font-family="STIX Two Math,Cambria Math,Georgia,'Times New Roman',serif" font-size="22" font-weight="500" text-anchor="start" letter-spacing="0" font-style="normal">∬ₘ K dA = 2πχ(M)  for a closed surface</text><rect x="1580" y="770" width="700" height="265" rx="28" fill="#f3fbf5" stroke="#a8d8b4" stroke-width="2" opacity="1"/><text x="1615" y="820" fill="#176a38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800" text-anchor="start" letter-spacing="0" font-style="normal">RESEARCH-TRANSFER BOUNDARY</text><text x="1615" y="865" fill="#496355" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="500" text-anchor="start"><tspan x="1615" dy="0">Source differential geometry ≠ geometric metaphor.</tspan><tspan x="1615" dy="25.6">Infrastructure state geometry requires a declared metric,</tspan><tspan x="1615" dy="25.6">differentiability assumptions, estimator, and validation.</tspan><tspan x="1615" dy="25.6">Hypotheses remain hypotheses until tested.</tspan></text><text x="1200.0" y="1145" fill="#176a38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="4" font-style="normal">RIGOR  •  STRUCTURE  •  ELEGANCE  •  IMPACT</text></svg>