<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 760" role="img" aria-labelledby="title desc">
<title id="title">Differential Geometry Foundations for resilient systems</title>
<desc id="desc">Modern monochrome mathematical plate showing manifolds, tangent spaces, metrics, geodesics, geodesic distance, curvature, normal coordinates, exponential maps, viability geometry and coordinate transformations.</desc>
<metadata>Native editable SVG. Mathematical foundations are separated from engineering interpretation and empirical validation.</metadata>
<defs><style>
:root{--bg:#fff;--ink:#111;--muted:#626262;--soft:#f3f3f3;--line:#c9c9c9;--shade:#e8e8e8;--mesh:#d6d6d6}
@media(prefers-color-scheme:dark){:root{--bg:#fff;--ink:#111;--muted:#626262;--soft:#f3f3f3;--line:#c9c9c9;--shade:#e8e8e8;--mesh:#d6d6d6}}
text{font-family:Georgia,'Times New Roman',serif;fill:var(--ink)}.math{font-family:'STIX Two Math','Cambria Math',Georgia,serif}.ital{font-style:italic}.caps{letter-spacing:2px}
</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--ink)"/></marker><pattern id="mesh" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M14 0H0V14" fill="none" stroke="var(--mesh)" stroke-width=".6"/></pattern></defs>
<rect width="1920" height="760" fill="var(--bg)"/>
<text x="960" y="48" text-anchor="middle" font-size="48" font-style="italic" font-weight="700">Differential Geometry Foundations</text><text x="960" y="78" text-anchor="middle" font-size="22" class="ital">Geometry for resilient systems</text><line x1="20" y1="96" x2="1900" y2="96" stroke="var(--line)"/>

<!-- top row 1-5 -->
<g transform="translate(18 112)"><g stroke="var(--line)"><line x1="372" y1="0" x2="372" y2="284"/><line x1="750" y1="0" x2="750" y2="284"/><line x1="1128" y1="0" x2="1128" y2="284"/><line x1="1506" y1="0" x2="1506" y2="284"/></g>
<g><text x="8" y="22" font-size="18" font-weight="700">1. Manifold and local chart</text><text x="8" y="42" font-size="13" class="ital">A smooth manifold is locally Euclidean.</text><path d="M8 170C55 82 115 75 168 124C219 171 270 163 320 102V222C269 190 223 199 178 230C118 270 57 248 8 210Z" fill="url(#mesh)" stroke="var(--line)"/><polygon points="92,94 213,78 262,111 138,127" fill="var(--soft)" stroke="var(--line)"/><circle cx="163" cy="115" r="5" fill="var(--ink)"/><line x1="163" y1="115" x2="203" y2="96" stroke="var(--ink)" marker-end="url(#a)"/><line x1="163" y1="115" x2="163" y2="80" stroke="var(--ink)" marker-end="url(#a)"/><text x="214" y="93" font-size="14" class="math">e₁</text><text x="171" y="80" font-size="14" class="math">e₂</text><text x="195" y="85" font-size="14" class="math">Tₓ𝓜</text><text x="20" y="242" font-size="24" class="math">𝓜</text><text x="230" y="62" font-size="18" class="math">φ:U⊂𝓜→ℝⁿ</text></g>
<g transform="translate(380)"><text x="8" y="22" font-size="18" font-weight="700">2. Riemannian metric</text><text x="8" y="42" font-size="13" class="ital">Lengths, angles, intrinsic geometry.</text><rect x="8" y="62" width="330" height="75" rx="7" fill="var(--soft)"/><text x="173" y="91" text-anchor="middle" font-size="22" class="math">g=gᵢⱼ duⁱ⊗duʲ</text><text x="173" y="122" text-anchor="middle" font-size="22" class="math">ds²=gᵢⱼ dxⁱdxʲ</text><path d="M18 228C64 153 119 150 166 191C209 230 258 221 306 169V263C258 239 215 247 174 273C116 309 64 287 18 258Z" fill="url(#mesh)" stroke="var(--line)"/><circle cx="133" cy="228" r="4" fill="var(--ink)"/><line x1="133" y1="228" x2="183" y2="201" stroke="var(--ink)" marker-end="url(#a)"/><line x1="133" y1="228" x2="115" y2="186" stroke="var(--ink)" marker-end="url(#a)"/><text x="204" y="197" font-size="13">Length · angle · distance</text></g>
<g transform="translate(758)"><text x="8" y="22" font-size="18" font-weight="700">3. Geodesics</text><text x="8" y="42" font-size="13" class="ital">Locally length-minimizing curves.</text><rect x="8" y="62" width="315" height="61" rx="7" fill="var(--soft)"/><text x="166" y="101" text-anchor="middle" font-size="26" class="math">∇_{γ̇}γ̇=0</text><path d="M11 225C55 160 111 153 164 191C215 229 262 220 310 170V268C261 242 215 249 171 275C117 308 60 290 11 260Z" fill="url(#mesh)" stroke="var(--line)"/><path d="M64 259C112 222 162 213 207 197C244 184 275 169 298 151" fill="none" stroke="var(--ink)" stroke-width="2.2" marker-end="url(#a)"/><circle cx="64" cy="259" r="5" fill="var(--ink)"/><circle cx="298" cy="151" r="5" fill="var(--ink)"/><text x="54" y="279" font-size="14" class="math">p</text><text x="301" y="149" font-size="14" class="math">q</text><text x="196" y="204" font-size="14" class="math">γ(s)</text></g>
<g transform="translate(1136)"><text x="8" y="22" font-size="18" font-weight="700">4. Geodesic distance</text><text x="8" y="42" font-size="13" class="ital">Intrinsic shortest-path distance.</text><rect x="8" y="62" width="335" height="77" rx="7" fill="var(--soft)"/><text x="176" y="94" text-anchor="middle" font-size="19" class="math">d_g(p,q)=inf_{γ∈Γ(p,q)}L(γ)</text><text x="176" y="122" text-anchor="middle" font-size="17" class="math">L(γ)=∫√(g(γ̇,γ̇))ds</text><path d="M12 229C57 173 108 164 158 191C208 218 254 211 300 168V264C252 237 210 243 167 269C111 302 61 286 12 257Z" fill="url(#mesh)" stroke="var(--line)"/><circle cx="66" cy="252" r="4" fill="var(--ink)"/><circle cx="273" cy="195" r="4" fill="var(--ink)"/><path d="M66 252C124 232 184 216 273 195" fill="none" stroke="var(--ink)" stroke-width="2" marker-end="url(#a)"/><path d="M66 252C123 185 193 180 273 195" fill="none" stroke="var(--muted)" stroke-dasharray="5 4"/></g>
<g transform="translate(1514)"><text x="8" y="22" font-size="18" font-weight="700">5. Curvature</text><text x="8" y="42" font-size="13" class="ital">Intrinsic non-Euclidean structure.</text><rect x="8" y="62" width="365" height="70" rx="7" fill="var(--soft)"/><text x="190" y="92" text-anchor="middle" font-size="15" class="math">R(X,Y)Z=∇ₓ∇ᵧZ−∇ᵧ∇ₓZ−∇_[X,Y]Z</text><text x="190" y="117" text-anchor="middle" font-size="17" class="math">Rⁱⱼₖₗ</text><path d="M16 225C56 166 107 160 153 194C201 229 248 221 286 178V270C246 244 204 251 161 277C109 307 59 290 16 260Z" fill="url(#mesh)" stroke="var(--line)"/><path d="M97 230L147 205L195 230L149 256Z" fill="none" stroke="var(--ink)" stroke-width="1.8"/><text x="210" y="250" font-size="12" class="ital">parallel transport around a loop</text></g></g>

<line x1="22" y1="406" x2="1898" y2="406" stroke="var(--line)"/>

<!-- bottom row 6-10 -->
<g transform="translate(18 424)"><g stroke="var(--line)"><line x1="372" y1="0" x2="372" y2="270"/><line x1="750" y1="0" x2="750" y2="270"/><line x1="1128" y1="0" x2="1128" y2="270"/><line x1="1506" y1="0" x2="1506" y2="270"/></g>
<g><text x="8" y="22" font-size="18" font-weight="700">6. Normal coordinates</text><text x="8" y="42" font-size="13" class="ital">Locally Euclidean to first order.</text><rect x="8" y="62" width="325" height="55" rx="7" fill="var(--soft)"/><text x="170" y="97" text-anchor="middle" font-size="19" class="math">gᵢⱼ(x)=δᵢⱼ, ∂ₖgᵢⱼ(x)=0</text><line x1="145" y1="225" x2="145" y2="135" stroke="var(--ink)" marker-end="url(#a)"/><line x1="65" y1="205" x2="272" y2="205" stroke="var(--ink)" marker-end="url(#a)"/><g fill="none" stroke="var(--muted)"><ellipse cx="145" cy="205" rx="87" ry="48"/><ellipse cx="145" cy="205" rx="61" ry="34"/><ellipse cx="145" cy="205" rx="36" ry="20"/></g><circle cx="145" cy="205" r="4" fill="var(--ink)"/><text x="217" y="175" font-size="14" class="math">Bᵣ(x)</text></g>
<g transform="translate(380)"><text x="8" y="22" font-size="18" font-weight="700">7. Exponential map</text><text x="8" y="42" font-size="13" class="ital">Maps tangent vectors to the manifold.</text><rect x="8" y="62" width="320" height="58" rx="7" fill="var(--soft)"/><text x="168" y="87" text-anchor="middle" font-size="19" class="math">expₓ:Tₓ𝓜→𝓜</text><text x="168" y="110" text-anchor="middle" font-size="17" class="math">expₓ(v)=γᵥ(1)</text><path d="M17 226C59 169 107 164 153 196C198 228 243 221 286 179V265C244 239 203 247 161 272C107 303 61 287 17 260Z" fill="url(#mesh)" stroke="var(--line)"/><polygon points="72,154 180,141 225,168 116,182" fill="var(--soft)" stroke="var(--line)"/><circle cx="123" cy="174" r="4" fill="var(--ink)"/><line x1="123" y1="174" x2="172" y2="151" stroke="var(--ink)" marker-end="url(#a)"/><path d="M123 174C151 203 180 224 211 245" fill="none" stroke="var(--ink)" marker-end="url(#a)"/></g>
<g transform="translate(758)"><text x="8" y="22" font-size="18" font-weight="700">8. Viability and resilience</text><text x="8" y="42" font-size="13" class="ital">Distance to boundary quantifies margin.</text><rect x="8" y="62" width="330" height="55" rx="7" fill="var(--soft)"/><text x="173" y="97" text-anchor="middle" font-size="20" class="math">ρ_g(x)=d_g(x,∂𝒱ₛᵤₛ)</text><path d="M15 231C57 170 108 164 155 197C201 229 247 221 290 180V267C247 241 205 248 162 275C108 307 60 291 15 263Z" fill="url(#mesh)" stroke="var(--line)"/><path d="M68 239C57 210 70 174 100 164C134 152 170 164 182 191C196 222 177 246 145 251C112 256 79 257 68 239Z" fill="var(--shade)" stroke="var(--ink)"/><text x="126" y="209" text-anchor="middle" font-size="19" class="math">𝒱ₛᵤₛ</text><circle cx="159" cy="188" r="4" fill="var(--ink)"/><line x1="159" y1="188" x2="181" y2="178" stroke="var(--ink)" stroke-dasharray="4 3"/><text x="185" y="177" font-size="13" class="math">∂𝒱ₛᵤₛ</text></g>
<g transform="translate(1136)"><text x="8" y="22" font-size="18" font-weight="700">9. Coordinate transformation</text><text x="8" y="42" font-size="13" class="ital">Geometric quantities are coordinate-invariant.</text><rect x="8" y="62" width="355" height="58" rx="7" fill="var(--soft)"/><text x="185" y="97" text-anchor="middle" font-size="16" class="math">g'ₐᵦ=(∂xⁱ/∂yᵅ)(∂xʲ/∂yᵝ)gᵢⱼ</text><text x="40" y="174" font-size="23" class="math">𝓜</text><line x1="77" y1="167" x2="207" y2="167" stroke="var(--ink)" marker-end="url(#a)"/><text x="138" y="153" font-size="15" class="math">φ</text><text x="220" y="175" font-size="21" class="math">ℝⁿ</text><text x="40" y="238" font-size="23" class="math">𝓜</text><line x1="77" y1="231" x2="207" y2="231" stroke="var(--ink)" marker-end="url(#a)"/><text x="138" y="217" font-size="15" class="math">φ'</text><text x="220" y="239" font-size="21" class="math">ℝⁿ</text></g>
<g transform="translate(1514)"><text x="8" y="22" font-size="18" font-weight="700">10. Why it matters for resilient systems</text><text x="8" y="42" font-size="13" class="ital">A unifying language for complex systems.</text><rect x="8" y="62" width="370" height="185" rx="7" fill="var(--soft)"/><g font-size="14"><text x="25" y="91">• Intrinsic distance — safety margins and viability</text><text x="25" y="119">• Curvature — constraints and uncertainty</text><text x="25" y="147">• Geodesics — efficient adaptation paths</text><text x="25" y="175">• Stability — geometry of dynamical systems</text><text x="25" y="203">• Robustness — invariance under perturbations</text><text x="25" y="231">• Coordinate-free analysis — model-independent</text></g></g></g>

<line x1="24" y1="711" x2="1896" y2="711" stroke="var(--line)"/><text x="960" y="735" text-anchor="middle" font-size="13" class="caps">MANIFOLD → CHART → TANGENT SPACE → METRIC → GEODESICS → CURVATURE → VIABILITY</text><text x="960" y="754" text-anchor="middle" font-size="11" class="ital">Geometry reveals structure. Structure enables resilience.</text>
</svg>