<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
<title id="title">Differential geometry — native mathematics</title><desc id="desc">A 1920 by 600 source-grounded geometry visual using a sphere, tangent plane, normal vector, great-circle geodesic, metric, connection, curvature and a research-transfer boundary.</desc>
<defs><style>:root{--bg:#fff;--ink:#0B3D24;--muted:#496355;--f:#176A38;--e:#2F8F50;--m:#6FBD83;--l:#DDEFE2;--p:#F5FBF7}@media(prefers-color-scheme:dark){:root{--bg:#06130B;--ink:#ECFFF1;--muted:#A8CBB2;--f:#8FE4A4;--e:#69D383;--m:#4BB86A;--l:#164125;--p:#0A1C10}}text{font-family:Inter,Segoe UI,Arial,sans-serif}.math{font-family:Cambria Math,STIX Two Math,Georgia,serif}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--f)"/></marker></defs>
<rect width="1920" height="600" fill="var(--bg)"/>
<text x="960" y="62" text-anchor="middle" fill="var(--ink)" font-size="40" font-weight="800">DIFFERENTIAL GEOMETRY — NATIVE MATHEMATICS</text>
<text x="960" y="98" text-anchor="middle" fill="var(--muted)" font-size="19" font-weight="600">Parameterization → tangent basis → metric → connection → curvature → geodesics → topology</text>
<g><text x="65" y="155" fill="var(--f)" font-size="19" font-weight="800">SOURCE GEOMETRY</text><text x="65" y="198" fill="var(--ink)" font-size="20" class="math">r(θ,φ)=R(sinθ cosφ, sinθ sinφ, cosθ)</text><text x="65" y="238" fill="var(--ink)" font-size="20" class="math">e₁=∂θr,   e₂=∂φr</text><text x="65" y="278" fill="var(--ink)" font-size="20" class="math">gᵢⱼ=eᵢ·eⱼ</text><text x="65" y="318" fill="var(--ink)" font-size="20" class="math">n=(e₁×e₂)/‖e₁×e₂‖</text><text x="65" y="374" fill="var(--ink)" font-size="19" class="math">Γᵏᵢⱼ=½gᵏˡ(∂ᵢgⱼˡ+∂ⱼgᵢˡ−∂ˡgᵢⱼ)</text></g>
<g>
<circle cx="1010" cy="330" r="190" fill="var(--p)" stroke="var(--e)" stroke-width="3"/>
<ellipse cx="1010" cy="330" rx="190" ry="58" fill="none" stroke="var(--l)" stroke-width="2"/>
<ellipse cx="1010" cy="267" rx="150" ry="43" fill="none" stroke="var(--l)"/><ellipse cx="1010" cy="393" rx="150" ry="43" fill="none" stroke="var(--l)"/>
<ellipse cx="1010" cy="330" rx="96" ry="190" fill="none" stroke="var(--l)"/><ellipse cx="1010" cy="330" rx="150" ry="190" fill="none" stroke="var(--l)" opacity=".75"/>
<ellipse cx="1010" cy="330" rx="190" ry="80" transform="rotate(-24 1010 330)" fill="none" stroke="var(--f)" stroke-width="4"/>
<circle cx="1065" cy="260" r="7" fill="var(--f)"/>
<path d="M970 285L1180 238L1215 302L1005 348Z" fill="var(--l)" fill-opacity=".38" stroke="var(--m)" stroke-width="2"/>
<line x1="1065" y1="260" x2="1157" y2="240" stroke="var(--f)" stroke-width="3" marker-end="url(#a)"/><line x1="1065" y1="260" x2="1100" y2="345" stroke="var(--e)" stroke-width="3" marker-end="url(#a)"/><line x1="1065" y1="260" x2="1053" y2="145" stroke="var(--f)" stroke-width="3" marker-end="url(#a)"/>
<text x="1168" y="240" fill="var(--f)" font-size="20" class="math">e₁</text><text x="1110" y="360" fill="var(--f)" font-size="20" class="math">e₂</text><text x="1030" y="136" fill="var(--f)" font-size="20" class="math">n</text>
<text x="1010" y="550" text-anchor="middle" fill="var(--f)" font-size="19" font-weight="600" class="math">γ(s): great-circle geodesic · K=1/R²</text>
</g>
<g><text x="1370" y="155" fill="var(--f)" font-size="19" font-weight="800">CURVATURE &amp; TOPOLOGY</text><text x="1370" y="200" fill="var(--ink)" font-size="19" class="math">d²uᵅ/ds²+Γᵅᵦᵧ(duᵦ/ds)(duᵧ/ds)=0</text><text x="1370" y="246" fill="var(--ink)" font-size="20" class="math">K=1/R²,   H=1/R</text><text x="1370" y="292" fill="var(--ink)" font-size="20" class="math">∬ₘK dA=2πχ(M)</text><line x1="1370" y1="350" x2="1810" y2="350" stroke="var(--l)" stroke-width="2"/><text x="1370" y="390" fill="var(--f)" font-size="18" font-weight="800">RESEARCH-TRANSFER BOUNDARY</text><text x="1370" y="430" fill="var(--ink)" font-size="18" font-weight="600">source geometry</text><text x="1525" y="430" fill="var(--f)" font-size="24">→</text><text x="1570" y="430" fill="var(--ink)" font-size="18" font-weight="600">defined state geometry</text><text x="1748" y="430" fill="var(--f)" font-size="24">→</text><text x="1790" y="430" fill="var(--ink)" font-size="18" font-weight="600">validation</text><text x="1370" y="482" fill="var(--muted)" font-size="18">Metric, differentiability, distance and curvature meaning</text><text x="1370" y="510" fill="var(--muted)" font-size="18">must be declared before engineering interpretation.</text></g>
</svg>