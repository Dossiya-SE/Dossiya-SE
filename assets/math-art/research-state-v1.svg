<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="560" viewBox="0 0 1920 560" role="img" aria-labelledby="title desc"><title id="title">Living mathematical and engineering research state</title><desc id="desc">Declared research configuration with a public GitHub telemetry bootstrap state.</desc><metadata>DECLARED_RESEARCH_CONFIGURATION + OBSERVED_PUBLIC_REPOSITORY_METADATA; public-only allowlist; bootstrap pending first automated refresh.</metadata><style>text{font-family:'DejaVu Sans',Arial,Helvetica,sans-serif}</style><rect width="100%" height="100%" fill="#FFFFFF"/><text x="50" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#111318">Living Research State</text><text x="50" y="82" font-size="16" font-style="italic" fill="#5F6670">mathematical configuration + public engineering telemetry</text><text x="1865" y="50" text-anchor="end" font-size="13" font-weight="700" fill="#B58A37">FRAMEWORK v1.0</text><text x="1865" y="78" text-anchor="end" font-size="13" font-weight="700" fill="#111318">ACTIVE</text><line x1="50" y1="105" x2="1870" y2="105" stroke="#D9DDE2" stroke-width="1"/><text x="55" y="145" font-size="13" font-weight="700" fill="#5F6670">SYSTEM COMPOSITION</text><text x="55" y="178" font-size="18" font-weight="700" fill="#111318">Physical</text><text x="55" y="207" font-size="16" fill="#111318">Power · Transportation</text><text x="55" y="250" font-size="18" font-weight="700" fill="#111318">Non-physical</text><text x="55" y="279" font-size="16" fill="#111318">Information · Organization</text><rect x="55" y="315" width="490" height="92" rx="10" fill="#F7F7F5" stroke="#D9DDE2"/><text x="78" y="346" font-size="12" font-weight="700" fill="#5F6670">Current focus</text><text x="78" y="378" font-size="21" font-weight="700" fill="#111318">Causal Mechanisms</text><text x="78" y="401" font-size="13" font-style="italic" fill="#5F6670">interdependency mechanisms</text><text x="610" y="145" font-size="13" font-weigh