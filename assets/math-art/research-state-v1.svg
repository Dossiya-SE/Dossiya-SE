le" font-size="12" fill="#111318">R-S Interface</text><text x="1280" y="276" text-anchor="middle" font-size="12" fill="#111318">Transformation</text><rect x="620" y="318" width="680" height="88" rx="10" fill="#F7F7F5" stroke="#D9DDE2"/><text x="645" y="347" font-size="12" font-weight="700" fill="#5F6670">ACTIVE MATHEMATICAL OBJECT</text><text x="645" y="382" font-size="24" font-weight="700" fill="#B58A37">M_ij</text><text x="710" y="382" font-size="14" fill="#111318">By what mechanisms do dependencies transmit effects between system elements?</text><text x="1360" y="145" font-size="13" font-weight="700" fill="#5F6670">PUBLIC RESEARCH TELEMETRY</text><rect x="1360" y="170" width="505" height="180" rx="10" fill="#F7F7F5" stroke="#D9DDE2"/><text x="1385" y="208" font-size="18" font-weight="700" fill="#111318">Telemetry bootstrap</text><text x="1385" y="240" font-size="14" fill="#111318">Public allowlist configured</text><text x="1385" y="267" font-size="14" fill="#111318">6 research repositories</text><text x="1385" y="302" font-size="13" fill="#5F6670">First live snapshot is generated by the</text><text x="1385" y="324" font-size="13" fill="#5F6670">scheduled GitHub Action after release.</text><line x1="50" y1="455" x2="1870" y2="455" stroke="#D9DDE2" stroke-width="1"/><text x="55" y="490" font-size="12" font-weight="700" fill="#5F6670">PROVENANCE</text><text x="155" y="490" font-size="13" font-weight="700" fill="#111318">declared configuration</text><text x="330" y="490" font-size="14" font-weight="700" fill="#B58A37">+</text><text x="355" y="490" font-size="13" font-weight="700" fill="#111318">observed public GitHub metadata</text><text x="1865" y="490" text-anchor="end" font-size="12" fill="#5F6670">snapshot: bootstrap</text><text x="55" y="525" font-size="13" font-style="italic" fill="#5F6670">Identity is stable; research state is dynamic. Private repositories are excluded by construction.</text><text x="1865" y="525" text-anchor="end" font-size="13" font-weight="700" fill="#B58A37">fetch → validate → render → audit → publish</text></svg>
