<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
<title id="title">Formula and evidence lattice</title><desc id="desc">Adaptive visual showing the promotion of mathematical objects from source through derivation, model, computation, verification, empirical evidence, hypotheses, targets and bounded claims.</desc>
<style>:root{--bg:#fff;--panel:#f8fafc;--fg:#0f172a;--muted:#475569;--border:#94a3b8;--source:#4338ca;--derived:#047857;--model:#b45309;--computed:#475569;--verified:#0369a1;--empirical:#0f766e;--hyp:#be185d;--target:#a16207}@media(prefers-color-scheme:dark){:root{--bg:#07111f;--panel:#0e1d31;--fg:#eaf1f8;--muted:#9eb0c3;--border:#355a7b;--source:#a5b4fc;--derived:#34d399;--model:#fbbf24;--computed:#cbd5e1;--verified:#38bdf8;--empirical:#5eead4;--hyp:#f472b6;--target:#facc15}}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--border)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}text{font-family:Inter,Segoe UI,Arial,sans-serif}.math{font-family:Georgia,'Times New Roman',serif}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs><rect class="bg" width="1600" height="760" rx="26"/><text x="70" y="68" class="fg" font-size="38" font-weight="800">FORMULA → EVIDENCE → BOUNDED CLAIM</text><text x="70" y="101" class="muted" font-size="17">mathematical sophistication never upgrades evidence status by itself</text>
<g transform="translate(70 145)" font-size="16" font-weight="700"><rect width="150" height="64" rx="13" fill="var(--source)"/><text x="75" y="39" text-anchor="middle" fill="var(--bg)">[S] Source</text><path d="M150 32H205" stroke="var(--muted)" stroke-width="3" marker-end="url(#a)"/><rect x="215" width="150" height="64" rx="13" fill="var(--derived)"/><text x="290" y="39" text-anchor="middle" fill="var(--bg)">[D] Derived</text><path d="M365 32H420" stroke="var(--muted)" stroke-width="3" marker-end="url(#a)"/><rect x="430" width="150" height="64" rx="13" fill="var(--model)"/><text x="505" y="39" text-anchor="middle" fill="var(--bg)">[M] Model</text><path d="M580 32H635" stroke="var(--muted)" stroke-width="3" marker-end="url(#a)"/><rect x="645" width="150" height="64" rx="13" fill="var(--computed)"/><text x="720" y="39" text-anchor="middle" fill="var(--bg)">[C] Computed</text><path d="M795 32H850" stroke="var(--muted)" stroke-width="3" marker-end="url(#a)"/><rect x="860" width="150" height="64" rx="13" fill="var(--verified)"/><text x="935" y="39" text-anchor="middle" fill="var(--bg)">[V] Verified</text><path d="M1010 32H1065" stroke="var(--muted)" stroke-width="3" marker-end="url(#a)"/><rect x="1075" width="150" height="64" rx="13" fill="var(--empirical)"/><text x="1150" y="39" text-anchor="middle" fill="var(--bg)">[E] Empirical</text><path d="M1225 32H1280" stroke="var(--muted)" stroke-width="3" marker-end="url(#a)"/><rect x="1290" width="150" height="64" rx="13" fill="var(--target)"/><text x="1365" y="39" text-anchor="middle" fill="var(--bg)">Bound claim</text></g>
<rect x="70" y="260" width="720" height="355" rx="18" class="panel"/><text x="96" y="302" class="fg" font-size="22" font-weight="700">Formula object contract</text><text x="96" y="348" class="fg math" font-size="21">formula ID → source / derivation → assumptions</text><text x="96" y="386" class="fg math" font-size="21">→ repository role → implementation → test</text><text x="96" y="424" class="fg math" font-size="21">→ visual representation → research claim</text><text x="96" y="478" class="muted" font-size="15">A formula may be source-grounded, derived, modeled, computed, verified, empirical, hypothetical, or a design target. These states are not interchangeable.</text><text x="96" y="535" class="fg math" font-size="20">theme_light(F) ≡ theme_dark(F)</text><text x="96" y="570" class="muted" font-size="14">for equations, geometry, values, topology, evidence state, and conclusion.</text>
<rect x="820" y="260" width="710" height="355" rx="18" class="panel"/><text x="846" y="302" class="fg" font-size="22" font-weight="700">Hypothesis and target branches</text><rect x="860" y="345" width="220" height="62" rx="12" fill="var(--hyp)"/><text x="970" y="383" text-anchor="middle" fill="var(--bg)" font-size="16" font-weight="700">[H] Hypothesis</text><path d="M1080 376H1220" stroke="var(--muted)" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/><rect x="1230" y="345" width="240" height="62" rx="12" class="panel"/><text x="1350" y="383" text-anchor="middle" class="fg" font-size="15">test / falsify / validate</text><rect x="860" y="455" width="220" height="62" rx="12" fill="var(--target)"/><text x="970" y="493" text-anchor="middle" fill="var(--bg)" font-size="16" font-weight="700">[T] Design target</text><path d="M1080 486H1220" stroke="var(--muted)" stroke-width="3" marker-end="url(#a)"/><rect x="1230" y="455" width="240" height="62" rx="12" class="panel"/><text x="1350" y="493" text-anchor="middle" class="fg" font-size="15">verify requirement / field evidence</text><text x="846" y="570" class="muted" font-size="14">Source theorem ≠ original contribution. Software test ≠ empirical validation. Model output ≠ observation.</text>
<text x="70" y="690" class="muted" font-size="14">claim strength ≤ source/evidence strength + mathematical specification + computational verification + relevant validation</text></svg>