<g transform="translate(390 18)"><rect width="620" height="180" rx="10" fill="var(--soft)"/><text x="22" y="32" font-size="19" font-weight="700">Canonical interdependency object</text><text x="310" y="79" text-anchor="middle" font-size="25" class="math">𝕀ᵅᵝᵢⱼ=(Eᵅᵢ,Eᵝⱼ,Mᵢⱼ,wᵢⱼ,δᵢⱼ,τᵢⱼ,aᵢⱼ,m,ℋₜ)</text><line x1="22" y1="105" x2="598" y2="105" stroke="var(--line)"/><text x="310" y="136" text-anchor="middle" font-size="14" class="ital">Nodes, links, interdependencies, dynamics, and adaptation.</text><text x="28" y="167" font-size="18" font-weight="700">Coupled dynamics</text><text x="325" y="168" font-size="26" class="math">Ẏ=F_G(Y,u,η;θ)</text></g>
<g transform="translate(1040 18)"><text x="305" y="18" text-anchor="middle" font-size="19" font-weight="700">Viability and sustainable operating space</text><line x1="38" y1="168" x2="250" y2="168" stroke="var(--ink)" marker-end="url(#a)"/><line x1="50" y1="180" x2="50" y2="45" stroke="var(--ink)" marker-end="url(#a)"/><path d="M75 154C61 118 74 73 112 58C154 41 204 57 218 92C233 129 211 156 171 158C132 160 88 163 75 154Z" fill="var(--shade)" stroke="var(--ink)"/><text x="149" y="111" text-anchor="middle" font-size="21" class="math">𝒱ₛᵤₛ</text><text x="201" y="63" font-size="15" class="math">∂𝒱ₛᵤₛ</text><path d="M91 145C111 124 129 116 148 108C166 101 184 89 200 77" fill="none" stroke="var(--ink)" stroke-dasharray="5 4" marker-end="url(#a)"/><circle cx="91" cy="145" r="4" fill="var(--ink)"/><text x="264" y="89" font-size="20" class="math">g(Y)≤0</text><text x="264" y="118" font-size="14" class="ital">Operate safely. Adapt persistently.</text></g>
<line x1="240" y1="225" x2="590" y2="225" stroke="var(--line)"/><line x1="1330" y1="225" x2="1680" y2="225" stroke="var(--line)"/><text x="960" y="244" text-anchor="middle" font-size="54" font-style="italic" font-weight="700">Research Operating System</text><text x="960" y="276" text-anchor="middle" font-size="21" class="ital">From interconnected knowledge to a sustainable world</text>
<g transform="translate(18 300)"><g stroke="var(--line)"><line x1="265" y1="0" x2="265" y2="330"/><line x1="535" y1="0" x2="535" y2="330"/><line x1="805" y1="0" x2="805" y2="330"/><line x1="1075" y1="0" x2="1075" y2="330"/><line x1="1345" y1="0" x2="1345" y2="330"/><line x1="1615" y1="0" x2="1615" y2="330"/></g>
<g><text x="130" y="22" text-anchor="middle" font-size="18" font-weight="700">1. Multilayer Structure</text><text x="130" y="43" text-anchor="middle" font-size="13" class="ital">represent structure and interdependencies</text><g transform="translate(45 67)" fill="none" stroke="var(--ink)"><polygon points="0,20 120,0 155,20 35,40" fill="var(--soft)" stroke="var(--line)"/><polygon points="0,72 120,52 155,72 35,92" fill="var(--soft)" stroke="var(--line)"/><polygon points="0,124 120,104 155,124 35,144" fill="var(--soft)" stroke="var(--line)"/><g stroke-dasharray="4 4" stroke="var(--muted)"><line x1="35" y1="32" x2="35" y2="136"/><line x1="83" y1="15" x2="83" y2="119"/><line x1="132" y1="27" x2="132" y2="131"/></g></g><text x="130" y="255" text-anchor="middle" font-size="20" class="math">𝒢=(𝒱,𝓔,𝒲,𝓛)</text><text x="130" y="286" text-anchor="middle" font-size="13" class="ital">Networks · layers · interfaces</text></g>
<g transform="translate(270)"><text x="130" y="22" text-anchor="middle" font-size="18" font-weight="700">2. Causal Mechanisms</text><text x="130" y="43" text-anchor="middle" font-size="13" class="ital">from correlation to causation</text><g transform="translate(45 80)" fill="none" stroke="var(--ink)" marker-end="url(#a)"><circle cx="25" cy="50" r="18" fill="var(--bg)"/><circle cx="102" cy="18" r="18" fill="var(--bg)"/><circle cx="102" cy="96" r="18" fill="var(--bg)"/><circle cx="180" cy="51" r="18" fill="var(--bg)"/><line x1="43" y1="45" x2="82" y2="26"/><line x1="43" y1="58" x2="83" y2="87"/><line x1="120" y1="27" x2="160" y2="44"/><line x1="120" y1="88" x2="160" y2="59"/></g><text x="130" y="255" text-anchor="middle" font-size="21" class="math">P(Y|do(X))</text><text x="130" y="286" text-anchor="middle" font-size="13" class="ital">Mechanisms before correlation.</text></g>
<g transform="translate(540)"><text x="130" y="22" text-anchor="middle" font-size="17" font-weight="700">3. Coupled Hybrid</text><text x="130" y="43" text-anchor="middle" font-size="17" font-weight="700">Multiscale Dynamics</text><g transform="translate(35 80)" fill="none"><path d="M0 42C42 4 83 17 118 43S172 60 210 21" stroke="var(--ink)" stroke-width="2"/><path d="M0 101C42 68 83 77 118 102S173 116 210 82" stroke="var(--muted)" stroke-width="2"/><path d="M0 160C42 133 82 136 118 161S173 174 210 143" stroke="var(--line)" stroke-width="2"/></g><text x="130" y="255" text-anchor="middle" font-size="20" class="math">Ẏ=F_G(Y,u,η;θ)</text><text x="130" y="286" text-anchor="middle" font-size="13" class="ital">Hybrid · nonlinear · multiscale</text></g>
<g transform="translate(810)"><text x="130" y="22" text-anchor="middle" font-size="18" font-weight="700">4. Feedback &amp; Control</text><text x="130" y="43" text-anchor="middle" font-size="13" class="ital">guide, regulate, optimize</text><g transform="translate(40 95)" fill="none" stroke="var(--ink)"><rect x="62" y="0" width="82" height="52"/><rect x="67" y="105" width="72" height="45"/><line x1="0" y1="26" x2="62" y2="26" marker-end="url(#a)"/><line x1="144" y1="26" x2="198" y2="26" marker-end="url(#a)"/><path d="M185 26V128H139" marker-end="url(#a)"/><path d="M67 128H18V35" marker-end="url(#a)"/></g><text x="143" y="127" text-anchor="middle" font-size="14">System 𝒢</text><text x="143" y="235" text-anchor="middle" font-size="14">π(Y)</text><text x="130" y="286" text-anchor="middle" font-size="13" class="ital">Feedback · learning · adaptation</text></g>
<g transform="translate(1080)"><text x="130" y="22" text-anchor="middle" font-size="18" font-weight="700">5. Viability</text><text x="130" y="43" text-anchor="middle" font-size="13" class="ital">safe and acceptable operating space</text><line x1="45" y1="225" x2="220" y2="225" stroke="var(--ink)" marker-end="url(#a)"/><line x1="56" y1="238" x2="56" y2="82" stroke="var(--ink)" marker-end="url(#a)"/><path d="M77 211C63 183 76 133 110 115C146 95 190 106 204 140C219 176 197 209 160 213C125 216 89 218 77 211Z" fill="var(--shade)" stroke="var(--ink)"/><text x="143" y="164" text-anchor="middle" font-size="19" class="math">𝒱ₛᵤₛ</text><path d="M92 200C113 180 134 171 157 161C176 153 187 143 195 130" fill="none" stroke="var(--ink)" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="130" y="286" text-anchor="middle" font-size="13" class="ital">Maintain viability under uncertainty</text></g>
<g transform="translate(1350)"><text x="130" y="22" text-anchor="middle" font-size="16" font-weight="700">6. Resilience-to-</text><text x="130" y="43" text-anchor="middle" font-size="16" font-weight="700">Sustainability Interface</text><g transform="translate(12 92)" fill="none" stroke="var(--muted)"><path d="M0 92C40 19 79 20 113 93S187 162 230 73"/><path d="M0 110C43 47 79 48 113 111S187 175 230 94"/><path d="M0 128C45 75 81 77 113 127S186 187 230 116"/></g><circle cx="82" cy="190" r="6" fill="var(--ink)"/><circle cx="222" cy="177" r="6" fill="var(--ink)"/><path d="M85 185C120 153 158 153 197 173" fill="none" stroke="var(--ink)" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="130" y="286" text-anchor="middle" font-size="13" class="ital">Absorb → adapt → transform</text></g>
<g transform="translate(1620)"><text x="130" y="22" text-anchor="middle" font-size="16" font-weight="700">7. Sustainable</text><text x="130" y="43" text-anchor="middle" font-size="16" font-weight="700">Transformation Pathways</text><path d="M20 220C52 139 91 118 132 151S200 188 232 94" fill="url(#mesh)" stroke="var(--line)"/><path d="M42 207C73 186 96 169 121 151C147 131 169 123 201 105" fill="none" stroke="var(--ink)" stroke-width="2" marker-end="url(#a)"/><g fill="var(--ink)"><circle cx="42" cy="207" r="4"/><circle cx="90" cy="176" r="4"/><circle cx="139" cy="137" r="4"/><circle cx="201" cy="105" r="5"/></g><text x="130" y="286" text-anchor="middle" font-size="13" class="ital">Robust pathways to desirable futures</text></g></g>
