<g transform="translate(1040)"><rect width="230" height="192" rx="20" fill="var(--panel)" stroke="var(--gold)" stroke-width="2"/><text x="115" y="32" fill="var(--ink)" font-weight="800">5. Viability</text><g transform="translate(115 95)" fill="none"><ellipse rx="68" ry="45" fill="var(--pale)" stroke="var(--green2)"/><ellipse rx="47" ry="31" stroke="var(--green)"/><ellipse rx="25" ry="17" stroke="var(--gold)"/><path d="M-8 16L12-10" stroke="var(--gold)" stroke-width="2"/><circle cx="12" cy="-10" r="5" fill="var(--green)"/></g><text x="115" y="164" fill="var(--muted)" font-size="12">safe · feasible · desirable states</text></g>
<g transform="translate(1300)"><rect width="230" height="192" rx="20" fill="var(--panel)" stroke="var(--gold)" stroke-width="2"/><text x="115" y="25" fill="var(--ink)" font-weight="800"><tspan x="115">6. Resilience-to-</tspan><tspan x="115" dy="18">Sustainability Interface</tspan></text><g transform="translate(115 98)"><circle cx="-28" cy="0" r="42" fill="var(--pale)" stroke="var(--green2)"/><circle cx="28" cy="0" r="42" fill="var(--pale)" stroke="var(--green)" opacity=".85"/><path d="M0 26C-8 5-2-16 13-28C12-8 8 12 0 26Z" fill="var(--gold)"/></g><text x="115" y="164" fill="var(--muted)" font-size="12">recovery → long-term sustainability</text></g>
