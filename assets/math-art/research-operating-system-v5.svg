<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 760" role="img" aria-labelledby="title desc">
<title id="title">Research Operating System for interdependent infrastructure resilience</title>
<desc id="desc">Modern monochrome seven-stage mathematical research architecture from multilayer structure and causal mechanisms through coupled dynamics, feedback, viability, resilience-to-sustainability transformation and sustainable pathways.</desc>
<metadata>Native editable SVG. Conceptual research architecture; not empirical validation.</metadata>
<defs><style>
:root{--bg:#fff;--ink:#111;--muted:#646464;--soft:#f3f3f3;--line:#c9c9c9;--shade:#e9e9e9;--mesh:#d7d7d7}
@media(prefers-color-scheme:dark){:root{--bg:#fff;--ink:#111;--muted:#646464;--soft:#f3f3f3;--line:#c9c9c9;--shade:#e9e9e9;--mesh:#d7d7d7}}
text{font-family:Georgia,'Times New Roman',serif;fill:var(--ink)}.math{font-family:'STIX Two Math','Cambria Math',Georgia,serif}.ital{font-style:italic}.caps{letter-spacing:2px}
