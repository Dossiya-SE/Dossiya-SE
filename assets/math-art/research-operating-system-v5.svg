<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 760" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
<title id="title">Research Operating System for interdependent infrastructure resilience</title>
<desc id="desc">Native vector research framework linking power, transportation, information and organization to seven stages from multilayer structure through causal dynamics, control, viability and sustainable transformation.</desc>
<metadata>Native editable SVG. Conceptual research architecture; not empirical validation.</metadata>
<defs><style>
:root{--bg:#fbfaf5;--panel:#fff;--ink:#121714;--muted:#5d675f;--line:#dfe4df;--green:#355f47;--green2:#71917b;--pale:#e9f0e9;--gold:#a9781d;--goldp:#eadbbc}
@media(prefers-color-scheme:dark){:root{--bg:#07100b;--panel:#0b1710;--ink:#f0f4f1;--muted:#a9b5ad;--line:#213229;--green:#88c49d;--green2:#5fa577;--pale:#142e20;--gold:#dfb75c;--goldp:#4a3a1d}}
