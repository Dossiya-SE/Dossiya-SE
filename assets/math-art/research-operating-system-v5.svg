<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
<title id="title">Mathematical research operating system</title><desc id="desc">A continuous 1920 by 600 pipeline from evidence through state, dynamics, inference, uncertainty, viability and control to validation.</desc>
<defs><style>:root{--bg:#fff;--ink:#0B3D24;--muted:#496355;--f:#176A38;--e:#2F8F50;--m:#6FBD83;--l:#DDEFE2;--p:#F5FBF7}@media(prefers-color-scheme:dark){:root{--bg:#06130B;--ink:#ECFFF1;--muted:#A8CBB2;--f:#8FE4A4;--e:#69D383;--m:#4BB86A;--l:#164125;--p:#0A1C10}}text{font-family:Inter,Segoe UI,Arial,sans-serif}.math{font-family:Cambria Math,STIX Two Math,Georgia,serif}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--f)"/></marker></defs>
<rect width="1920" height="600" fill="var(--bg)"/>
<text x="960" y="64" text-anchor="middle" fill="var(--ink)" font-size="40" font-weight="800">MATHEMATICAL RESEARCH OPERATING SYSTEM</text>
<text x="960" y="100" text-anchor="middle" fill="var(--muted)" font-size="19" font-weight="600">Evidence → state → dynamics → inference → uncertainty → viability → control → validation</text>
<g text-anchor="middle" font-size="18" font-weight="800">
<g transform="translate(130 0)"><circle cx="0" cy="205" r="42" fill="var(--bg)" stroke="var(--e)" stroke-width="3"/><text y="216" fill="var(--f)" font-size="26">●</text><text y="270" fill="var(--ink)">EVIDENCE</text></g>
<g transform="translate(370 0)"><circle cx="0" cy="205" r="42" fill="var(--bg)" stroke="var(--e)" stroke-width="3"/><text y="216" fill="var(--f)" font-size="26">◇</text><text y="270" fill="var(--ink)">STATE</text></g>
<g transform="translate(610 0)"><circle cx="0" cy="205" r="42" fill="var(--bg)" stroke="var(--e)" stroke-width="3"/><text y="216" fill="var(--f)" font-size="26">∿</text><text y="270" fill="var(--ink)">DYNAMICS</text></g>
<g transform="translate(850 0)"><circle cx="0" cy="205" r="42" fill="var(--bg)" stroke="var(--e)" stroke-width="3"/><text y="216" fill="var(--f)" font-size="26" class="math">π</text><text y="270" fill="var(--ink)">INFERENCE</text></g>
<g transform="translate(1090 0)"><circle cx="0" cy="205" r="42" fill="var(--bg)" stroke="var(--e)" stroke-width="3"/><text y="216" fill="var(--f)" font-size="26">±</text><text y="270" fill="var(--ink)">UNCERTAINTY</text></g>
<g transform="translate(1330 0)"><circle cx="0" cy="205" r="42" fill="var(--bg)" stroke="var(--e)" stroke-width="3"/><text y="216" fill="var(--f)" font-size="26" class="math">V</text><text y="270" fill="var(--ink)">VIABILITY</text></g>
<g transform="translate(1570 0)"><circle cx="0" cy="205" r="42" fill="var(--bg)" stroke="var(--e)" stroke-width="3"/><text y="216" fill="var(--f)" font-size="26" class="math">u*</text><text y="270" fill="var(--ink)">CONTROL</text></g>
<g transform="translate(1790 0)"><circle cx="0" cy="205" r="42" fill="var(--bg)" stroke="var(--e)" stroke-width="3"/><text y="216" fill="var(--f)" font-size="26">✓</text><text y="270" fill="var(--ink)">VALIDATION</text></g>
</g>
<g stroke="var(--f)" stroke-width="3" marker-end="url(#a)"><line x1="175" y1="205" x2="325" y2="205"/><line x1="415" y1="205" x2="565" y2="205"/><line x1="655" y1="205" x2="805" y2="205"/><line x1="895" y1="205" x2="1045" y2="205"/><line x1="1135" y1="205" x2="1285" y2="205"/><line x1="1375" y1="205" x2="1525" y2="205"/><line x1="1615" y1="205" x2="1745" y2="205"/></g>
<path d="M80 430C185 365 265 445 360 395S520 365 610 407S760 460 845 400S1015 335 1115 395S1260 470 1370 398S1535 355 1650 405S1770 425 1840 365" fill="none" stroke="var(--f)" stroke-width="4"/>
<path d="M80 450C185 385 265 465 360 415S520 385 610 427S760 480 845 420S1015 355 1115 415S1260 490 1370 418S1535 375 1650 425S1770 445 1840 385" fill="none" stroke="var(--m)" stroke-width="22" opacity=".14"/>
<g fill="var(--f)"><circle cx="110" cy="420" r="5"/><circle cx="150" cy="400" r="5"/><circle cx="190" cy="425" r="5"/><circle cx="230" cy="383" r="5"/><circle cx="270" cy="412" r="5"/></g>
<path d="M1190 480C1220 365 1340 340 1455 392C1525 425 1480 490 1385 495C1300 500 1210 540 1190 480Z" fill="var(--l)" fill-opacity=".35" stroke="var(--e)" stroke-width="3"/>
<path d="M1270 475C1320 440 1365 420 1410 408S1495 395 1540 350" fill="none" stroke="var(--f)" stroke-width="4" marker-end="url(#a)"/>
<circle cx="1790" cy="365" r="48" fill="var(--bg)" stroke="var(--f)" stroke-width="4"/><circle cx="1790" cy="365" r="22" fill="var(--l)" stroke="var(--f)" stroke-width="3"/><circle cx="1790" cy="365" r="6" fill="var(--f)"/>
<g text-anchor="middle" fill="var(--ink)" font-size="20" class="math"><text x="370" y="535">yₖ=h(xₖ,θ)+εₖ</text><text x="850" y="535">π(θ|y)∝L(y|θ)π₀(θ)</text><text x="1330" y="535">V={x₀∈K:∃u(·),x(t)∈K}</text><text x="1670" y="535">u*=arg min J(x,u)</text></g>
</svg>