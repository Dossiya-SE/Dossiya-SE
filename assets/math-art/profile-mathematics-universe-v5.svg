<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
<title id="title">Mathematics universe</title><desc id="desc">A radial mathematics universe connecting foundations, geometry, dynamics, networks, probability, inference, viability and optimization around a central mathematical structure.</desc>
<defs><style>:root{--bg:#fff;--ink:#0B3D24;--muted:#496355;--f:#176A38;--e:#2F8F50;--m:#6FBD83;--l:#DDEFE2;--p:#F5FBF7}@media(prefers-color-scheme:dark){:root{--bg:#06130B;--ink:#ECFFF1;--muted:#A8CBB2;--f:#8FE4A4;--e:#69D383;--m:#4BB86A;--l:#164125;--p:#0A1C10}}text{font-family:Inter,Segoe UI,Arial,sans-serif}.math{font-family:Cambria Math,STIX Two Math,Georgia,serif}</style></defs>
<rect width="1920" height="600" fill="var(--bg)"/>
<text x="960" y="64" text-anchor="middle" fill="var(--ink)" font-size="42" font-weight="800">MATHEMATICS UNIVERSE</text><text x="960" y="100" text-anchor="middle" fill="var(--muted)" font-size="19" font-weight="600">Foundations → structures → dynamics → inference → viability → decision</text>
<g fill="none" stroke="var(--l)"><path d="M470 300C590 110 1330 110 1450 300C1330 490 590 490 470 300Z" stroke-width="2" stroke-dasharray="7 9"/><path d="M620 300C710 175 1210 175 1300 300C1210 425 710 425 620 300Z" stroke-width="2"/></g>
<circle cx="960" cy="300" r="92" fill="var(--p)" stroke="var(--e)" stroke-width="3"/><circle cx="960" cy="300" r="64" fill="none" stroke="var(--l)" stroke-width="2"/>
<g stroke="var(--m)" stroke-width="1.5" opacity=".65"><path d="M900 265L938 230L978 248L1018 220L1030 274L1002 315L1032 350L976 368L936 342L894 320Z" fill="none"/><path d="M900 265L978 248L1030 274M938 230L1002 315L936 342M978 248L1032 350M894 320L1002 315"/></g><g fill="var(--f)"><circle cx="900" cy="265" r="5"/><circle cx="938" cy="230" r="5"/><circle cx="978" cy="248" r="6"/><circle cx="1018" cy="220" r="5"/><circle cx="1030" cy="274" r="6"/><circle cx="1002" cy="315" r="5"/><circle cx="1032" cy="350" r="5"/><circle cx="976" cy="368" r="6"/><circle cx="936" cy="342" r="5"/><circle cx="894" cy="320" r="5"/></g><text x="960" y="309" text-anchor="middle" fill="var(--ink)" font-size="27" font-weight="800" class="math">MATHEMATICS</text>
<g stroke="var(--l)" stroke-width="2"><line x1="900" y1="255" x2="270" y2="190"/><line x1="900" y1="330" x2="390" y2="410"/><line x1="945" y1="385" x2="650" y2="465"/><line x1="930" y1="235" x2="720" y2="155"/><line x1="990" y1="235" x2="1200" y2="155"/><line x1="1020" y1="380" x2="1310" y2="465"/><line x1="1035" y1="330" x2="1540" y2="410"/><line x1="1020" y1="255" x2="1660" y2="190"/></g>
<g text-anchor="middle"><g transform="translate(270 190)"><circle r="35" fill="var(--bg)" stroke="var(--e)" stroke-width="3"/><text y="7" fill="var(--f)" font-size="20" class="math">∂·∇·∫</text><text y="60" fill="var(--ink)" font-size="18" font-weight="800">ANALYSIS &amp; CALCULUS</text><text y="86" fill="var(--muted)" font-size="18">limits · derivatives · integrals</text></g><g transform="translate(390 410)"><circle r="35" fill="var(--bg)" stroke="var(--e)" stroke-width="3"/><text y="7" fill="var(--f)" font-size="20" class="math">Ax=b</text><text y="60" fill="var(--ink)" font-size="18" font-weight="800">LINEAR &amp; TENSOR ALGEBRA</text><text y="86" fill="var(--muted)" font-size="18">operators · eigenstructure</text></g><g transform="translate(650 465)"><circle r="35" fill="var(--bg)" stroke="var(--e)" stroke-width="3"/><text y="7" fill="var(--f)" font-size="20" class="math">ℙ·𝔼</text><text y="58" fill="var(--ink)" font-size="18" font-weight="800">PROBABILITY &amp; STATISTICS</text></g><g transform="translate(720 155)"><circle r="35" fill="var(--bg)" stroke="var(--e)" stroke-width="3"/><text y="7" fill="var(--f)" font-size="20" class="math">gᵢⱼ·Γ·K</text><text y="60" fill="var(--ink)" font-size="18" font-weight="800">DIFFERENTIAL GEOMETRY</text><text y="86" fill="var(--muted)" font-size="18">metric · curvature · geodesics</text></g><g transform="translate(1200 155)"><circle r="35" fill="var(--bg)" stroke="var(--e)" stroke-width="3"/><text y="7" fill="var(--f)" font-size="20" class="math">ẋ=F(x,u)</text><text y="60" fill="var(--ink)" font-size="18" font-weight="800">DYNAMICS &amp; SYSTEMS</text><text y="86" fill="var(--muted)" font-size="18">ODE · PDE · stability</text></g><g transform="translate(1310 465)"><circle r="35" fill="var(--bg)" stroke="var(--e)" stroke-width="3"/><text y="7" fill="var(--f)" font-size="20" class="math">V⊂K·u*</text><text y="58" fill="var(--ink)" font-size="18" font-weight="800">VIABILITY &amp; OPTIMIZATION</text></g><g transform="translate(1540 410)"><circle r="35" fill="var(--bg)" stroke="var(--e)" stroke-width="3"/><text y="7" fill="var(--f)" font-size="20" class="math">π(θ|y)</text><text y="60" fill="var(--ink)" font-size="18" font-weight="800">UNCERTAINTY &amp; INFERENCE</text><text y="86" fill="var(--muted)" font-size="18">inverse problems · UQ</text></g><g transform="translate(1660 190)"><circle r="35" fill="var(--bg)" stroke="var(--e)" stroke-width="3"/><text y="7" fill="var(--f)" font-size="20" class="math">L=D−A</text><text y="60" fill="var(--ink)" font-size="18" font-weight="800">NETWORKS &amp; INTERFACES</text><text y="86" fill="var(--muted)" font-size="18">coupling · topology · cascade</text></g></g>
<text x="960" y="565" text-anchor="middle" fill="var(--f)" font-size="18" font-weight="700">Mathematics as a language for nature, systems, uncertainty and decisions</text>
</svg>