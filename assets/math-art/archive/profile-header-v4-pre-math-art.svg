<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 320" role="img" aria-labelledby="title desc">
<title id="title">Dossiya Dakou mathematical research profile</title>
<desc id="desc">Adaptive light and dark header for mathematical physics, sustainable infrastructure, inference, geometry, control, design and scientific validation.</desc>
<style>
:root{--bg:#fff;--panel:#f8fafc;--fg:#0f172a;--muted:#475569;--grid:#e2e8f0;--state:#1d4ed8;--source:#4338ca;--viable:#047857;--unc:#b45309;--decision:#a16207;--border:#94a3b8}
@media (prefers-color-scheme:dark){:root{--bg:#07111f;--panel:#0e1d31;--fg:#eaf1f8;--muted:#9eb0c3;--grid:#28445f;--state:#60a5fa;--source:#a5b4fc;--viable:#34d399;--unc:#fbbf24;--decision:#facc15;--border:#355a7b}}
.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--border)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.grid{stroke:var(--grid)}.state{stroke:var(--state);fill:none}.source{fill:var(--source)}.viable{fill:var(--viable)}.unc{fill:var(--unc)}.decision{fill:var(--decision)}
text{font-family:Inter,Segoe UI,Arial,sans-serif}.math{font-family:Georgia,'Times New Roman',serif}
</style>
<rect class="bg" width="1600" height="320" rx="26"/>
<g opacity=".55" class="grid" fill="none" stroke-width="1"><path d="M0 64H1600M0 128H1600M0 192H1600M0 256H1600"/><path d="M160 0V320M320 0V320M480 0V320M640 0V320M800 0V320M960 0V320M1120 0V320M1280 0V320M1440 0V320"/></g>
<text x="80" y="92" class="fg" font-size="48" font-weight="800">Dossiya Dakou</text>
<text x="80" y="132" class="muted" font-size="21">Mathematical Physics · Sustainable Infrastructure · Scientific Computing</text>
<text x="80" y="202" class="fg math" font-size="25">Evidence → inference → dynamics → geometry → viability → control → design → validation</text>
<g transform="translate(80 240)"><circle cx="12" cy="0" r="7" class="source"/><text x="30" y="7" class="muted" font-size="15">source mathematics</text><circle cx="220" cy="0" r="7" class="state" fill="var(--state)"/><text x="238" y="7" class="muted" font-size="15">dynamic state</text><circle cx="398" cy="0" r="7" class="unc"/><text x="416" y="7" class="muted" font-size="15">uncertainty</text><circle cx="550" cy="0" r="7" class="viable"/><text x="568" y="7" class="muted" font-size="15">viability / recovery</text><circle cx="765" cy="0" r="7" class="decision"/><text x="783" y="7" class="muted" font-size="15">optimization / decision</text></g>
<g transform="translate(1190 46)"><rect class="panel" width="330" height="214" rx="18"/><text x="26" y="44" class="fg" font-size="17" font-weight="700">Research invariant</text><text x="26" y="86" class="fg math" font-size="24">claim strength ≤ evidence strength</text><text x="26" y="126" class="muted" font-size="15">theme changes presentation only;</text><text x="26" y="151" class="muted" font-size="15">equations, geometry, values, and</text><text x="26" y="176" class="muted" font-size="15">evidence state remain invariant.</text></g>
</svg>