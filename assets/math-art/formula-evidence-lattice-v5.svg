<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
<title id="title">Formula to evidence to bounded claim</title><desc id="desc">A 1920 by 600 provenance chain from source through derivation, model, computation, verification and empirical evidence to a bounded claim, with separate hypothesis and target branches.</desc>
<defs><style>:root{--bg:#fff;--ink:#0B3D24;--muted:#496355;--f:#176A38;--e:#2F8F50;--m:#6FBD83;--l:#DDEFE2;--p:#F5FBF7}@media(prefers-color-scheme:dark){:root{--bg:#06130B;--ink:#ECFFF1;--muted:#A8CBB2;--f:#8FE4A4;--e:#69D383;--m:#4BB86A;--l:#164125;--p:#0A1C10}}text{font-family:Inter,Segoe UI,Arial,sans-serif}.math{font-family:Cambria Math,STIX Two Math,Georgia,serif}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--f)"/></marker></defs>
<rect width="1920" height="600" fill="var(--bg)"/>
<text x="960" y="66" text-anchor="middle" fill="var(--ink)" font-size="40" font-weight="800">FORMULA → EVIDENCE → BOUNDED CLAIM</text>
<text x="960" y="102" text-anchor="middle" fill="var(--muted)" font-size="19" font-weight="600">Mathematical sophistication never upgrades evidence status by itself</text>
<g stroke="var(--f)" stroke-width="3" marker-end="url(#a)"><line x1="202" y1="235" x2="353" y2="235"/><line x1="457" y1="235" x2="608" y2="235"/><line x1="712" y1="235" x2="863" y2="235"/><line x1="967" y1="235" x2="1118" y2="235"/><line x1="1222" y1="235" x2="1373" y2="235"/><line x1="1477" y1="235" x2="1642" y2="235"/></g>
<g text-anchor="middle">
<g transform="translate(150 0)"><circle cx="0" cy="235" r="48" fill="var(--bg)" stroke="var(--e)" stroke-width="3"/><text y="245" fill="var(--f)" font-size="24" font-weight="800">[S]</text><text y="318" fill="var(--ink)" font-size="18" font-weight="800">SOURCE</text><text y="355" fill="var(--muted)" font-size="18">authoritative</text><text y="381" fill="var(--muted)" font-size="18">literature / data</text></g>
<g transform="translate(405 0)"><circle cx="0" cy="235" r="48" fill="var(--bg)" stroke="var(--e)" stroke-width="3"/><text y="245" fill="var(--f)" font-size="24" font-weight="800">[D]</text><text y="318" fill="var(--ink)" font-size="18" font-weight="800">DERIVED</text><text y="355" fill="var(--muted)" font-size="18">transformation</text><text y="381" fill="var(--muted)" font-size="18">from source</text></g>
<g transform="translate(660 0)"><circle cx="0" cy="235" r="48" fill="var(--bg)" stroke="var(--e)" stroke-width="3"/><text y="245" fill="var(--f)" font-size="24" font-weight="800">[M]</text><text y="318" fill="var(--ink)" font-size="18" font-weight="800">MODEL</text><text y="355" fill="var(--muted)" font-size="18">assumptions</text><text y="381" fill="var(--muted)" font-size="18">&amp; structure</text></g>
<g transform="translate(915 0)"><circle cx="0" cy="235" r="48" fill="var(--bg)" stroke="var(--e)" stroke-width="3"/><text y="245" fill="var(--f)" font-size="24" font-weight="800">[C]</text><text y="318" fill="var(--ink)" font-size="18" font-weight="800">COMPUTED</text><text y="355" fill="var(--muted)" font-size="18">algorithmic</text><text y="381" fill="var(--muted)" font-size="18">result</text></g>
<g transform="translate(1170 0)"><circle cx="0" cy="235" r="48" fill="var(--bg)" stroke="var(--e)" stroke-width="3"/><text y="245" fill="var(--f)" font-size="24" font-weight="800">[V]</text><text y="318" fill="var(--ink)" font-size="18" font-weight="800">VERIFIED</text><text y="355" fill="var(--muted)" font-size="18">independent</text><text y="381" fill="var(--muted)" font-size="18">check</text></g>
<g transform="translate(1425 0)"><circle cx="0" cy="235" r="48" fill="var(--bg)" stroke="var(--e)" stroke-width="3"/><text y="245" fill="var(--f)" font-size="24" font-weight="800">[E]</text><text y="318" fill="var(--ink)" font-size="18" font-weight="800">EMPIRICAL</text><text y="355" fill="var(--muted)" font-size="18">external</text><text y="381" fill="var(--muted)" font-size="18">validation</text></g>
<g transform="translate(1700 0)"><circle cx="0" cy="235" r="54" fill="var(--p)" stroke="var(--f)" stroke-width="4"/><text y="245" fill="var(--f)" font-size="24" font-weight="800">C*</text><text y="318" fill="var(--ink)" font-size="18" font-weight="800">BOUNDED CLAIM</text><text y="355" fill="var(--muted)" font-size="18">scope +</text><text y="381" fill="var(--muted)" font-size="18">conditions</text></g>
</g>
<path d="M660 400C650 455 535 470 470 500" fill="none" stroke="var(--f)" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#a)"/><circle cx="430" cy="520" r="34" fill="var(--bg)" stroke="var(--f)" stroke-width="2"/><text x="430" y="527" text-anchor="middle" fill="var(--f)" font-size="20" font-weight="800">[H]</text><text x="430" y="575" text-anchor="middle" fill="var(--muted)" font-size="18" font-weight="600">Hypothesis · test / falsify</text>
<path d="M915 400C940 455 1080 470 1140 500" fill="none" stroke="var(--f)" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#a)"/><circle cx="1180" cy="520" r="34" fill="var(--bg)" stroke="var(--f)" stroke-width="2"/><text x="1180" y="527" text-anchor="middle" fill="var(--f)" font-size="20" font-weight="800">[T]</text><text x="1180" y="575" text-anchor="middle" fill="var(--muted)" font-size="18" font-weight="600">Target · verify requirement</text>
<text x="1570" y="520" text-anchor="middle" fill="var(--f)" font-size="20" font-weight="700" class="math">claim strength ≤ evidence strength</text><text x="1570" y="554" text-anchor="middle" fill="var(--muted)" font-size="18">Source theorem ≠ original contribution</text><text x="1570" y="580" text-anchor="middle" fill="var(--muted)" font-size="18">Model output ≠ observation</text>
</svg>