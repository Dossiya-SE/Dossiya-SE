ont-size="19" font-weight="800" text-anchor="middle" letter-spacing="0" font-style="normal">HYPOTHESIS</text><text x="500" y="990" fill="#496355" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" letter-spacing="0" font-style="normal">Proposed explanation · testable statement</text><path d="M 1526.6666666666667 500 C 1556.6666666666667 710, 1720 730, 1820 815" stroke="#176a38" stroke-width="3" fill="none" opacity="1" stroke-dasharray="10 8" marker-end="url(#arr)"/><circle cx="1850" cy="870" r="58" fill="#f3fbf5" stroke="#2f8f50" stroke-width="3" opacity="1"/><text x="1850" y="880" fill="#176a38" font-family="STIX Two Math,Cambria Math,Georgia,'Times New Roman',serif" font-size="26" font-weight="800" text-anchor="middle" letter-spacing="0" font-style="normal">[T]</text><text x="1850" y="958" fill="#0b2114" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" text-anchor="middle" letter-spacing="0" font-style="normal">TARGET</text><text x="1850" y="990" fill="#496355" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="middle" letter-spacing="0" font-style="normal">Measurable requirement · design objective</text><rect x="720" y="790" width="970" height="220" rx="28" fill="#f3fbf5" stroke="#a8d8b4" stroke-width="2" opacity="1"/><text x="1205" y="835" fill="#176a38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" text-anchor="middle" letter-spacing="0" font-style="normal">FORMULA OBJECT CONTRACT</text><text x="1205" y="880" fill="#0b2114" font-family="STIX Two Math,Cambria Math,Georgia,'Times New Roman',serif" font-size="18" font-weight="500" text-anchor="middle" letter-spacing="0" font-style="normal">formula ID → provenance → assumptions → symbols / units → implementation → verification → validation → bounded claim</text><text x="1205" y="925" fill="#496355" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="middle" letter-spacing="0" font-style="normal">Source theorem ≠ original contribution   ·   Software test ≠ empirical validation   ·   Model output ≠ observation</text><text x="1200.0" y="1145" fill="#176a38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="4" font-style="normal">RIGOR  •  STRUCTURE  •  ELEGANCE  •  IMPACT</text></svg>