<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 880" role="img" aria-labelledby="title desc">
<title id="title">Dossiya Dakou — Mathematical Systems Engineering for Sustainable Resilience</title>
<desc id="desc">Modern monochrome mathematical-art profile banner integrating multilayer infrastructure, interdependency dynamics, viability geometry, nonlinear transitions, manifolds and sustainable resilience.</desc>
<metadata>Native editable SVG. Conceptual mathematical research identity graphic; not an empirical result.</metadata>
<defs>
<style>
:root{--bg:#ffffff;--ink:#111111;--muted:#5d5d5d;--soft:#f2f2f2;--line:#c9c9c9;--mesh:#d8d8d8;--shade:#e9e9e9}
@media(prefers-color-scheme:dark){:root{--bg:#ffffff;--ink:#111111;--muted:#5d5d5d;--soft:#f2f2f2;--line:#c9c9c9;--mesh:#d8d8d8;--shade:#e9e9e9}}
text{font-family:Georgia,'Times New Roman',serif;fill:var(--ink)}.sans{font-family:Inter,Segoe UI,Arial,sans-serif}.math{font-family:'STIX Two Math','Cambria Math',Georgia,serif}.ital{font-style:italic}.caps{letter-spacing:2.5px}.thin{font-weight:400}.bold{font-weight:700}
</style>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--ink)"/></marker>
<pattern id="mesh" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="var(--mesh)" stroke-width=".7"/></pattern>
</defs>
<rect width="2048" height="880" fill="var(--bg)"/>

<!-- multilayer network -->
<g transform="translate(48 48)">
<text x="0" y="24" font-size="22" font-weight="700">Power</text><text x="0" y="48" font-size="15" class="ital">(E¹)</text>
<text x="0" y="118" font-size="22" font-weight="700">Transportation</text><text x="0" y="142" font-size="15" class="ital">(E²)</text>
<text x="0" y="212" font-size="22" font-weight="700">Information</text><text x="0" y="236" font-size="15" class="ital">(E³)</text>
<text x="0" y="306" font-size="22" font-weight="700">Organization</text><text x="0" y="330" font-size="15" class="ital">(E⁴)</text>
<g transform="translate(115 0)" fill="none" stroke="var(--ink)">
<polygon points="0,28 300,0 355,44 50,72" fill="var(--soft)" stroke="var(--line)"/>
<polygon points="0,122 300,94 355,138 50,166" fill="var(--soft)" stroke="var(--line)"/>
<polygon points="0,216 300,188 355,232 50,260" fill="var(--soft)" stroke="var(--line)"/>
<polygon points="0,310 300,282 355,326 50,354" fill="var(--soft)" stroke="var(--line)"/>
<g stroke-width="1.4"><path d="M50 48L120 29L190 51L255 21L320 42"/><path d="M58 142L122 112L188 144L252 116L318 136"/><path d="M52 236L118 210L190 239L258 206L318 228"/><path d="M55 330L120 300L188 332L255 300L320 324"/></g>
<g stroke-dasharray="6 5" stroke="var(--muted)"><line x1="50" y1="48" x2="58" y2="142"/><line x1="120" y1="29" x2="122" y2="112"/><line x1="190" y1="51" x2="188" y2="144"/><line x1="255" y1="21" x2="252" y2="116"/><line x1="320" y1="42" x2="318" y2="136"/><line x1="58" y1="142" x2="52" y2="236"/><line x1="122" y1="112" x2="118" y2="210"/><line x1="188" y1="144" x2="190" y2="239"/><line x1="252" y1="116" x2="258" y2="206"/><line x1="318" y1="136" x2="318" y2="228"/><line x1="52" y1="236" x2="55" y2="330"/><line x1="118" y1="210" x2="120" y2="300"/><line x1="190" y1="239" x2="188" y2="332"/><line x1="258" y1="206" x2="255" y2="300"/><line x1="318" y1="228" x2="320" y2="324"/></g>
<g fill="var(--ink)"><circle cx="50" cy="48" r="6"/><circle cx="120" cy="29" r="6"/><circle cx="190" cy="51" r="6"/><circle cx="255" cy="21" r="6"/><circle cx="320" cy="42" r="6"/><circle cx="58" cy="142" r="6"/><circle cx="122" cy="112" r="6"/><circle cx="188" cy="144" r="6"/><circle cx="252" cy="116" r="6"/><circle cx="318" cy="136" r="6"/><circle cx="52" cy="236" r="6"/><circle cx="118" cy="210" r="6"/><circle cx="190" cy="239" r="6"/><circle cx="258" cy="206" r="6"/><circle cx="318" cy="228" r="6"/><circle cx="55" cy="330" r="6"/><circle cx="120" cy="300" r="6"/><circle cx="188" cy="332" r="6"/><circle cx="255" cy="300" r="6"/><circle cx="320" cy="324" r="6"/></g></g>
<text x="480" y="138" font-size="17" class="ital">Interdependent</text><text x="480" y="162" font-size="17" class="ital">infrastructure</text><text x="480" y="186" font-size="17" class="ital">systems</text>
<line x1="5" y1="382" x2="78" y2="382" stroke="var(--ink)" stroke-width="2"/><text x="92" y="388" font-size="14" class="ital">intra-layer link</text><line x1="5" y1="410" x2="78" y2="410" stroke="var(--ink)" stroke-dasharray="7 6"/><text x="92" y="416" font-size="14" class="ital">inter-layer link</text>
</g>

<!-- canonical object -->
<g transform="translate(635 42)"><rect width="515" height="230" rx="12" fill="var(--soft)"/><text x="24" y="40" font-size="23" font-weight="700">Canonical interdependency object:</text><text x="257" y="104" text-anchor="middle" font-size="31" class="math">𝕀ᵅᵝᵢⱼ = (Eᵅᵢ,Eᵝⱼ,Mᵢⱼ,wᵢⱼ,δᵢⱼ,τᵢⱼ,aᵢⱼ,m,ℋₜ)</text><line x1="28" y1="142" x2="487" y2="142" stroke="var(--line)"/><text x="257" y="185" text-anchor="middle" font-size="17" class="ital">Nodes, links, interdependencies, dynamics, and adaptation.</text></g>

<!-- dynamics -->
<g transform="translate(1170 42)"><rect width="320" height="230" rx="12" fill="var(--soft)"/><text x="24" y="40" font-size="23" font-weight="700">Coupled system dynamics:</text><text x="160" y="101" text-anchor="middle" font-size="38" class="math">Ẏ = F(Y,u,η;θ)</text><g font-size="17"><text x="28" y="148"><tspan font-style="italic">Y</tspan> = system state vector</text><text x="28" y="174"><tspan font-style="italic">u</tspan> = control input</text><text x="28" y="200"><tspan font-style="italic">η</tspan> = exogenous disturbances</text><text x="28" y="226"><tspan font-style="italic">θ</tspan> = model parameters</text></g></g>

<!-- viability -->
<g transform="translate(1518 28)"><text x="220" y="24" text-anchor="middle" font-size="22" font-weight="700">Viability set and safe operating space</text><line x1="45" y1="285" x2="360" y2="285" stroke="var(--ink)" stroke-width="2" marker-end="url(#arrow)"/><line x1="62" y1="305" x2="62" y2="58" stroke="var(--ink)" stroke-width="2" marker-end="url(#arrow)"/><text x="367" y="306" font-size="18" class="math">x₁</text><text x="36" y="57" font-size="18" class="math">x₂</text><path d="M91 250C72 201 89 121 150 90C216 57 290 85 311 142C338 216 296 263 222 268C161 272 111 271 91 250Z" fill="var(--shade)" stroke="var(--ink)" stroke-width="2"/><text x="200" y="170" text-anchor="middle" font-size="30" class="math">𝒱ₛᵤₛ</text><text x="287" y="98" font-size="20" class="math">∂𝒱ₛᵤₛ</text><path d="M118 228C135 203 144 187 167 177C190 167 212 152 236 136" fill="none" stroke="var(--ink)" stroke-width="2.3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><circle cx="118" cy="228" r="6" fill="var(--ink)"/><circle cx="168" cy="176" r="5" fill="var(--ink)"/><circle cx="236" cy="136" r="6" fill="var(--ink)"/><text x="91" y="251" font-size="17" class="math">Y(0)</text><text x="243" y="130" font-size="17" class="math">Y(t)</text><text x="330" y="118" font-size="17" class="ital">Resilience margin</text><text x="330" y="151" font-size="23" class="math">ρ_g(Y)=d_g(Y,∂𝒱ₛᵤₛ)</text><text x="330" y="181" font-size="14" class="ital">Distance to the viable boundary.</text></g>

<!-- central identity -->
<g transform="translate(0 0)"><line x1="450" y1="405" x2="600" y2="405" stroke="var(--ink)"/><line x1="1450" y1="405" x2="1595" y2="405" stroke="var(--ink)"/><text x="1024" y="430" text-anchor="middle" font-size="108" font-style="italic" font-weight="700">Dossiya Dakou</text><text x="1024" y="485" text-anchor="middle" font-size="31" class="ital">Mathematical Systems Engineering for Sustainable Resilience</text></g>

<!-- phase portrait -->
<g transform="translate(40 530)"><text x="0" y="0" font-size="22" font-weight="700">Dynamics, stability, and transition</text><line x1="32" y1="255" x2="560" y2="255" stroke="var(--ink)" stroke-width="2" marker-end="url(#arrow)"/><line x1="48" y1="270" x2="48" y2="28" stroke="var(--ink)" stroke-width="2" marker-end="url(#arrow)"/><text x="567" y="269" font-size="18" class="math">x</text><text x="17" y="29" font-size="18" class="math">V(x)</text><g fill="none" stroke="var(--muted)" stroke-width="1.2"><path d="M58 90C115 137 158 182 205 208C254 235 294 115 332 96C379 73 420 230 467 210C506 194 525 144 551 95"/><path d="M60 108C118 148 160 189 208 217C252 241 291 133 332 112C381 87 419 239 470 219C510 204 531 160 552 112"/><path d="M64 129C121 158 164 197 208 223C251 246 288 151 331 130C381 105 419 245 468 228C509 214 532 181 550 133"/></g><circle cx="145" cy="205" r="7" fill="var(--ink)"/><circle cx="468" cy="210" r="7" fill="var(--ink)"/><circle cx="331" cy="96" r="6" fill="var(--ink)"/><line x1="331" y1="96" x2="331" y2="238" stroke="var(--ink)" stroke-dasharray="7 6"/><text x="95" y="233" font-size="15" class="ital">stable regime</text><text x="420" y="237" font-size="15" class="ital">alternative regime</text><text x="260" y="43" font-size="15" class="ital">critical transition</text><text x="245" y="63" font-size="14" class="ital">(bifurcation threshold)</text><text x="505" y="92" font-size="27" class="math">ẋ=f(x;λ)</text></g>

<!-- manifold -->
<g transform="translate(690 530)"><text x="100" y="0" font-size="22" font-weight="700">Geometric view of complex systems</text><path d="M0 208C96 78 187 74 265 149C341 221 430 206 537 101C605 35 674 67 725 141L725 239C642 180 575 174 515 227C419 312 344 309 258 246C161 174 83 202 0 278Z" fill="url(#mesh)" stroke="var(--line)"/><text x="35" y="260" font-size="40" class="math">𝓜</text><polygon points="232,90 432,70 510,128 306,153" fill="var(--soft)" stroke="var(--line)"/><circle cx="350" cy="132" r="7" fill="var(--ink)"/><line x1="350" y1="132" x2="350" y2="52" stroke="var(--ink)" stroke-width="2" marker-end="url(#arrow)"/><text x="364" y="58" font-size="22" class="math">n</text><text x="367" y="128" font-size="20" class="math">p</text><text x="441" y="94" font-size="20" class="math">Tₚ𝓜</text><path d="M350 132C385 172 422 194 471 202C529 212 574 195 624 167" fill="none" stroke="var(--ink)" stroke-width="3" marker-end="url(#arrow)"/><text x="536" y="187" font-size="20" class="math">γ(s)</text><text x="750" y="108" font-size="20" class="ital">Geometry reveals structure.</text><text x="750" y="140" font-size="20" class="ital">Structure enables resilience.</text></g>

<!-- nexus -->
<g transform="translate(1510 520)"><text x="0" y="0" font-size="22" font-weight="700">People – Infrastructure – Planet</text><circle cx="176" cy="95" r="92" fill="none" stroke="var(--ink)"/><circle cx="110" cy="188" r="92" fill="none" stroke="var(--ink)"/><circle cx="242" cy="188" r="92" fill="none" stroke="var(--ink)"/><circle cx="176" cy="153" r="52" fill="var(--shade)" stroke="var(--line)"/><text x="176" y="137" text-anchor="middle" font-size="18" font-weight="700">Sustainable</text><text x="176" y="161" text-anchor="middle" font-size="18" font-weight="700">Resilience</text><text x="176" y="65" text-anchor="middle" font-size="18" font-weight="700">People</text><text x="176" y="86" text-anchor="middle" font-size="13" class="ital">Equity &amp; well-being</text><text x="69" y="194" text-anchor="middle" font-size="17" font-weight="700">Infrastructure</text><text x="69" y="215" text-anchor="middle" font-size="13" class="ital">Reliability &amp; adaptation</text><text x="284" y="194" text-anchor="middle" font-size="17" font-weight="700">Planet</text><text x="284" y="215" text-anchor="middle" font-size="13" class="ital">Planetary boundaries</text><line x1="362" y1="45" x2="362" y2="260" stroke="var(--line)"/><text x="386" y="82" font-size="17" class="ital">Integrated systems</text><text x="386" y="108" font-size="17" class="ital">for a more resilient</text><text x="386" y="134" font-size="17" class="ital">and equitable future.</text></g>

<line x1="36" y1="838" x2="2008" y2="838" stroke="var(--line)"/><text x="1024" y="865" text-anchor="middle" font-size="16" class="caps">SYSTEMS × MATHEMATICS × HUMAN &amp; PLANETARY WELL-BEING</text>
