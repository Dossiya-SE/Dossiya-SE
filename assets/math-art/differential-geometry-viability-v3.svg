<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 880" role="img" aria-labelledby="title desc">
  <title id="title">Differential geometry and viability research bridge</title>
  <desc id="desc">A conceptual mathematical visual separating source differential geometry from a research transfer to infrastructure viability and recovery geometry. The right-hand manifold and trajectory are conceptual unless a formal metric and differentiable structure are defined in a specific study.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#0b1e32"/>
    </linearGradient>
    <linearGradient id="surf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#244f86" stop-opacity="0.88"/>
      <stop offset="0.5" stop-color="#1e7c83" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#2e8b68" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="risk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36b37e"/>
      <stop offset="0.55" stop-color="#e5b93f"/>
      <stop offset="1" stop-color="#d85d68"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#86a6c7"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4ec9b0"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#e0b84e"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".33"/></filter>
    <style>
      .title{font:700 38px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#f4f8ff}
      .subtitle{font:400 17px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#a8bfd7}
      .head{font:700 19px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#eff6ff}
      .body{font:400 14px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#acc2d9}
      .tiny{font:500 11px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#859fba}
      .math{font:600 20px Georgia,Times New Roman,serif;fill:#eff7ff}
      .math2{font:600 16px Georgia,Times New Roman,serif;fill:#e7f2ff}
      .card{fill:#0d2239;stroke:#294a69;stroke-width:1.4}
      .source{fill:#111f45;stroke:#5367d7;stroke-width:1.4}
      .model{fill:#0d2c2a;stroke:#36a17d;stroke-width:1.4}
      .hyp{fill:#2d1e35;stroke:#b46bd1;stroke-width:1.4;stroke-dasharray:7 6}
      .axis{stroke:#6e8dac;stroke-width:1.8;marker-end:url(#arrow)}
      .grid{fill:none;stroke:#5e82a7;stroke-opacity:.45;stroke-width:1.1}
      .traj{fill:none;stroke:#4ec9b0;stroke-width:5;marker-end:url(#arrowGreen)}
      .unc{fill:none;stroke:#e0b84e;stroke-width:3;stroke-dasharray:8 8}
      .frameT{stroke:#eaf5ff;stroke-width:4;marker-end:url(#arrow)}
      .frameN{stroke:#4ec9b0;stroke-width:4;marker-end:url(#arrowGreen)}
      .frameB{stroke:#e0b84e;stroke-width:4;marker-end:url(#arrowAmber)}
      .divider{stroke:#284760;stroke-width:1.2}
    </style>
  </defs>

  <rect width="1600" height="880" rx="28" fill="url(#bg)"/>
  <text x="70" y="66" class="title">Differential Geometry → Rigorous Research Geometry</text>
  <text x="70" y="99" class="subtitle">Keep source theorems, visual metaphor, and formally defined infrastructure geometry scientifically distinct</text>

  <line x1="800" y1="142" x2="800" y2="810" class="divider"/>

  <!-- LEFT: source mathematics -->
  <text x="70" y="158" class="head">A. SOURCE DIFFERENTIAL GEOMETRY</text>
  <text x="70" y="183" class="body">Sochi foundation · regular curves/surfaces · tensor-calculus formulation</text>

  <rect x="70" y="208" width="310" height="116" rx="18" class="source" filter="url(#shadow)"/>
  <text x="92" y="239" class="head">Metric</text>
  <text x="92" y="274" class="math">gαβ = ∂αr · ∂βr</text>
  <text x="92" y="302" class="tiny">intrinsic length/angle structure</text>

  <rect x="398" y="208" width="330" height="116" rx="18" class="source" filter="url(#shadow)"/>
  <text x="420" y="239" class="head">Connection</text>
  <text x="420" y="272" class="math2">Γαβγ = ½ gαδ(∂βgγδ + ∂γgβδ − ∂δgβγ)</text>
  <text x="420" y="302" class="tiny">metric-compatible local transport / geodesic coefficients</text>

  <rect x="70" y="342" width="658" height="98" rx="18" class="source"/>
  <text x="92" y="373" class="head">Geodesic</text>
  <text x="92" y="407" class="math2">d²uα/ds² + Γαβγ (duβ/ds)(duγ/ds) = 0</text>
  <text x="530" y="407" class="tiny">local geodesic ≠ guaranteed global shortest path</text>

  <!-- source surface sketch -->
  <g transform="translate(88 482)">
    <path d="M20 166 C120 65 250 50 360 115 C452 170 520 170 610 62 L610 220 C510 298 412 284 320 232 C210 169 106 191 20 268 Z" fill="url(#surf)" opacity=".9"/>
    <path d="M36 147 C126 78 224 74 316 118 C406 160 496 172 590 90" class="grid"/>
    <path d="M28 188 C126 112 228 106 324 151 C418 195 510 201 602 126" class="grid"/>
    <path d="M24 230 C124 155 228 147 326 189 C430 233 518 235 608 168" class="grid"/>
    <path d="M92 87 C126 150 144 205 151 252" class="grid"/>
    <path d="M174 61 C202 129 217 190 220 254" class="grid"/>
    <path d="M266 69 C280 133 292 195 292 255" class="grid"/>
    <path d="M360 101 C365 157 365 212 355 260" class="grid"/>
    <path d="M451 119 C448 177 435 228 414 270" class="grid"/>
    <path d="M535 96 C521 159 499 216 472 264" class="grid"/>
    <path d="M78 218 C164 158 248 150 328 183 C409 216 492 217 553 169" fill="none" stroke="#f6d365" stroke-width="4"/>
    <circle cx="328" cy="183" r="7" fill="#f7fbff"/>
    <line x1="328" y1="183" x2="404" y2="157" class="frameT"/>
    <line x1="328" y1="183" x2="288" y2="122" class="frameN"/>
    <line x1="328" y1="183" x2="334" y2="108" class="frameB"/>
    <text x="410" y="155" class="math2">T</text>
    <text x="267" y="118" class="math2">N</text>
    <text x="340" y="106" class="math2">B</text>
    <text x="42" y="297" class="tiny">coordinate mesh + curve + local moving frame (schematic source-math illustration)</text>
  </g>

  <rect x="70" y="784" width="658" height="42" rx="14" class="source"/>
  <text x="399" y="810" text-anchor="middle" class="math2">K = (eg − f²)/(EG − F²)   ·   ∬S K dσ = 2πχ</text>

  <!-- RIGHT: research transfer -->
  <text x="846" y="158" class="head">B. RESEARCH TRANSFER TO INFRASTRUCTURE STATE SPACE</text>
  <text x="846" y="183" class="body">Only a formal geometric model may inherit metric/curvature language as mathematics</text>

  <rect x="846" y="208" width="300" height="116" rx="18" class="model" filter="url(#shadow)"/>
  <text x="868" y="239" class="head">Admissible set</text>
  <text x="868" y="273" class="math2">KR = Kphys ∩ Kservice ∩ Ksus ∩ Keq</text>
  <text x="868" y="302" class="tiny">declared physical/service/sustainability/equity constraints</text>

  <rect x="1164" y="208" width="366" height="116" rx="18" class="model" filter="url(#shadow)"/>
  <text x="1186" y="239" class="head">Viability / recovery</text>
  <text x="1186" y="273" class="math2">𝒱R ⊂ KR · 𝒞R → 𝒱R · τR(x₀)</text>
  <text x="1186" y="302" class="tiny">viable and recoverable are distinct state classes</text>

  <rect x="846" y="342" width="684" height="98" rx="18" class="hyp"/>
  <text x="868" y="373" class="head">Differential-geometric hypothesis layer — [H]</text>
  <text x="868" y="405" class="math2">define gV on state space? → ΓV → geodesic/action paths → curvature of ∂𝒱R?</text>
  <text x="868" y="428" class="tiny">question marks are deliberate: these are not source theorems about infrastructure</text>

  <!-- viability manifold sketch -->
  <g transform="translate(855 480)">
    <line x1="38" y1="275" x2="620" y2="275" class="axis"/>
    <line x1="38" y1="275" x2="38" y2="24" class="axis"/>
    <text x="626" y="279" class="math2">x₁</text>
    <text x="23" y="18" class="math2">x₂</text>

    <path d="M112 226 C115 132 202 63 324 70 C435 76 522 136 550 217 C486 244 426 254 349 251 C260 248 184 240 112 226 Z" fill="#173f3b" stroke="#36a17d" stroke-width="3" opacity=".92"/>
    <path d="M170 214 C176 150 238 111 324 113 C401 115 464 153 490 207 C444 224 392 229 337 227 C271 226 216 222 170 214 Z" fill="#1e6257" opacity=".72" stroke="#56d3a5" stroke-width="2"/>
    <text x="300" y="171" class="math">𝒱R</text>
    <text x="482" y="235" class="math2">∂𝒱R</text>
    <text x="205" y="124" class="tiny">admissible / viable region</text>

    <path d="M580 246 C525 236 494 216 462 194 C422 166 392 166 359 181 C319 201 292 214 247 197 C211 183 201 154 217 131" class="traj"/>
    <circle cx="580" cy="246" r="8" fill="#d85d68"/>
    <text x="546" y="266" class="tiny">disturbed state</text>
    <text x="218" y="111" class="tiny">candidate controlled recovery path</text>

    <path d="M564 226 C505 220 468 193 439 174 C399 148 360 148 328 163 C293 179 267 189 231 173 C198 159 187 135 199 111" class="unc"/>
    <path d="M596 265 C540 251 510 238 481 216 C440 187 410 184 376 199 C337 216 310 233 263 219 C226 207 213 181 232 151" class="unc"/>
    <text x="430" y="135" class="tiny">uncertainty tube / ensemble envelope only if explicitly constructed</text>

    <path d="M95 232 C110 142 196 64 324 70 C440 75 523 142 550 217" fill="none" stroke="url(#risk)" stroke-width="7" stroke-linecap="round"/>
    <text x="96" y="302" class="tiny">color along boundary may encode a computed scalar field; otherwise use a single semantic color</text>
  </g>

  <rect x="846" y="784" width="684" height="42" rx="14" class="model"/>
  <text x="1188" y="810" text-anchor="middle" class="math2">dH(𝒱dynamic,𝒱static) = declared set-distance diagnostic · not “curvature”</text>

  <text x="800" y="858" text-anchor="middle" class="tiny">Scientific rule: source geometry → explicit transfer assumptions → formal state-space structure → computation → invariant checks → empirical validation where claims require it</text>
</svg>
