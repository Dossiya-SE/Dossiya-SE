<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">Research Operating System</title>
<desc id="desc">Modern monochrome seven-stage framework from multilayer structure and causal mechanisms through dynamics, control, viability, resilience-to-sustainability transformation and sustainable pathways.</desc>
<metadata>Native editable SVG. Conceptual research architecture; not empirical validation.</metadata>
<defs><style>
:root{--bg:#fff;--ink:#111;--muted:#626262;--soft:#f3f3f3;--line:#c9c9c9;--shade:#e8e8e8;--mesh:#d7d7d7}
@media(prefers-color-scheme:dark){:root{--bg:#fff;--ink:#111;--muted:#626262;--soft:#f3f3f3;--line:#c9c9c9;--shade:#e8e8e8;--mesh:#d7d7d7}}
text{font-family:Georgia,'Times New Roman',serif;fill:var(--ink)}.math{font-family:'STIX Two Math','Cambria Math',Georgia,serif}.ital{font-style:italic}.caps{letter-spacing:2.2px}.sans{font-family:Inter,Segoe UI,Arial,sans-serif}
</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--ink)"/></marker><pattern id="mesh" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="var(--mesh)" stroke-width=".7"/></pattern></defs>
<rect width="1920" height="1080" fill="var(--bg)"/>

<!-- top left multilayer system -->
<g transform="translate(35 28)"><text x="0" y="20" font-size="22" font-weight="700">Power</text><text x="0" y="83" font-size="22" font-weight="700">Transportation</text><text x="0" y="146" font-size="22" font-weight="700">Information</text><text x="0" y="209" font-size="22" font-weight="700">Organization</text><g transform="translate(125 0)" fill="none"><g stroke="var(--line)" fill="var(--soft)"><polygon points="0,20 260,0 310,28 48,50"/><polygon points="0,83 260,63 310,91 48,113"/><polygon points="0,146 260,126 310,154 48,176"/><polygon points="0,209 260,189 310,217 48,239"/></g><g stroke="var(--ink)"><path d="M50 37L110 17L173 36L237 15L285 33"/><path d="M50 100L110 80L173 99L237 78L285 96"/><path d="M50 163L110 143L173 162L237 141L285 159"/><path d="M50 226L110 206L173 225L237 204L285 222"/></g><g stroke="var(--muted)" stroke-dasharray="6 5"><line x1="50" y1="37" x2="50" y2="226"/><line x1="110" y1="17" x2="110" y2="206"/><line x1="173" y1="36" x2="173" y2="225"/><line x1="237" y1="15" x2="237" y2="204"/><line x1="285" y1="33" x2="285" y2="222"/></g><g fill="var(--ink)"><circle cx="50" cy="37" r="5"/><circle cx="110" cy="17" r="5"/><circle cx="173" cy="36" r="5"/><circle cx="237" cy="15" r="5"/><circle cx="285" cy="33" r="5"/><circle cx="50" cy="100" r="5"/><circle cx="110" cy="80" r="5"/><circle cx="173" cy="99" r="5"/><circle cx="237" cy="78" r="5"/><circle cx="285" cy="96" r="5"/><circle cx="50" cy="163" r="5"/><circle cx="110" cy="143" r="5"/><circle cx="173" cy="162" r="5"/><circle cx="237" cy="141" r="5"/><circle cx="285" cy="159" r="5"/><circle cx="50" cy="226" r="5"/><circle cx="110" cy="206" r="5"/><circle cx="173" cy="225" r="5"/><circle cx="237" cy="204" r="5"/><circle cx="285" cy="222" r="5"/></g></g><text x="470" y="105" font-size="17" class="ital">Interdependent</text><text x="470" y="130" font-size="17" class="ital">multilayer system</text></g>

<!-- top center object -->
<g transform="translate(575 28)"><rect width="585" height="250" rx="12" fill="var(--soft)"/><text x="24" y="38" font-size="23" font-weight="700">Canonical interdependency object</text><text x="292" y="105" text-anchor="middle" font-size="30" class="math">𝕀ᵅᵝᵢⱼ=(Eᵅᵢ,Eᵝⱼ,Mᵢⱼ,wᵢⱼ,δᵢⱼ,τᵢⱼ,aᵢⱼ,m,ℋₜ)</text><line x1="24" y1="135" x2="561" y2="135" stroke="var(--line)"/><text x="292" y="175" text-anchor="middle" font-size="16" class="ital">Nodes, links, interdependencies, dynamics, and adaptation.</text><text x="24" y="218" font-size="18" font-weight="700">Coupled system dynamics</text><text x="355" y="220" font-size="31" class="math">Ẏ=F_G(Y,u,η;θ)</text></g>

<!-- top right viability -->
<g transform="translate(1205 24)"><text x="300" y="20" text-anchor="middle" font-size="23" font-weight="700">Viability and sustainable operating space</text><line x1="55" y1="235" x2="355" y2="235" stroke="var(--ink)" stroke-width="2" marker-end="url(#a)"/><line x1="72" y1="252" x2="72" y2="52" stroke="var(--ink)" stroke-width="2" marker-end="url(#a)"/><text x="363" y="251" font-size="17" class="math">x₁</text><text x="49" y="50" font-size="17" class="math">x₂</text><path d="M103 214C84 165 101 91 163 68C226 44 306 74 324 132C343 192 309 224 246 225C185 226 122 228 103 214Z" fill="var(--shade)" stroke="var(--ink)" stroke-width="2"/><text x="210" y="154" text-anchor="middle" font-size="27" class="math">𝒱ₛᵤₛ</text><text x="293" y="81" font-size="19" class="math">∂𝒱ₛᵤₛ</text><path d="M128 196C152 167 181 154 208 142C233 131 258 116 281 99" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/><circle cx="128" cy="196" r="5" fill="var(--ink)"/><text x="104" y="219" font-size="16" class="math">Y(0)</text><text x="286" y="94" font-size="16" class="math">Y(t)</text><text x="390" y="103" font-size="22" class="math">g(Y)≤0</text><text x="390" y="139" font-size="15" class="ital">Safe, resilient, sustainable states.</text></g>

<!-- title -->
<line x1="200" y1="332" x2="520" y2="332" stroke="var(--line)"/><line x1="1400" y1="332" x2="1720" y2="332" stroke="var(--line)"/><text x="960" y="350" text-anchor="middle" font-size="74" font-style="italic" font-weight="700">Research Operating System</text><text x="960" y="392" text-anchor="middle" font-size="25" class="ital">From interconnected knowledge to a sustainable world</text>

<!-- seven stages -->
<g transform="translate(22 425)">
<g stroke="var(--line)"><line x1="240" y1="0" x2="240" y2="430"/><line x1="510" y1="0" x2="510" y2="430"/><line x1="780" y1="0" x2="780" y2="430"/><line x1="1050" y1="0" x2="1050" y2="430"/><line x1="1320" y1="0" x2="1320" y2="430"/><line x1="1590" y1="0" x2="1590" y2="430"/></g>
<!-- 1 -->
<g transform="translate(0 0)"><text x="110" y="24" text-anchor="middle" font-size="21" font-weight="700">1. Multilayer Structure</text><text x="110" y="47" text-anchor="middle" font-size="15" class="ital">Represent complex interdependent systems</text><g transform="translate(35 80)" fill="none" stroke="var(--ink)"><polygon points="0,30 130,0 170,25 40,55" fill="var(--soft)" stroke="var(--line)"/><polygon points="0,90 130,60 170,85 40,115" fill="var(--soft)" stroke="var(--line)"/><polygon points="0,150 130,120 170,145 40,175" fill="var(--soft)" stroke="var(--line)"/><polygon points="0,210 130,180 170,205 40,235" fill="var(--soft)" stroke="var(--line)"/><g stroke-dasharray="5 5" stroke="var(--muted)"><line x1="40" y1="45" x2="40" y2="225"/><line x1="90" y1="22" x2="90" y2="202"/><line x1="145" y1="32" x2="145" y2="212"/></g><g fill="var(--ink)"><circle cx="40" cy="45" r="5"/><circle cx="90" cy="22" r="5"/><circle cx="145" cy="32" r="5"/><circle cx="40" cy="105" r="5"/><circle cx="90" cy="82" r="5"/><circle cx="145" cy="92" r="5"/><circle cx="40" cy="165" r="5"/><circle cx="90" cy="142" r="5"/><circle cx="145" cy="152" r="5"/><circle cx="40" cy="225" r="5"/><circle cx="90" cy="202" r="5"/><circle cx="145" cy="212" r="5"/></g></g><text x="110" y="350" text-anchor="middle" font-size="22" class="math">𝒢=(𝒱,𝓔,𝒲,𝓛)</text><text x="110" y="380" text-anchor="middle" font-size="14" class="ital">Networks, layers, interfaces.</text></g>
<!-- 2 -->
<g transform="translate(250 0)"><text x="125" y="24" text-anchor="middle" font-size="21" font-weight="700">2. Causal Mechanisms</text><text x="125" y="47" text-anchor="middle" font-size="15" class="ital">Identify structure, causality, influence</text><g transform="translate(32 92)" fill="none" stroke="var(--ink)" stroke-width="2" marker-end="url(#a)"><circle cx="35" cy="50" r="22" fill="var(--bg)"/><circle cx="150" cy="20" r="22" fill="var(--bg)"/><circle cx="150" cy="110" r="22" fill="var(--bg)"/><circle cx="230" cy="63" r="22" fill="var(--bg)"/><line x1="57" y1="47" x2="126" y2="28"/><line x1="56" y1="60" x2="128" y2="100"/><line x1="171" y1="29" x2="208" y2="52"/><line x1="172" y1="101" x2="208" y2="74"/></g><text x="67" y="149" font-size="18" class="math">X</text><text x="181" y="119" font-size="18" class="math">Z</text><text x="181" y="210" font-size="18" class="math">W</text><text x="262" y="162" font-size="18" class="math">Y</text><text x="125" y="286" text-anchor="middle" font-size="24" class="math">P(Y | do(X))</text><text x="125" y="350" text-anchor="middle" font-size="14" class="ital">Mechanisms before correlation.</text></g>
<!-- 3 -->
<g transform="translate(520 0)"><text x="125" y="24" text-anchor="middle" font-size="20" font-weight="700">3. Coupled Hybrid</text><text x="125" y="48" text-anchor="middle" font-size="20" font-weight="700">Multiscale Dynamics</text><text x="125" y="72" text-anchor="middle" font-size="14" class="ital">Physics, data, scales, domains</text><g transform="translate(30 100)" fill="none"><path d="M0 45C48 4 92 18 132 48S191 63 220 25" stroke="var(--ink)" stroke-width="2"/><path d="M0 110C52 72 90 82 132 111S187 121 220 87" stroke="var(--muted)" stroke-width="2"/><path d="M0 175C49 143 88 147 130 175S189 189 220 156" stroke="var(--line)" stroke-width="2"/></g><text x="125" y="310" text-anchor="middle" font-size="22" class="math">Ẏ=F_G(Y,u,η;θ)</text><text x="125" y="350" text-anchor="middle" font-size="14" class="ital">Continuous–discrete, nonlinear, multiscale.</text></g>
<!-- 4 -->
<g transform="translate(790 0)"><text x="125" y="24" text-anchor="middle" font-size="21" font-weight="700">4. Feedback &amp; Control</text><text x="125" y="47" text-anchor="middle" font-size="15" class="ital">Guide, regulate, optimize</text><g transform="translate(28 115)" fill="none" stroke="var(--ink)" stroke-width="2"><rect x="80" y="0" width="85" height="58"/><rect x="86" y="122" width="78" height="50"/><line x1="0" y1="29" x2="80" y2="29" marker-end="url(#a)"/><line x1="165" y1="29" x2="225" y2="29" marker-end="url(#a)"/><path d="M205 29V147H164" marker-end="url(#a)"/><path d="M86 147H20V39" marker-end="url(#a)"/></g><text x="150" y="148" text-anchor="middle" font-size="17">System 𝒢</text><text x="151" y="271" text-anchor="middle" font-size="17">π(Y)</text><text x="15" y="148" font-size="16" class="math">u(t)</text><text x="258" y="148" font-size="16" class="math">Y(t)</text><text x="125" y="330" text-anchor="middle" font-size="20" class="math">u(t)=π(Y(t))</text><text x="125" y="360" text-anchor="middle" font-size="14" class="ital">Feedback, learning, adaptive control.</text></g>
<!-- 5 -->
<g transform="translate(1060 0)"><text x="125" y="24" text-anchor="middle" font-size="21" font-weight="700">5. Viability</text><text x="125" y="47" text-anchor="middle" font-size="15" class="ital">Safe and acceptable operating space</text><line x1="42" y1="277" x2="226" y2="277" stroke="var(--ink)" marker-end="url(#a)"/><line x1="52" y1="292" x2="52" y2="102" stroke="var(--ink)" marker-end="url(#a)"/><path d="M75 254C58 218 74 156 112 132C152 107 201 121 215 165C230 214 199 252 156 255C119 258 89 261 75 254Z" fill="var(--shade)" stroke="var(--ink)"/><text x="145" y="194" text-anchor="middle" font-size="22" class="math">𝒱ₛᵤₛ</text><path d="M91 238C112 215 134 203 158 192C176 184 190 171 200 156" fill="none" stroke="var(--ink)" stroke-dasharray="6 5" marker-end="url(#a)"/><circle cx="91" cy="238" r="4" fill="var(--ink)"/><text x="125" y="330" text-anchor="middle" font-size="19" class="math">Y(t)∈𝒱ₛᵤₛ, ∀t≥0</text><text x="125" y="360" text-anchor="middle" font-size="14" class="ital">Maintain viability under uncertainty.</text></g>
<!-- 6 -->
<g transform="translate(1330 0)"><text x="125" y="24" text-anchor="middle" font-size="19" font-weight="700">6. Resilience-to-</text><text x="125" y="47" text-anchor="middle" font-size="19" font-weight="700">Sustainability Interface</text><text x="125" y="70" text-anchor="middle" font-size="14" class="ital">Absorb, adapt, transform</text><g transform="translate(10 112)" fill="none" stroke="var(--muted)"><path d="M0 110C43 27 87 23 120 111S195 190 235 88"/><path d="M0 132C47 58 85 52 120 128S194 205 235 111"/><path d="M0 152C51 88 85 83 120 143S193 216 235 133"/></g><circle cx="82" cy="228" r="7" fill="var(--ink)"/><circle cx="220" cy="210" r="7" fill="var(--ink)"/><path d="M85 222C119 183 151 183 193 204" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="62" y="258" font-size="14" class="ital">resilient basin</text><text x="180" y="244" font-size="14" class="ital">sustainable basin</text><text x="125" y="335" text-anchor="middle" font-size="18" class="math">ẋ=f(x)+d(t)</text><text x="125" y="365" text-anchor="middle" font-size="14" class="ital">From shock absorption to transformation.</text></g>
<!-- 7 -->
<g transform="translate(1600 0)"><text x="125" y="24" text-anchor="middle" font-size="19" font-weight="700">7. Sustainable</text><text x="125" y="47" text-anchor="middle" font-size="19" font-weight="700">Transformation Pathways</text><text x="125" y="70" text-anchor="middle" font-size="14" class="ital">Pathways toward a desirable future</text><path d="M18 245C54 151 99 125 143 165S210 206 235 102" fill="url(#mesh)" stroke="var(--line)"/><path d="M44 230C75 206 96 194 120 174C143 156 166 146 199 118" fill="none" stroke="var(--ink)" stroke-width="2.4" marker-end="url(#a)"/><g fill="var(--ink)"><circle cx="44" cy="230" r="5"/><circle cx="92" cy="196" r="5"/><circle cx="137" cy="161" r="5"/><circle cx="199" cy="118" r="6"/></g><text x="16" y="264" font-size="14" class="math">Y₀</text><text x="205" y="108" font-size="15" class="math">Y*</text><text x="125" y="335" text-anchor="middle" font-size="17" class="math">arg min J(P)</text><text x="125" y="365" text-anchor="middle" font-size="14" class="ital">Trade-offs, uncertainty, robust pathways.</text></g>
</g>

<!-- bottom workflow -->
<line x1="24" y1="878" x2="1896" y2="878" stroke="var(--line)"/><text x="25" y="910" font-size="20" font-weight="700">From evidence to decision</text><g transform="translate(135 895)"><g font-size="14" text-anchor="middle"><g><rect width="180" height="82" rx="8" fill="var(--soft)" stroke="var(--line)"/><text x="90" y="28" font-weight="700">Evidence</text><text x="90" y="50" class="ital">data, observations</text></g><g transform="translate(205)"><rect width="180" height="82" rx="8" fill="var(--soft)" stroke="var(--line)"/><text x="90" y="28" font-weight="700">Definitions</text><text x="90" y="50" class="ital">variables, scope</text></g><g transform="translate(410)"><rect width="180" height="82" rx="8" fill="var(--soft)" stroke="var(--line)"/><text x="90" y="28" font-weight="700">Assumptions</text><text x="90" y="50" class="ital">boundaries, uncertainty</text></g><g transform="translate(615)"><rect width="180" height="82" rx="8" fill="var(--soft)" stroke="var(--line)"/><text x="90" y="28" font-weight="700">Model</text><text x="90" y="50" class="ital">structure, equations</text></g><g transform="translate(820)"><rect width="180" height="82" rx="8" fill="var(--soft)" stroke="var(--line)"/><text x="90" y="28" font-weight="700">Computation</text><text x="90" y="50" class="ital">simulation, optimization</text></g><g transform="translate(1025)"><rect width="180" height="82" rx="8" fill="var(--soft)" stroke="var(--line)"/><text x="90" y="28" font-weight="700">Verification</text><text x="90" y="50" class="ital">soundness, robustness</text></g><g transform="translate(1230)"><rect width="180" height="82" rx="8" fill="var(--soft)" stroke="var(--line)"/><text x="90" y="28" font-weight="700">Validation</text><text x="90" y="50" class="ital">real-world comparison</text></g><g transform="translate(1435)"><rect width="180" height="82" rx="8" fill="var(--soft)" stroke="var(--line)"/><text x="90" y="28" font-weight="700">Decision</text><text x="90" y="50" class="ital">policies, actions</text></g></g><g stroke="var(--ink)" marker-end="url(#a)"><line x1="180" y1="41" x2="205" y2="41"/><line x1="385" y1="41" x2="410" y2="41"/><line x1="590" y1="41" x2="615" y2="41"/><line x1="795" y1="41" x2="820" y2="41"/><line x1="1000" y1="41" x2="1025" y2="41"/><line x1="1205" y1="41" x2="1230" y2="41"/><line x1="1410" y1="41" x2="1435" y2="41"/></g></g>
<text x="960" y="1038" text-anchor="middle" font-size="15" class="caps">SYSTEMS × MATHEMATICS × DATA × HUMAN &amp; PLANETARY WELL-BEING</text><line x1="25" y1="1055" x2="1895" y2="1055" stroke="var(--line)"/>
