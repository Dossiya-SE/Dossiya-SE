<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc"><title id="title">Scientific computing stack by mathematical role</title><desc id="desc">Adaptive light and dark visual mapping symbolic, numerical, high-performance, formal, visualization, publishing and interactive tools to their mathematical roles.</desc><style>:root{--bg:#fff;--panel:#f8fafc;--fg:#0f172a;--muted:#475569;--border:#94a3b8;--source:#4338ca;--state:#1d4ed8;--viable:#047857;--unc:#b45309;--interface:#7e22ce;--decision:#a16207;--hazard:#b91c1c}@media(prefers-color-scheme:dark){:root{--bg:#07111f;--panel:#0e1d31;--fg:#eaf1f8;--muted:#9eb0c3;--border:#355a7b;--source:#a5b4fc;--state:#60a5fa;--viable:#34d399;--unc:#fbbf24;--interface:#c084fc;--decision:#facc15;--hazard:#fb7185}}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--border)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}text{font-family:Inter,Segoe UI,Arial,sans-serif}.math{font-family:Georgia,'Times New Roman',serif}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs><rect class="bg" width="1600" height="820" rx="28"/><text x="70" y="65" class="fg" font-size="38" font-weight="800">MATHEMATICS → ALGORITHMS → SOFTWARE → VERIFICATION → VISUALIZATION</text><text x="70" y="99" class="muted" font-size="17">tools are assigned scientific roles; software is not treated as the source of mathematical truth</text>
<g transform="translate(70 150)"><rect class="panel" width="300" height="210" rx="18"/><text x="24" y="40" class="fg" font-size="21" font-weight="700">Symbolic mathematics</text><text x="24" y="80" class="fg" font-size="17">SymPy · Mathematica · SageMath</text><text x="24" y="120" class="muted" font-size="14">exact differentiation</text><text x="24" y="146" class="muted" font-size="14">metric / Christoffel derivation</text><text x="24" y="172" class="muted" font-size="14">analytic simplification</text><rect x="0" y="0" width="7" height="210" fill="var(--source)" rx="4"/></g>
<g transform="translate(395 150)"><rect class="panel" width="300" height="210" rx="18"/><text x="24" y="40" class="fg" font-size="21" font-weight="700">Numerical mathematics</text><text x="24" y="80" class="fg" font-size="17">NumPy · SciPy · Julia · MATLAB</text><text x="24" y="120" class="muted" font-size="14">quadrature · interpolation</text><text x="24" y="146" class="muted" font-size="14">ODE/SDE solution · optimization</text><text x="24" y="172" class="muted" font-size="14">convergence / sensitivity</text><rect x="0" y="0" width="7" height="210" fill="var(--state)" rx="4"/></g>
<g transform="translate(720 150)"><rect class="panel" width="300" height="210" rx="18"/><text x="24" y="40" class="fg" font-size="21" font-weight="700">Manifold + HPC</text><text x="24" y="80" class="fg" font-size="17">Manifolds.jl · C++ · Rust · CUDA</text><text x="24" y="120" class="muted" font-size="14">Riemannian operations</text><text x="24" y="146" class="muted" font-size="14">large ensembles / kernels</text><text x="24" y="172" class="muted" font-size="14">GPU acceleration after profiling</text><rect x="0" y="0" width="7" height="210" fill="var(--viable)" rx="4"/></g>
<g transform="translate(1045 150)"><rect class="panel" width="300" height="210" rx="18"/><text x="24" y="40" class="fg" font-size="21" font-weight="700">Formal verification</text><text x="24" y="80" class="fg" font-size="17">Lean · mathlib · Coq</text><text x="24" y="120" class="muted" font-size="14">machine-checked theorem proof</text><text x="24" y="146" class="muted" font-size="14">stable identities / definitions</text><text x="24" y="172" class="muted" font-size="14">proof ≠ empirical validation</text><rect x="0" y="0" width="7" height="210" fill="var(--interface)" rx="4"/></g>
<g transform="translate(1370 150)"><rect class="panel" width="160" height="210" rx="18"/><text x="20" y="40" class="fg" font-size="19" font-weight="700">CI</text><text x="20" y="80" class="fg" font-size="15">GitHub Actions</text><text x="20" y="120" class="muted" font-size="13">tests</text><text x="20" y="146" class="muted" font-size="13">hashes</text><text x="20" y="172" class="muted" font-size="13">fail-closed</text><rect x="0" y="0" width="7" height="210" fill="var(--hazard)" rx="4"/></g>
<g transform="translate(70 405)"><rect class="panel" width="450" height="245" rx="18"/><text x="24" y="42" class="fg" font-size="21" font-weight="700">Scientific geometry + rendering</text><text x="24" y="83" class="fg" font-size="17">PyVista / VTK · Makie · Blender · GLSL</text><text x="24" y="124" class="muted" font-size="14">mesh / scalar / vector fields</text><text x="24" y="150" class="muted" font-size="14">curvature-colored surfaces only when color encodes a declared field</text><text x="24" y="176" class="muted" font-size="14">Blender/GLSL are rendering layers after scientific verification</text><text x="24" y="212" class="fg math" font-size="18">verified geometry → render, not render → assumed geometry</text></g>
<g transform="translate(545 405)"><rect class="panel" width="450" height="245" rx="18"/><text x="24" y="42" class="fg" font-size="21" font-weight="700">Publication + mathematical art</text><text x="24" y="83" class="fg" font-size="17">LaTeX · TikZ/PGFPlots · Asymptote · Manim</text><text x="24" y="124" class="muted" font-size="14">native equations · vector typography</text><text x="24" y="150" class="muted" font-size="14">coordinate-driven technical geometry</text><text x="24" y="176" class="muted" font-size="14">animation of geodesics / moving frames / derivations</text><text x="24" y="212" class="fg math" font-size="18">SVG + PDF + PNG + animation exports</text></g>
<g transform="translate(1020 405)"><rect class="panel" width="510" height="245" rx="18"/><text x="24" y="42" class="fg" font-size="21" font-weight="700">Interactive scientific web</text><text x="24" y="83" class="fg" font-size="17">MathJax · D3 · Three.js · WebGL</text><text x="24" y="124" class="muted" font-size="14">live equations · interactive state spaces · manifolds</text><text x="24" y="150" class="muted" font-size="14">browser interaction is presentation unless backed by verified computation</text><text x="24" y="192" class="fg math" font-size="18">specification → compute → prove/check → visualize → publish</text></g>
<text x="70" y="720" class="muted" font-size="14">dual provenance: mathematical source citation + software/version citation for computational results</text><text x="70" y="755" class="muted" font-size="14">independent reproduction requires genuinely independent formulations, not merely two wrappers around the same underlying library</text></svg>