    <text x="92" y="330" text-anchor="middle" class="brand sans" font-size="15" font-weight="700">2016</text>
    <text x="92" y="351" text-anchor="middle" class="ink sans" font-size="14">Electrical systems</text>

    <text x="232" y="319" text-anchor="middle" class="ink sans" font-size="14">Energy systems</text>
    <text x="390" y="319" text-anchor="middle" class="ink sans" font-size="14">Sustainable engineering</text>
    <text x="556" y="289" text-anchor="middle" class="ink sans" font-size="14">Financial engineering</text>

    <text x="726" y="310" text-anchor="middle" class="brand sans" font-size="15" font-weight="700">2026 →</text>
    <text x="726" y="331" text-anchor="middle" class="ink sans" font-size="14">Deeper mathematics</text>

    <text x="430" y="398" text-anchor="middle" class="ink math" font-size="20">physical systems → state → dynamics → uncertainty → geometry → viability → decision</text>
    <text x="430" y="430" text-anchor="middle" class="muted sans" font-size="15">discrete &amp; differential geometry · dynamical systems · networks · scientific computing · mathematical visualization</text>
  </g>

