    <text x="430" y="136" text-anchor="middle" class="brand sans" font-size="18" font-weight="650" letter-spacing="3.3">ENGINEERING · MATHEMATICS · SUSTAINABLE RESILIENCE</text>

    <text x="430" y="183" text-anchor="middle" class="ink math" font-size="22">γ : [2016, 2026] → 𝓜</text>
    <text x="430" y="208" text-anchor="middle" class="muted sans" font-size="14" letter-spacing="1.1">A DECADE OF TECHNICAL DEVELOPMENT → A DEEPER MATHEMATICAL RESEARCH DIRECTION</text>

