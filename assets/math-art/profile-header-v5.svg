    <text x="16" y="356" class="ink math" font-size="21">ẋ = Ax + Bu</text>
    <text x="16" y="386" class="muted sans" font-size="15">electrical systems · control · implementation</text>
  </g>

  <g transform="translate(410 70)">
    <text x="430" y="78" text-anchor="middle" class="ink math" font-size="78" font-weight="700">Dossiya Dakou</text>
