<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 640" width="2048" height="640" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Dossiya Dakou — Mathematical Systems Engineering for Sustainable Resilience</title>
  <desc id="desc">White-canvas mathematical research identity integrating multilayer infrastructure, a canonical interdependency object, viability geometry, synthetic nonlinear dynamics and manifold geometry. Synthetic curves are illustrative mathematical visualizations, not empirical observations.</desc>
  <metadata>Native editable SVG; no embedded raster. Conceptual mathematical research identity. Semantic profile tokens: MATHEMATICAL SYSTEMS ENGINEERING | SUSTAINABILITY · RESILIENCE · OPTIMIZATION.</metadata>

  <defs>
    <style>
      :root{--bg:#ffffff;--ink:#111318;--muted:#5f6670;--hair:#d9dde2;--soft:#f7f7f5;--accent:#b58a37;--accent-soft:#f2ead8;--mesh:#cfd4da}
      @media(prefers-color-scheme:dark){:root{--bg:#ffffff;--ink:#111318;--muted:#5f6670;--hair:#d9dde2;--soft:#f7f7f5;--accent:#b58a37;--accent-soft:#f2ead8;--mesh:#cfd4da}}
      text{font-family:Georgia,'Times New Roman',serif;fill:var(--ink)}
      .sans{font-family:Inter,'Segoe UI',Arial,sans-serif}
      .math{font-family:'STIX Two Math','Cambria Math',Georgia,serif}
      .ital{font-style:italic}
      .caps{letter-spacing:2.2px}
      .section{font-size:19px;font-weight:700}
      .label{font-size:16px;font-weight:600}
      .note{font-size:15px;fill:var(--muted)}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--ink)"/></marker>
    <marker id="goldArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--accent)"/></marker>
    <linearGradient id="surfaceFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfbfa"/><stop offset="1" stop-color="#efefec"/></linearGradient>
    <clipPath id="surfaceClip"><path d="M0 104C68 42 140 34 214 88C278 135 354 142 432 85C507 31 590 43 676 108L676 198C589 159 512 164 438 207C354 257 276 251 204 211C130 170 64 173 0 221Z"/></clipPath>
  </defs>

