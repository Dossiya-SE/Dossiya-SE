  <g transform="translate(1370 378)">
    <text x="0" y="0" class="ink math" font-size="18">gᵢⱼ = ⟨∂ᵢr, ∂ⱼr⟩</text>
    <text x="0" y="28" class="ink math" font-size="18">L = D − A</text>
