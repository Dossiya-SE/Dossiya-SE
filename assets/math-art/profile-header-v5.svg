    <text x="399" y="83" text-anchor="middle" font-size="28" class="math">𝕀ᵅᵝᵢⱼ = (Eᵅᵢ, Eᵝⱼ, Mᵢⱼ, wᵢⱼ, δᵢⱼ, τᵢⱼ, aᵢⱼ, m, ℋₜ)</text>
