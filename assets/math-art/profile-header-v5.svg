0 539, 1860 752, 2010 650 S 2250 570, 2400 675" stroke="#a8d8b4" stroke-width="1.3" fill="none" opacity="0.6"/><path d="M 1600 680 C 1750 556, 1860 768, 2010 670 S 2250 590, 2400 695" stroke="#a8d8b4" stroke-width="1.3" fill="none" opacity="0.6"/><text x="1200" y="230" fill="#0b2114" font-family="STIX Two Math,Cambria Math,Georgia,'Times New Roman',serif" font-size="84" font-weight="700" text-anchor="middle" letter-spacing="0" font-style="normal">Dossiya Dakou</text><text x="1200" y="290" fill="#176a38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="4" font-style="normal">MATHEMATICS  ·  PHYSICS  ·  COMPUTATION  ·  SUSTAINABILITY  ·  FINANCE</text><text x="1200" y="365" fill="#0b2114" font-family="STIX Two Math,Cambria Math,Georgia,'Times New Roman',serif" font-size="28" font-weight="500" text-anchor="middle" letter-spacing="0" font-style="normal">From physical systems to mathematical structures,</text><text x="1200" y="405" fill="#0b2114" font-family="STIX Two Math,Cambria Math,Georgia,'Times New Roman',serif" font-size="28" font-weight="500" text-anchor="middle" letter-spacing="0" font-style="normal">from engineering practice to scientific understanding,</text><text x="1200" y="445" fill="#0b2114" font-family="STIX Two Math,Cambria Math,Georgia,'Times New Roman',serif" font-size="28" font-weight="500" text-anchor="middle" letter-spacing="0" font-style="normal">toward rigorous frameworks for sustainable and resilient systems.</text><line x1="840" y1="485" x2="1560" y2="485" stroke="#a8d8b4" stroke-width="2" opacity="1"/><text x="1200" y="530" fill="#176a38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" text-anchor="middle" letter-spacing="5" font-style="normal">RIGOR  ·  STRUCTURE  ·  ELEGANCE  ·  IMPACT</text><text x="70" y="110" fill="#0b2114" font-family="STIX Two Math,Cambria Math,Georgia,'Times New Roman',serif" font-size="24" font-weight="500" text-anchor="start" letter-spacing="0" font-style="normal">ds² = gᵢⱼ(x) dxⁱdxʲ</text><text x="70" y="155" fill="#176a38" font-family="STIX Two Math,Cambria Math,Georgia,'Times New Roman',serif" font-size="24" font-weight="500" text-anchor="start" letter-spacing="0" font-style="normal">∇ · E = ρ / ε₀</text><text x="70" y="200" fill="#176a38" font-family="STIX Two Math,Cambria Math,Georgia,'Times New Roman',serif" font-size="24" font-weight="500" text-anchor="start" letter-spacing="0" font-style="normal">∇ × B = μ₀J + μ₀ε₀ ∂E/∂t</text><text x="930" y="95" fill="#176a38" font-family="STIX Two Math,Cambria Math,Georgia,'Times New Roman',serif" font-size="24" font-weight="500" text-anchor="start" letter-spacing="0" font-style="normal">i d|ψ(t)⟩/dt = H|ψ(t)⟩</text><text x="1860" y="520" fill="#176a38" font-family="STIX Two Math,Cambria Math,Georgia,'Times New Roman',serif" font-size="23" font-weight="500" text-anchor="start" letter-spacing="0" font-style="normal">K = det(II) / det(I)</text><text x="1840" y="560" fill="#0b2114" font-family="STIX Two Math,Cambria Math,Georgia,'Times New Roman',serif" font-size="23" font-weight="500" text-anchor="start" letter-spacing="0" font-style="normal">dXₜ = b(Xₜ,t)dt + σ(Xₜ,t)dWₜ</text><circle cx="290" cy="710" r="28" fill="#f3fbf5" stroke="#6fbd83" stroke-width="2" opacity="1"/><text x="335" y="700" fill="#176a38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800" text-anchor="start" letter-spacing="0" font-style="normal">MATHEMATICAL THINKING</text><text x="335" y="730" fill="#496355" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" text-anchor="start" letter-spacing="0" font-style="normal">Structure · Abstraction · Proof</text><circle cx="745" cy="710" r="28" fill="#f3fbf5" stroke="#6fbd83" stroke-width="2" opacity="1"/><text x="790" y="700" fill="#176a38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800" text-anchor="start" letter-spacing="0" font-style="normal">SCIENTIFIC COMPUTING</text><text x="790" y="730" fill="#496355" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" text-anchor="start" letter-spacing="0" font-style="normal">Python · Julia · MATLAB</text><circle cx="1200" cy="710" r="28" fill="#f3fbf5" stroke="#6fbd83" stroke-width="2" opacity="1"/><text x="1245" y="700" fill="#176a38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800" text-anchor="start" letter-spacing="0" font-style="normal">SYSTEMS PERSPECTIVE</text><text x="1245" y="730" fill="#496355" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" text-anchor="start" letter-spacing="0" font-style="normal">Networks · Dynamics · Control</text><circle cx="1655" cy="710" r="28" fill="#f3fbf5" stroke="#6fbd83" stroke-width="2" opacity="1"/><text x="1700" y="700" fill="#176a38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800" text-anchor="start" letter-spacing="0" font-style="normal">SUSTAINABILITY FOCUS</text><text x="1700" y="730" fill="#496355" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" text-anchor="start" letter-spacing="0" font-style="normal">People · Planet · Prosperity</text><circle cx="2110" cy="710" r="28" fill="#f3fbf5" stroke="#6fbd83" stroke-width="2" opacity="1"/><text x="2155" y="700" fill="#176a38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800" text-anchor="start" letter-spacing="0" font-style="normal">CURIOSITY &amp; RIGOR</text><text x="2155" y="730" fill="#496355" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" text-anchor="start" letter-spacing="0" font-style="normal">Ask Deeper · Think Critically</text></svg>