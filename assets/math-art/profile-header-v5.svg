<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 640" width="2048" height="640" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
<title id="title">Dossiya Dakou — Mathematical Systems Engineering</title>
<desc id="desc">A native vector profile header combining a restrained mathematical systems identity with a state-space trajectory, network interfaces, vector-field arrows and geometric resilience notation.</desc>
<metadata>Native editable SVG. No embedded raster image. Mathematical objects are illustrative profile identity elements, not empirical results.</metadata>
<defs>
  <style>
    .bg{fill:#F7F9F7}
    .panel{fill:#FFFFFF;stroke:#D9E4DC}
    .ink{fill:#101713}
    .muted{fill:#55635B}
    .green-fill{fill:#176A38}
    .green2-fill{fill:#2F8F50}
    .gold-fill{fill:#B8872C}
    .line{stroke:#D9E4DC}
    .green-stroke{stroke:#176A38}
    .green2-stroke{stroke:#2F8F50}
    .gold-stroke{stroke:#B8872C}
    text{font-family:Inter,Segoe UI,Arial,sans-serif}
    .math{font-family:"STIX Two Math","Cambria Math",Georgia,serif}
    @media(prefers-color-scheme:dark){
      .bg{fill:#07100B}
      .panel{fill:#0B1710;stroke:#1D3929}
      .ink{fill:#F1F7F3}
      .muted{fill:#A8B8AF}
      .green-fill{fill:#78D397}
      .green2-fill{fill:#4FBA73}
      .gold-fill{fill:#E1B75D}
      .line{stroke:#1D3929}
      .green-stroke{stroke:#78D397}
      .green2-stroke{stroke:#4FBA73}
      .gold-stroke{stroke:#E1B75D}
    }
  </style>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
    <path d="M0 0L9 4.5L0 9Z" class="green-fill"/>
  </marker>
</defs>

<rect width="2048" height="640" class="bg"/>
<rect x="52" y="52" width="1944" height="536" rx="28" class="panel" stroke-width="2"/>

<g transform="translate(118 0)">
  <text x="0" y="176" class="gold-fill" font-size="18" font-weight="800" letter-spacing="4">RESEARCH · ENGINEERING · MATHEMATICS</text>
  <text x="0" y="250" class="ink" font-size="68" font-weight="800" letter-spacing="1">Dossiya Dakou</text>
  <text x="0" y="303" class="green-fill" font-size="29" font-weight="800" letter-spacing="1.4">MATHEMATICAL SYSTEMS ENGINEERING</text>
  <text x="0" y="347" class="muted" font-size="24" font-weight="600">SUSTAINABILITY · RESILIENCE · OPTIMIZATION</text>

  <line x1="0" y1="392" x2="760" y2="392" class="line" stroke-width="2"/>

  <text x="0" y="438" class="ink math" font-size="25">ẋ = f(x,u,η)</text>
  <text x="205" y="438" class="muted" font-size="21">→</text>
  <text x="247" y="438" class="ink math" font-size="25">V ⊂ K</text>
  <text x="365" y="438" class="muted" font-size="21">→</text>
  <text x="407" y="438" class="ink math" font-size="25">ρ(x)=d(x,∂V)</text>

  <text x="0" y="493" class="muted" font-size="19" font-weight="650" letter-spacing=".6">EVIDENCE → MODEL → COMPUTE → VERIFY → VALIDATE → DECIDE</text>
</g>

