<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 330" role="img" aria-labelledby="title desc">
<title id="title">Current research question</title>
<desc id="desc">Research question for coupled Power and Transportation systems. Light yellow identifies the causal interface question and green identifies the viable-state objective. The visual is explanatory, not empirical evidence.</desc>
<style>
:root{--bg:#FBFAF6;--panel:#FFFFFF;--ink:#1F2328;--muted:#59636E;--line:#D1D9E0;--topology:#24292F;--green:#1A7F37;--green-soft:#DAFBE1;--red:#CF222E;--red-soft:#FFEBE9;--yellow:#9A6700;--yellow-soft:#FFF8C5;--yellow-ink:#6A4B00;--ghost:#F6F8FA}
@media(prefers-color-scheme:dark){:root{--bg:#0D1117;--panel:#161B22;--ink:#F0F6FC;--muted:#8B949E;--line:#30363D;--topology:#C9D1D9;--green:#3FB950;--green-soft:#1B4721;--red:#F85149;--red-soft:#3D1A1D;--yellow:#DDBA55;--yellow-soft:#3A3218;--yellow-ink:#F2CC60;--ghost:#21262D}}
text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink)}
.math{font-family:Georgia,"STIX Two Text","Times New Roman",serif}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;fill:var(--muted)}
.title{font-size:31px;font-weight:800;letter-spacing:-.02em}
.h{font-size:20px;font-weight:760} .m{font-size:14px;fill:var(--muted)} .s{font-size:11px;fill:var(--muted)}
.value{font-size:18px;font-weight:720} .math-lg{font-family:Georgia,"STIX Two Text","Times New Roman",serif;font-size:25px}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.flow-yellow{fill:none;stroke:var(--yellow);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:9 11;animation:flow 3.2s linear infinite}
.flow-green{fill:none;stroke:var(--green);stroke-width:3;stroke-linecap:round;stroke-dasharray:10 12;animation:flow 3.8s linear infinite}
.pulse-green{animation:pulse 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.latest{animation:latest 3.4s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-42}}
@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
@keyframes latest{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
@media(prefers-reduced-motion:reduce){.flow-yellow,.flow-green,.pulse-green,.latest{animation:none!important}}
</style>
<rect x="1" y="1" width="1398" height="328" rx="28" fill="var(--bg)" stroke="var(--line)"/>
<text x="48" y="49" class="eyebrow">RESEARCH QUESTION · CURRENT</text>
<text x="48" y="94" class="title">How do physically supported infrastructure interfaces generate coupled dynamics?</text>
<rect x="48" y="124" width="392" height="46" rx="12" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.5"/>
<text x="68" y="153" class="h" fill="var(--yellow-ink)">Power ↔ Transportation interfaces</text>
<path d="M458 147H590" class="flow-yellow"/>
<text x="612" y="142" class="value">disturbance + control</text>
<text x="612" y="165" class="m">time-dependent cross-system state evolution</text>
<path d="M940 147H1040" stroke="var(--line)" stroke-width="2"/>
<path d="M1026 137L1040 147L1026 157" fill="none" stroke="var(--line)" stroke-width="2"/>
<rect x="1062" y="116" width="290" height="64" rx="14" fill="var(--panel)" stroke="var(--green)" stroke-width="2"/>
<circle cx="1087" cy="148" r="7" fill="var(--green)" class="pulse-green"/>
<text x="1106" y="143" class="m">viability objective</text>
<text x="1106" y="166" class="math" font-size="19" fill="var(--green)">Y(t) ∈ 𝒱ₛᵤₛ(t)</text>
<line x1="48" y1="211" x2="1352" y2="211" stroke="var(--line)"/>
<text x="48" y="252" class="m">Engineering interpretation</text>
<text x="48" y="282" class="value">Identify mechanisms → formalize coupled dynamics → quantify distance to critical boundaries → design admissible intervention.</text>
<text x="1352" y="308" text-anchor="end" class="s">Question structure is declared research scope; it is not a validated causal law.</text>
</svg>
