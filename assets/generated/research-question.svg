<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc"><title id="title">Research question as minimal geometric logic</title><desc id="desc">Minimal mathematical reasoning diagram from the coupled physical system through a causal interface and coupled dynamics to the viability objective.</desc><style>
:root{--bg:#FFFFFF;--panel:#FFFFFF;--ink:#1E2933;--muted:#59636E;--line:#E0E5EA;--topology:#2B333D;--green:#16823A;--green-soft:#EAF5EE;--red:#CF222E;--red-soft:#FDEBEC;--yellow:#007A88;--yellow-soft:#E6F6F8;--yellow-ink:#00616C;--ghost:#F7F9FA;--power:#C8102E;--power-soft:#FBEAEC;--transport:#16823A;--transport-soft:#EAF5EE;--information:#1D4ED8;--information-soft:#E8EEFD;--organization:#A21CAF;--organization-ink:#86198F;--organization-soft:#F8E8FB;--cyan:#007A88;--cyan-soft:#E6F6F8;--violet:#6D28D9;--violet-soft:#F0EAFE;--magenta:#A21CAF;--magenta-soft:#F8E8FB;--gold:#007A88;--gold-soft:#E6F6F8}
@media(prefers-color-scheme:dark){:root{--bg:#0D1117;--panel:#161B22;--ink:#F0F6FC;--muted:#9DA7B3;--line:#30363D;--topology:#C9D1D9;--green:#56D364;--green-soft:#172D1D;--red:#FF7B72;--red-soft:#3D1A1D;--yellow:#39C5CF;--yellow-soft:#123236;--yellow-ink:#7DE8EE;--ghost:#21262D;--power:#FF7B82;--power-soft:#3D1C22;--transport:#56D364;--transport-soft:#172D1D;--information:#58A6FF;--information-soft:#14253D;--organization:#DB61A2;--organization-ink:#F0A7CE;--organization-soft:#3C1B31;--cyan:#39C5CF;--cyan-soft:#123236;--violet:#A371F7;--violet-soft:#271B3D;--magenta:#DB61A2;--magenta-soft:#3C1B31;--gold:#39C5CF;--gold-soft:#123236}}
text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink)}
.math{font-family:"DejaVu Serif","Liberation Serif",Georgia,serif}
.title{font-size:38px;font-weight:820;letter-spacing:-.02em}
.h2{font-size:26px;font-weight:780}
.label{font-size:20px;font-weight:720}
.small{font-size:18px;fill:var(--muted)}
.micro{font-size:16px;fill:var(--muted);letter-spacing:.08em}
.project-name{font-size:18px;font-weight:720}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.plane{fill:var(--ghost);stroke:var(--line);stroke-width:1.4}
.power{fill:none;stroke:var(--power);stroke-width:3}
.transport{fill:none;stroke:var(--transport);stroke-width:3}
.info{fill:none;stroke:var(--information);stroke-width:2;stroke-dasharray:8 7}
.org{fill:none;stroke:var(--organization);stroke-width:2;stroke-dasharray:2 6}
.model{fill:none;stroke:var(--violet);stroke-width:2.4}
.viable{fill:var(--green-soft);stroke:var(--green);stroke-width:2.4}
.critical{fill:none;stroke:var(--red);stroke-width:3.2;stroke-dasharray:10 8}
.control{fill:none;stroke:var(--gold);stroke-width:3.2;stroke-dasharray:8 6}
.state{fill:var(--cyan);stroke:var(--panel);stroke-width:2}
.node{fill:var(--panel);stroke-width:2.4}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<rect x="1" y="1" width="1598" height="418" rx="18" fill="var(--bg)" stroke="var(--line)"/>
<text x="48" y="58" class="micro">RESEARCH QUESTION · MINIMAL GEOMETRIC LOGIC</text>
<text x="175" y="114" text-anchor="middle" class="label">PHYSICAL SYSTEM</text>
<polygon points="175.0,148.0 237.4,256.0 112.6,256.0" fill="var(--power-soft)" stroke="var(--power)" stroke-width="3"/>
<text x="175" y="227" text-anchor="middle" class="math h2">P ↔ T</text>
<text x="175" y="338" text-anchor="middle" class="small">Power ↔ Transportation</text>
<text x="515" y="114" text-anchor="middle" class="label">CAUSAL INTERFACE</text>
<polygon points="515.0,148.0 577.4,184.0 577.4,256.0 515.0,292.0 452.6,256.0 452.6,184.0" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="3"/>
<text x="515" y="227" text-anchor="middle" class="math h2">C₁</text>
<text x="515" y="338" text-anchor="middle" class="small">typed coupling</text>
<text x="860" y="114" text-anchor="middle" class="label">DYNAMICS</text>
<polygon points="860.0,148.0 928.5,197.8 902.3,278.2 817.7,278.2 791.5,197.8" fill="var(--information-soft)" stroke="var(--information)" stroke-width="3"/>
<text x="860" y="227" text-anchor="middle" class="math h2">F_G</text>
<text x="860" y="338" text-anchor="middle" class="small">coupled hybrid dynamics</text>
<text x="1240" y="114" text-anchor="middle" class="label">VIABILITY</text>
<ellipse cx="1240" cy="220" rx="125" ry="76" class="viable"/>
<text x="1240" y="227" text-anchor="middle" class="math h2">V</text>
<text x="1240" y="338" text-anchor="middle" class="small">Y(t) ∈ V · maximize ρ₂</text>
<path d="M270.0 220.0L410.0 220.0M400.6 225.7L410.0 220.0L400.6 214.3" class="control"/>
<path d="M610.0 220.0L755.0 220.0M745.6 225.7L755.0 220.0L745.6 214.3" class="control"/>
<path d="M955.0 220.0L1135.0 220.0M1125.6 225.7L1135.0 220.0L1125.6 214.3" class="control"/>
<text x="48" y="390" class="small">Which physically defensible interfaces generate dynamics that can be controlled away from critical boundaries?</text>
</svg>
