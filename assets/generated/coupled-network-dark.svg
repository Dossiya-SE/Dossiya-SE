<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
<title id="title">Coupled Power–Transportation network geometry</title>
<desc id="desc">Data-driven multilayer network figure. Power and transportation remain separate typed layers; shared charging interface C1 carries bidirectional causal mechanisms. Green motion denotes admissible service flow, red transient overlays illustrate a declared disturbance/propagation scenario, and the Light Sky Blue accent family denotes the causal interface and control path. Animation is explanatory, not measured infrastructure telemetry.</desc>
<style>
:root{--bg:#0D1117;--panel:#161B22;--ink:#F0F6FC;--muted:#9DA7B3;--line:#30363D;--topology:#C9D1D9;--green:#56D364;--green-soft:#172D1D;--red:#FF7B72;--red-soft:#3D1A1D;--control:#87CEFA;--control-soft:#142A3A;--control-ink:#BFE8FF;--ghost:#21262D;--power:#FF7B82;--power-soft:#3D1C22;--transport:#56D364;--transport-soft:#172D1D;--information:#58A6FF;--information-soft:#14253D;--organization:#E879F9;--organization-ink:#F5C2FF;--organization-soft:#371B3D;--cyan:#22D3EE;--cyan-soft:#123138;--violet:#A371F7;--violet-soft:#271B3D;--magenta:#F472B6;--magenta-soft:#3C1B31}

text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink)}
.math{font-family:Georgia,"STIX Two Text","Times New Roman",serif}
.title{font-size:34px;font-weight:820;letter-spacing:-.02em}
.h{font-size:23px;font-weight:780} .k{font-size:12px;font-weight:800;letter-spacing:.13em}
.m{font-size:14px;fill:var(--muted)} .s{font-size:11px;fill:var(--muted)} .node-label{font-size:13px;font-weight:760}
.edge{fill:none;stroke:var(--topology);stroke-width:2.2;stroke-linecap:round;opacity:1}
.edge-soft{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-linecap:round;opacity:1;stroke-dasharray:5 6}
.flow{fill:none;stroke:var(--green);stroke-width:3;stroke-linecap:round;stroke-dasharray:10 12;animation:serviceFlow 3.3s linear infinite}
.interface-flow{fill:none;stroke:var(--control);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:9 11;animation:interfaceFlow 2.8s linear infinite}
.critical-demo{opacity:0;fill:none;stroke:var(--red);stroke-width:4;stroke-linecap:round;stroke-dasharray:8 8;animation:criticalPhase 20s linear infinite}
.propagation-demo{opacity:0;fill:none;stroke:var(--red);stroke-width:4;stroke-linecap:round;stroke-dasharray:7 9;animation:propagationPhase 20s linear infinite}
.control-demo{opacity:0;fill:none;stroke:var(--control);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:9 9;animation:controlPhase 20s linear infinite}
.recovery-demo{opacity:0;fill:none;stroke:var(--green);stroke-width:3;stroke-linecap:round;stroke-dasharray:10 10;animation:recoveryPhase 20s linear infinite}
.critical-node{opacity:0;fill:var(--red);animation:criticalPhase 20s linear infinite}
.control-node{opacity:0;fill:var(--control);animation:controlPhase 20s linear infinite}
@keyframes serviceFlow{to{stroke-dashoffset:-44}} @keyframes interfaceFlow{to{stroke-dashoffset:-40}}
@keyframes criticalPhase{0%,19%,60%,100%{opacity:0}22%,55%{opacity:1}}
@keyframes propagationPhase{0%,36%,60%,100%{opacity:0}40%,56%{opacity:1}}
@keyframes controlPhase{0%,56%,81%,100%{opacity:0}61%,76%{opacity:1}}
@keyframes recoveryPhase{0%,76%,100%{opacity:0}81%,96%{opacity:1}}
@media(prefers-reduced-motion:reduce){.flow,.interface-flow,.critical-demo,.propagation-demo,.control-demo,.recovery-demo,.critical-node,.control-node{animation:none!important}.critical-demo,.propagation-demo,.control-demo,.recovery-demo,.critical-node,.control-node{opacity:0!important}}
</style>
<rect x="1" y="1" width="1598" height="758" rx="30" fill="var(--bg)" stroke="var(--line)"/>
<text x="52" y="58" class="title">Coupled Power–Transportation Network Geometry</text>
<text x="52" y="88" class="m">topology first · typed nodes and edges · explicit shared interface · explanatory dynamics</text>
<text x="1548" y="58" text-anchor="end" class="k" fill="var(--green)">PHYSICS-GROUNDED SUSTAINABLE ENGINEERING</text>
<rect x="52" y="125" width="1000" height="250" rx="22" fill="var(--panel)" stroke="var(--line)" stroke-width="1.2"/>
<rect x="52" y="430" width="1000" height="250" rx="22" fill="var(--panel)" stroke="var(--line)" stroke-width="1.2"/>
