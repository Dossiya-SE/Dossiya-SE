<text x="76" y="181" class="s">𝓖<tspan baseline-shift="sub" font-size="9">P</tspan>=(V<tspan baseline-shift="sub" font-size="9">P</tspan>,E<tspan baseline-shift="sub" font-size="9">P</tspan>) · generation → substations → interface / loads</text>
<text x="76" y="464" class="h" fill="var(--ink)">TRANSPORTATION NETWORK 𝓖<tspan baseline-shift="sub" font-size="13">T</tspan></text>
<text x="76" y="486" class="s">𝓖<tspan baseline-shift="sub" font-size="9">T</tspan>=(V<tspan baseline-shift="sub" font-size="9">T</tspan>,E<tspan baseline-shift="sub" font-size="9">T</tspan>) · origins → intersections → shared interface / hub → terminals</text>
