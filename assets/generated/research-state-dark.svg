<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc"><title id="title">Current research state as SVD-projected conceptual state space</title><desc id="desc">Five explicitly conceptual four-dimensional research-state vectors projected by SVD into two dimensions. The highlighted transition is mechanism to dynamics; coordinates are not empirical measurements.</desc><style>
:root{--bg:#0D1117;--panel:#161B22;--ink:#F0F6FC;--muted:#9DA7B3;--line:#30363D;--topology:#C9D1D9;--green:#56D364;--green-soft:#172D1D;--red:#FF7B72;--red-soft:#3D1A1D;--yellow:#39C5CF;--yellow-soft:#123236;--yellow-ink:#7DE8EE;--ghost:#21262D;--power:#FF7B82;--power-soft:#3D1C22;--transport:#56D364;--transport-soft:#172D1D;--information:#58A6FF;--information-soft:#14253D;--organization:#DB61A2;--organization-ink:#F0A7CE;--organization-soft:#3C1B31;--cyan:#39C5CF;--cyan-soft:#123236;--violet:#A371F7;--violet-soft:#271B3D;--magenta:#DB61A2;--magenta-soft:#3C1B31;--gold:#39C5CF;--gold-soft:#123236}

text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink)}
.math{font-family:"DejaVu Serif","Liberation Serif",Georgia,serif}
.title{font-size:38px;font-weight:820;letter-spacing:-.02em}
.h2{font-size:26px;font-weight:780}
.label{font-size:20px;font-weight:720}
.small{font-size:18px;fill:var(--muted)}
.micro{font-size:16px;fill:var(--muted);letter-spacing:.08em}
.project-name{font-size:18px;font-weight:720}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.plane{fill:var(--ghost);stroke:var(--line);stroke-width:1.4}
.power{fill:none;stroke:var(--power);stroke-width:3}
.transport{fill:none;stroke:var(--transport);stroke-width:3}
.info{fill:none;stroke:var(--information);stroke-width:2;stroke-dasharray:8 7}
.org{fill:none;stroke:var(--organization);stroke-width:2;stroke-dasharray:2 6}
.model{fill:none;stroke:var(--violet);stroke-width:2.4}
.viable{fill:var(--green-soft);stroke:var(--green);stroke-width:2.4}
.critical{fill:none;stroke:var(--red);stroke-width:3.2;stroke-dasharray:10 8}
.control{fill:none;stroke:var(--gold);stroke-width:3.2;stroke-dasharray:8 6}
.state{fill:var(--cyan);stroke:var(--panel);stroke-width:2}
.node{fill:var(--panel);stroke-width:2.4}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<rect x="1" y="1" width="1598" height="498" rx="18" fill="var(--bg)" stroke="var(--line)"/>
<text x="48" y="56" class="micro">CURRENT RESEARCH STATE · SVD PROJECTION OF CONCEPTUAL 4D STATE</text>
<line x1="120" y1="400" x2="1490" y2="400" stroke="var(--line)"/>
<line x1="120" y1="100" x2="120" y2="420" stroke="var(--line)"/>
<text x="1490" y="425" text-anchor="end" class="small">component 1</text>
<text x="92" y="112" class="small">component 2</text>
<path d="M515.0 152.4L679.3 315.7" class="model"/>
<path d="M679.3 315.7L881.6 348.8" class="model"/>
<path d="M881.6 348.8L1015.2 252.7" class="model"/>
<path d="M1015.2 252.7L1100.0 151.2" class="model"/>
<polygon points="515.0,134.4 530.6,143.4 530.6,161.4 515.0,170.4 499.4,161.4 499.4,143.4" fill="var(--violet-soft)" stroke="var(--violet)" stroke-width="3"/>
<text x="515.0" y="118.4" text-anchor="middle" class="label">STRUCTURE</text>
<polygon points="679.3,291.7 700.1,303.7 700.1,327.7 679.3,339.7 658.5,327.7 658.5,303.7" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="3"/>
<text x="679.3" y="281.7" text-anchor="middle" class="label">MECHANISM</text>
<polygon points="881.6,324.8 904.4,341.4 895.7,368.2 867.5,368.2 858.8,341.4" fill="var(--information-soft)" stroke="var(--information)" stroke-width="3"/>
<text x="881.6" y="314.8" text-anchor="middle" class="label">DYNAMICS</text>
<polygon points="1015.2,234.7 1030.8,243.7 1030.8,261.7 1015.2,270.7 999.6,261.7 999.6,243.7" fill="var(--violet-soft)" stroke="var(--violet)" stroke-width="3"/>
<text x="1015.2" y="218.7" text-anchor="middle" class="label">CONTROL</text>
<polygon points="1100.0,133.2 1115.6,142.2 1115.6,160.2 1100.0,169.2 1084.4,160.2 1084.4,142.2" fill="var(--violet-soft)" stroke="var(--violet)" stroke-width="3"/>
<text x="1100.0" y="117.2" text-anchor="middle" class="label">VIABILITY</text>
<path d="M679.3 315.7L881.6 348.8M871.4 353.0L881.6 348.8L873.3 341.6" class="control"/>
<text x="48" y="452" class="small">Conceptual normalized state r=(r_s,r_c,r_d,r_v); SVD projection only.</text>
<text x="48" y="478" class="small">First two components explain 97.7% of configured conceptual variance; coordinates are not empirical measurements.</text>
</svg>
