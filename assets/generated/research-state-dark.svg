<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc"><title id="title">Current research state as SVD-projected conceptual state space</title><desc id="desc">Five explicitly conceptual four-dimensional research-state vectors projected by SVD into two dimensions. The highlighted transition is mechanism to dynamics; coordinates are not empirical measurements.</desc><style>
:root{--bg:#0D1117;--panel:#161B22;--ink:#F0F6FC;--muted:#9DA7B3;--line:#30363D;--topology:#C9D1D9;--green:#56D364;--green-soft:#172D1D;--red:#FF7B72;--red-soft:#3D1A1D;--yellow:#DDBA55;--yellow-soft:#3A3218;--yellow-ink:#F2CC60;--ghost:#21262D;--power:#FF7B82;--power-soft:#3D1C22;--transport:#56D364;--transport-soft:#172D1D;--information:#58A6FF;--information-soft:#14253D;--organization:#E3B341;--organization-ink:#F0C96B;--organization-soft:#372D14;--cyan:#39C5CF;--cyan-soft:#123236;--violet:#A371F7;--violet-soft:#271B3D;--magenta:#DB61A2;--magenta-soft:#3C1B31;--gold:#DDBA55;--gold-soft:#352D18}

text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink)}
.math{font-family:"DejaVu Serif","Liberation Serif",Georgia,serif}
.title{font-size:34px;font-weight:820;letter-spacing:-.02em}
.h2{font-size:22px;font-weight:780}
.label{font-size:15px;font-weight:720}
.small{font-size:13px;fill:var(--muted)}
.micro{font-size:11px;fill:var(--muted);letter-spacing:.08em}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.plane{fill:var(--ghost);stroke:var(--line);stroke-width:1.4}
.power{fill:none;stroke:var(--power);stroke-width:3}
.transport{fill:none;stroke:var(--transport);stroke-width:3}
.info{fill:none;stroke:var(--information);stroke-width:2;stroke-dasharray:8 7}
.org{fill:none;stroke:var(--organization);stroke-width:2;stroke-dasharray:2 6}
.model{fill:none;stroke:var(--violet);stroke-width:2.4}
.viable{fill:var(--green-soft);stroke:var(--green);stroke-width:2.4}
.critical{fill:none;stroke:var(--red);stroke-width:3.2;stroke-dasharray:10 8}
.control{fill:none;stroke:var(--gold);stroke-width:3.2;stroke-dasharray:8 6}
.state{fill:var(--cyan);stroke:var(--panel);stroke-width:2}
.node{fill:var(--panel);stroke-width:2.4}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<rect x="1" y="1" width="1598" height="498" rx="18" fill="var(--bg)" stroke="var(--line)"/>
<text x="48" y="56" class="micro">CURRENT RESEARCH STATE · SVD PROJECTION OF CONCEPTUAL 4D STATE</text>
<line x1="120" y1="400" x2="1490" y2="400" stroke="var(--line)"/>
<line x1="120" y1="100" x2="120" y2="420" stroke="var(--line)"/>
<text x="1490" y="425" text-anchor="end" class="small">component 1</text>
<text x="92" y="112" class="small">component 2</text>
<path d="M1100.0 347.6L935.7 184.3" class="model"/>
<path d="M935.7 184.3L733.4 151.2" class="model"/>
<path d="M733.4 151.2L599.8 247.3" class="model"/>
<path d="M599.8 247.3L515.0 348.8" class="model"/>
<polygon points="1100.0,329.6 1115.6,338.6 1115.6,356.6 1100.0,365.6 1084.4,356.6 1084.4,338.6" fill="var(--violet-soft)" stroke="var(--violet)" stroke-width="3"/>
<text x="1100.0" y="313.6" text-anchor="middle" class="label">STRUCTURE</text>
<polygon points="935.7,160.3 956.5,172.3 956.5,196.3 935.7,208.3 914.9,196.3 914.9,172.3" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="3"/>
<text x="935.7" y="150.3" text-anchor="middle" class="label">MECHANISM</text>
<polygon points="733.4,127.2 756.2,143.8 747.5,170.6 719.3,170.6 710.6,143.8" fill="var(--information-soft)" stroke="var(--information)" stroke-width="3"/>
<text x="733.4" y="117.2" text-anchor="middle" class="label">DYNAMICS</text>
<polygon points="599.8,229.3 615.4,238.3 615.4,256.3 599.8,265.3 584.2,256.3 584.2,238.3" fill="var(--violet-soft)" stroke="var(--violet)" stroke-width="3"/>
<text x="599.8" y="213.3" text-anchor="middle" class="label">CONTROL</text>
<polygon points="515.0,330.8 530.6,339.8 530.6,357.8 515.0,366.8 499.4,357.8 499.4,339.8" fill="var(--violet-soft)" stroke="var(--violet)" stroke-width="3"/>
<text x="515.0" y="314.8" text-anchor="middle" class="label">VIABILITY</text>
<path d="M935.7 184.3L733.4 151.2M743.6 147.0L733.4 151.2L741.7 158.4" class="control"/>
<text x="48" y="466" class="small">Conceptual normalized state r=(r_s,r_c,r_d,r_v); SVD projection only. First two components explain 97.7% of the configured conceptual variance; not empirical measurement.</text>
</svg>
