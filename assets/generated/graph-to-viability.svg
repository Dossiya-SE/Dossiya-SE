<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 450" role="img" aria-labelledby="title desc">
<title id="title">Graph to viability transformation</title>
<desc id="desc">Mathematical transformation from multilayer topology and interface object to coupled dynamics, viability geometry, resilience margin and engineering decision. Green is viable, red is critical boundary, light yellow is causal/decision. Geometry is explanatory, not fitted data.</desc>
<style>
:root{--bg:#fffdf6;--panel:#ffffff;--ink:#11161c;--muted:#69736f;--line:#d7d5ca;--green:#157347;--green-soft:#e8f4e7;--red:#c62828;--red-soft:#fdebec;--yellow:#efc84a;--yellow-soft:#fff3bd;--yellow-ink:#6f5610;--ghost:#f0ede5}
@media(prefers-color-scheme:dark){:root{--bg:#0b100d;--panel:#111712;--ink:#f3f6f3;--muted:#a2ada6;--line:#303a33;--green:#56d887;--green-soft:#173924;--red:#ff6b6b;--red-soft:#421f22;--yellow:#f2cc60;--yellow-soft:#423816;--yellow-ink:#ffe69a;--ghost:#18201a}}
text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink)}
.math{font-family:Georgia,"STIX Two Text","Times New Roman",serif}
.title{font-size:34px;font-weight:820;letter-spacing:-.02em}
.h{font-size:23px;font-weight:780} .k{font-size:12px;font-weight:800;letter-spacing:.13em}
.m{font-size:14px;fill:var(--muted)} .s{font-size:11px;fill:var(--muted)} .node-label{font-size:13px;font-weight:760}
.edge{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;opacity:.72}
.edge-soft{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;opacity:.38;stroke-dasharray:5 6}
.flow{fill:none;stroke:var(--green);stroke-width:3.4;stroke-linecap:round;stroke-dasharray:10 12;animation:serviceFlow 3.3s linear infinite}
.interface-flow{fill:none;stroke:var(--yellow);stroke-width:4;stroke-linecap:round;stroke-dasharray:9 11;animation:interfaceFlow 2.8s linear infinite}
.critical-demo{opacity:0;fill:none;stroke:var(--red);stroke-width:5;stroke-linecap:round;stroke-dasharray:8 8;animation:criticalPhase 20s linear infinite}
.propagation-demo{opacity:0;fill:none;stroke:var(--red);stroke-width:4.5;stroke-linecap:round;stroke-dasharray:7 9;animation:propagationPhase 20s linear infinite}
.control-demo{opacity:0;fill:none;stroke:var(--yellow);stroke-width:4.5;stroke-linecap:round;stroke-dasharray:9 9;animation:controlPhase 20s linear infinite}
.recovery-demo{opacity:0;fill:none;stroke:var(--green);stroke-width:5;stroke-linecap:round;stroke-dasharray:10 10;animation:recoveryPhase 20s linear infinite}
.critical-node{opacity:0;fill:var(--red);animation:criticalPhase 20s linear infinite}
.control-node{opacity:0;fill:var(--yellow);animation:controlPhase 20s linear infinite}
@keyframes serviceFlow{to{stroke-dashoffset:-44}} @keyframes interfaceFlow{to{stroke-dashoffset:-40}}
@keyframes criticalPhase{0%,19%,60%,100%{opacity:0}22%,55%{opacity:1}}
@keyframes propagationPhase{0%,36%,60%,100%{opacity:0}40%,56%{opacity:1}}
@keyframes controlPhase{0%,56%,81%,100%{opacity:0}61%,76%{opacity:1}}
@keyframes recoveryPhase{0%,76%,100%{opacity:0}81%,96%{opacity:1}}
@media(prefers-reduced-motion:reduce){.flow,.interface-flow,.critical-demo,.propagation-demo,.control-demo,.recovery-demo,.critical-node,.control-node{animation:none!important}.critical-demo,.propagation-demo,.control-demo,.recovery-demo,.critical-node,.control-node{opacity:0!important}}
</style>
<rect x="1" y="1" width="1398" height="448" rx="28" fill="var(--bg)" stroke="var(--line)"/>
<text x="44" y="52" class="k" fill="var(--green)">GRAPH → DYNAMICS → VIABILITY → DECISION</text>
<circle cx="110" cy="155" r="42" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/>
<text x="110" y="163" text-anchor="middle" class="math" font-size="26">𝓖</text>
<text x="110" y="218" text-anchor="middle" class="s">topology</text>
<path d="M158 155H252" class="interface-flow"/>
<circle cx="300" cy="155" r="42" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="2"/>
<text x="300" y="163" text-anchor="middle" class="math" font-size="26">𝕀</text>
<text x="300" y="218" text-anchor="middle" class="s">causal interface</text>
<path d="M348 155H442" class="interface-flow"/>
<circle cx="490" cy="155" r="42" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/>
<text x="490" y="163" text-anchor="middle" class="math" font-size="26">F𝓖</text>
<text x="490" y="218" text-anchor="middle" class="s">coupled dynamics</text>
<path d="M538 155H632" class="interface-flow"/>
<circle cx="680" cy="155" r="42" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/>
<text x="680" y="163" text-anchor="middle" class="math" font-size="26">Y(t)</text>
<text x="680" y="218" text-anchor="middle" class="s">state trajectory</text>
