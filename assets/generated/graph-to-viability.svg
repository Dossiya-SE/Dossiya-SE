<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc"><title id="title">Graph to dynamics to computed viability</title><desc id="desc">A typed polygonal graph maps through an affine model plane into a Shapely-computed feasible region. The resilience margin is the exact nearest-boundary distance and normal projection.</desc><style>
:root{--bg:#FFFFFF;--panel:#FFFFFF;--ink:#1E2933;--muted:#59636E;--line:#E0E5EA;--topology:#2B333D;--green:#16823A;--green-soft:#EAF5EE;--red:#CF222E;--red-soft:#FDEBEC;--yellow:#9A6700;--yellow-soft:#FFF4CC;--yellow-ink:#6B4B00;--ghost:#F7F9FA;--power:#C8102E;--power-soft:#FBEAEC;--transport:#16823A;--transport-soft:#EAF5EE;--information:#1D4ED8;--information-soft:#E8EEFD;--organization:#A66F00;--organization-ink:#7A5200;--organization-soft:#FBF0DA;--cyan:#007A88;--cyan-soft:#E6F6F8;--violet:#6D28D9;--violet-soft:#F0EAFE;--magenta:#A21CAF;--magenta-soft:#F8E8FB;--gold:#8B5E00;--gold-soft:#F6EEDC}
@media(prefers-color-scheme:dark){:root{--bg:#0D1117;--panel:#161B22;--ink:#F0F6FC;--muted:#9DA7B3;--line:#30363D;--topology:#C9D1D9;--green:#56D364;--green-soft:#172D1D;--red:#FF7B72;--red-soft:#3D1A1D;--yellow:#DDBA55;--yellow-soft:#3A3218;--yellow-ink:#F2CC60;--ghost:#21262D;--power:#FF7B82;--power-soft:#3D1C22;--transport:#56D364;--transport-soft:#172D1D;--information:#58A6FF;--information-soft:#14253D;--organization:#E3B341;--organization-ink:#F0C96B;--organization-soft:#372D14;--cyan:#39C5CF;--cyan-soft:#123236;--violet:#A371F7;--violet-soft:#271B3D;--magenta:#DB61A2;--magenta-soft:#3C1B31;--gold:#DDBA55;--gold-soft:#352D18}}
text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink)}
.math{font-family:"DejaVu Serif","Liberation Serif",Georgia,serif}
.title{font-size:38px;font-weight:820;letter-spacing:-.02em}
.h2{font-size:26px;font-weight:780}
.label{font-size:20px;font-weight:720}
.small{font-size:18px;fill:var(--muted)}
.micro{font-size:16px;fill:var(--muted);letter-spacing:.08em}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.plane{fill:var(--ghost);stroke:var(--line);stroke-width:1.4}
.power{fill:none;stroke:var(--power);stroke-width:3}
.transport{fill:none;stroke:var(--transport);stroke-width:3}
.info{fill:none;stroke:var(--information);stroke-width:2;stroke-dasharray:8 7}
.org{fill:none;stroke:var(--organization);stroke-width:2;stroke-dasharray:2 6}
.model{fill:none;stroke:var(--violet);stroke-width:2.4}
.viable{fill:var(--green-soft);stroke:var(--green);stroke-width:2.4}
.critical{fill:none;stroke:var(--red);stroke-width:3.2;stroke-dasharray:10 8}
.control{fill:none;stroke:var(--gold);stroke-width:3.2;stroke-dasharray:8 6}
.state{fill:var(--cyan);stroke:var(--panel);stroke-width:2}
.node{fill:var(--panel);stroke-width:2.4}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<rect x="1" y="1" width="1598" height="558" rx="18" fill="var(--bg)" stroke="var(--line)"/>
<text x="48" y="56" class="micro">GRAPH → DYNAMICS → COMPUTED VIABILITY</text>
<text x="70" y="100" class="label">GRAPH / MODEL SPACE</text>
<polygon points="60,145 580,125 635,360 115,380" class="plane"/>
<path d="M150 250L280 190L390 280L520 200L280 190L390 280" fill="none" stroke="var(--topology)" stroke-width="2"/>
<polygon points="150.0,228.0 169.1,261.0 130.9,261.0" fill="var(--power-soft)" stroke="var(--power)" stroke-width="2.5"/>
<polygon points="280.0,168.0 302.0,190.0 280.0,212.0 258.0,190.0" fill="var(--transport-soft)" stroke="var(--transport)" stroke-width="2.5"/>
<polygon points="390.0,258.0 410.9,273.2 402.9,297.8 377.1,297.8 369.1,273.2" fill="var(--information-soft)" stroke="var(--information)" stroke-width="2.5"/>
<polygon points="520.0,178.0 539.1,189.0 539.1,211.0 520.0,222.0 500.9,211.0 500.9,189.0" fill="var(--organization-soft)" stroke="var(--organization)" stroke-width="2.5"/>
<text x="110" y="420" class="math label">G + I → F_G</text>
<polygon points="690,185 830,165 855,335 715,355" fill="var(--violet-soft)" stroke="var(--violet)" stroke-width="2.2"/>
<text x="772" y="248" text-anchor="middle" class="math label">Ẏ=F_G</text>
<text x="772" y="292" text-anchor="middle" class="small">affine model plane</text>
<path d="M650.0 270.0L675.0 270.0M665.6 275.7L675.0 270.0L665.6 264.3" class="control"/>
<path d="M870.0 270.0L930.0 270.0M920.6 275.7L930.0 270.0L920.6 264.3" class="control"/>
<text x="955" y="100" class="label">STATE / VIABILITY SPACE</text>
<polygon points="1078.2,235.7 1254.1,156.5 1325.5,156.5 1406.8,281.7 1406.8,408.5 1078.2,408.5" class="viable"/>
<path d="M1078.2 235.7L1254.1 156.5" class="critical"/>
<circle cx="1248.0" cy="280.3" r="9" class="state"/>
<path d="M1248.0 280.3L1202.7 179.6M1211.8 185.8L1202.7 179.6L1201.3 190.5" class="control"/>
<circle cx="1202.7" cy="179.6" r="6" fill="var(--gold)"/>
<text x="1262.0" y="268.3" class="math label">Y(t)</text>
<text x="1235.3" y="222.0" class="math label" fill="var(--gold)">ρ_g</text>
<text x="1248.1" y="144.5" text-anchor="end" class="math label" fill="var(--red)">∂V</text>
<text x="965" y="468" class="small">V = intersection of 6 governed constraints</text>
<text x="965" y="493" class="small">active boundary: g₆(Y)=0</text>
<text x="48" y="535" class="small">The feasible set, nearest boundary point and ρ_g are computed objects; physical calibration and empirical validation remain separate requirements.</text>
</svg>
