<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc">
<title id="title">Graph to viability transformation</title>
<desc id="desc">Architectural separation of graph and model space from state and viability space. The causal interface is highlighted in ochre, admissible viability in green, and the critical boundary in red. Geometry is explanatory, not fitted data.</desc>
<style>
:root{--bg:#FBFAF6;--panel:#FFFFFF;--ink:#1F2328;--muted:#59636E;--line:#D1D9E0;--topology:#24292F;--green:#1A7F37;--green-soft:#DAFBE1;--red:#CF222E;--red-soft:#FFEBE9;--yellow:#9A6700;--yellow-soft:#FFF8C5;--yellow-ink:#6A4B00;--ghost:#F6F8FA}
@media(prefers-color-scheme:dark){:root{--bg:#0D1117;--panel:#161B22;--ink:#F0F6FC;--muted:#8B949E;--line:#30363D;--topology:#C9D1D9;--green:#3FB950;--green-soft:#1B4721;--red:#F85149;--red-soft:#3D1A1D;--yellow:#DDBA55;--yellow-soft:#3A3218;--yellow-ink:#F2CC60;--ghost:#21262D}}
text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink)}
.math{font-family:Georgia,"STIX Two Text","Times New Roman",serif}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;fill:var(--muted)}
.title{font-size:31px;font-weight:800;letter-spacing:-.02em}
.h{font-size:20px;font-weight:760} .m{font-size:14px;fill:var(--muted)} .s{font-size:11px;fill:var(--muted)}
.value{font-size:18px;font-weight:720} .math-lg{font-family:Georgia,"STIX Two Text","Times New Roman",serif;font-size:25px}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.flow-yellow{fill:none;stroke:var(--yellow);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:9 11;animation:flow 3.2s linear infinite}
.flow-green{fill:none;stroke:var(--green);stroke-width:3;stroke-linecap:round;stroke-dasharray:10 12;animation:flow 3.8s linear infinite}
.pulse-green{animation:pulse 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.latest{animation:latest 3.4s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-42}}
@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
@keyframes latest{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
@media(prefers-reduced-motion:reduce){.flow-yellow,.flow-green,.pulse-green,.latest{animation:none!important}}
</style>
<rect x="1" y="1" width="1398" height="498" rx="28" fill="var(--bg)" stroke="var(--line)"/>
<text x="48" y="48" class="eyebrow">GRAPH → DYNAMICS → VIABILITY → DECISION</text>
<text x="48" y="84" class="m">The figure separates structural/model objects from the state-space viability geometry they induce.</text>
<text x="48" y="126" class="eyebrow">GRAPH / MODEL SPACE</text>
<rect x="48" y="146" width="142" height="104" rx="16" fill="var(--panel)" stroke="var(--line)" stroke-width="1.2"/>
<text x="119" y="190" text-anchor="middle" class="math-lg" fill="var(--ink)">𝓖</text>
<text x="119" y="224" text-anchor="middle" class="s">multilayer topology</text>
<path d="M190 198H222" class="flow-yellow"/>
<rect x="222" y="146" width="142" height="104" rx="16" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="1.8"/>
<text x="293" y="190" text-anchor="middle" class="math-lg" fill="var(--yellow-ink)">𝕀</text>
<text x="293" y="224" text-anchor="middle" class="s">causal interface</text>
<path d="M364 198H396" class="flow-yellow"/>
<rect x="396" y="146" width="142" height="104" rx="16" fill="var(--panel)" stroke="var(--line)" stroke-width="1.2"/>
<text x="467" y="190" text-anchor="middle" class="math-lg" fill="var(--ink)">F𝓖</text>
<text x="467" y="224" text-anchor="middle" class="s">coupled dynamics</text>
<path d="M538 198H570" stroke="var(--line)" stroke-width="2"/>
<rect x="570" y="146" width="142" height="104" rx="16" fill="var(--panel)" stroke="var(--line)" stroke-width="1.2"/>
<text x="641" y="190" text-anchor="middle" class="math-lg" fill="var(--ink)">Y(t)</text>
<text x="641" y="224" text-anchor="middle" class="s">state trajectory</text>
<path d="M736 198H805" stroke="var(--line)" stroke-width="2"/>
<path d="M791 188L805 198L791 208" fill="none" stroke="var(--line)" stroke-width="2"/>
<rect x="825" y="112" width="527" height="318" rx="20" class="panel"/>
<text x="849" y="144" class="eyebrow">STATE / VIABILITY SPACE</text>
<line x1="879" y1="376" x2="1295" y2="376" stroke="var(--line)" stroke-width="1.2"/>
<line x1="879" y1="376" x2="879" y2="174" stroke="var(--line)" stroke-width="1.2"/>
<text x="1301" y="382" class="s">x₁</text>
<text x="867" y="167" class="s">x₂</text>
<path d="M900 329C907 244 965 185 1055 175C1152 164 1242 199 1289 270C1311 304 1292 355 1235 379C1166 408 1063 397 986 382C931 371 896 356 900 329Z" fill="var(--green-soft)" stroke="var(--green)" stroke-width="2.2" opacity=".9"/>
<path d="M939 320C949 260 995 219 1062 211C1132 202 1204 228 1243 277C1262 300 1245 334 1203 350C1151 370 1078 365 1022 354C979 346 935 340 939 320Z" fill="none" stroke="var(--green)" stroke-width="1.2" opacity=".35"/>
<path d="M900 329C907 244 965 185 1055 175C1152 164 1242 199 1289 270C1311 304 1292 355 1235 379C1166 408 1063 397 986 382C931 371 896 356 900 329Z" fill="none" stroke="var(--red)" stroke-width="3" stroke-dasharray="9 8" opacity=".9"/>
<text x="1187" y="203" class="math" font-size="18" fill="var(--red)">∂𝒱</text>
<text x="1120" y="338" class="math" font-size="21" fill="var(--green)">𝒱ₛᵤₛ</text>
<circle cx="1048" cy="292" r="9" fill="var(--green)" class="pulse-green"/>
<text x="1064" y="297" class="math" font-size="17">Y(t)</text>
<path d="M1057 286L1212 225" stroke="var(--red)" stroke-width="2.4" stroke-dasharray="6 6"/>
<text x="1128" y="246" class="math" font-size="17" fill="var(--red)">ρ_g</text>
<path d="M1058 301Q1105 337 1174 329" class="flow-yellow"/>
<polygon points="1190,317 1195,327 1206,329 1198,337 1200,349 1190,343 1180,349 1182,337 1174,329 1185,327" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="2"/>
<text x="1212" y="340" class="math" font-size="18" fill="var(--yellow-ink)">u*</text>
<line x1="48" y1="286" x2="746" y2="286" stroke="var(--line)"/>
<text x="48" y="323" class="math" font-size="18">Ẏ = F_𝒢(Y,u,η;θ)</text>
<text x="48" y="359" class="math" font-size="18" fill="var(--green)">Y(t) ∈ 𝒱ₛᵤₛ(t)</text>
<text x="48" y="395" class="math" font-size="18" fill="var(--red)">ρ_g(Y) = d_g(Y,∂𝒱)</text>
<text x="48" y="445" class="m">Structural topology constrains dynamics; viability encodes admissible operation; the margin measures proximity to a critical boundary; control selects an admissible intervention.</text>
<text x="1352" y="474" text-anchor="end" class="s">No empirical validity is implied by the geometry alone.</text>
</svg>
