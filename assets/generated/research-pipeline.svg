<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 460" role="img" aria-labelledby="title desc"><title id="title">Seven-stage research architecture as continuous gamma trajectory</title><desc id="desc">The seven stages are landmarks on a continuous cubic-spline trajectory gamma(t). Shape differentiates stages; the active mechanism-to-dynamics transition is highlighted.</desc><style>
