<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 420" role="img" aria-labelledby="title desc"><title id="title">Seven-stage research architecture as a continuous geometric path</title><desc id="desc">Seven-stage architecture encoded by a continuous sequence of geometric objects from triangle and hexagon through pentagon, quadrilateral, ellipse, octagon and decagon. The active transition is stages two to three.</desc><style>
:root{--bg:#FFFFFF;--panel:#FFFFFF;--ink:#1E2933;--muted:#59636E;--line:#E0E5EA;--topology:#2B333D;--green:#16823A;--green-soft:#EAF5EE;--red:#CF222E;--red-soft:#FDEBEC;--yellow:#9A6700;--yellow-soft:#FFF4CC;--yellow-ink:#6B4B00;--ghost:#F7F9FA;--power:#C8102E;--power-soft:#FBEAEC;--transport:#16823A;--transport-soft:#EAF5EE;--information:#1D4ED8;--information-soft:#E8EEFD;--organization:#A66F00;--organization-ink:#7A5200;--organization-soft:#FBF0DA;--cyan:#007A88;--cyan-soft:#E6F6F8;--violet:#6D28D9;--violet-soft:#F0EAFE;--magenta:#A21CAF;--magenta-soft:#F8E8FB;--gold:#8B5E00;--gold-soft:#F6EEDC}
@media(prefers-color-scheme:dark){:root{--bg:#0D1117;--panel:#161B22;--ink:#F0F6FC;--muted:#9DA7B3;--line:#30363D;--topology:#C9D1D9;--green:#56D364;--green-soft:#172D1D;--red:#FF7B72;--red-soft:#3D1A1D;--yellow:#DDBA55;--yellow-soft:#3A3218;--yellow-ink:#F2CC60;--ghost:#21262D;--power:#FF7B82;--power-soft:#3D1C22;--transport:#56D364;--transport-soft:#172D1D;--information:#58A6FF;--information-soft:#14253D;--organization:#E3B341;--organization-ink:#F0C96B;--organization-soft:#372D14;--cyan:#39C5CF;--cyan-soft:#123236;--violet:#A371F7;--violet-soft:#271B3D;--magenta:#DB61A2;--magenta-soft:#3C1B31;--gold:#DDBA55;--gold-soft:#352D18}}
text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink)}
.math{font-family:"DejaVu Serif","Liberation Serif",Georgia,serif}
.title{font-size:34px;font-weight:820;letter-spacing:-.02em}
.h2{font-size:22px;font-weight:780}
.label{font-size:15px;font-weight:720}
.small{font-size:13px;fill:var(--muted)}
.micro{font-size:11px;fill:var(--muted);letter-spacing:.08em}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.plane{fill:var(--ghost);stroke:var(--line);stroke-width:1.3}
.power{fill:none;stroke:var(--power);stroke-width:3}
.transport{fill:none;stroke:var(--transport);stroke-width:3}
.info{fill:none;stroke:var(--information);stroke-width:2;stroke-dasharray:8 7}
.org{fill:none;stroke:var(--organization);stroke-width:2;stroke-dasharray:2 6}
.model{fill:none;stroke:var(--violet);stroke-width:2.3}
.viable{fill:var(--green-soft);stroke:var(--green);stroke-width:2.2}
.critical{fill:none;stroke:var(--red);stroke-width:3;stroke-dasharray:10 8}
.control{fill:none;stroke:var(--gold);stroke-width:3;stroke-dasharray:8 6}
.state{fill:var(--cyan);stroke:var(--panel);stroke-width:2}
.node{fill:var(--panel);stroke-width:2.4}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<rect x="1" y="1" width="1798" height="418" rx="18" fill="var(--bg)" stroke="var(--line)"/>
<text x="48" y="56" class="micro">SEVEN-STAGE RESEARCH ARCHITECTURE · CONTINUOUS GEOMETRIC PATH</text>
<polygon points="140.0,144.0 197.2,243.0 82.8,243.0" fill="var(--power-soft)" stroke="var(--power)" stroke-width="3"/>
<text x="140" y="207" text-anchor="middle" class="label">1</text><text x="140" y="232" text-anchor="middle" class="small">STRUCTURE</text>
<path d="M218 210L312 210M302.6 215.7L312 210L302.6 204.3" class="model"/>
<polygon points="390.0,144.0 447.2,177.0 447.2,243.0 390.0,276.0 332.8,243.0 332.8,177.0" fill="var(--organization-soft)" stroke="var(--organization)" stroke-width="3"/>
<text x="390" y="207" text-anchor="middle" class="label">2</text><text x="390" y="232" text-anchor="middle" class="small">MECHANISM</text>
<path d="M468 210L562 210M552.6 215.7L562 210L552.6 204.3" class="control"/>
<polygon points="640.0,144.0 702.8,189.6 678.8,263.4 601.2,263.4 577.2,189.6" fill="var(--information-soft)" stroke="var(--information)" stroke-width="3"/>
<text x="640" y="207" text-anchor="middle" class="label">3</text><text x="640" y="232" text-anchor="middle" class="small">DYNAMICS</text>
<path d="M718 210L812 210M802.6 215.7L812 210L802.6 204.3" class="model"/>
<polygon points="890.0,144.0 956.0,210.0 890.0,276.0 824.0,210.0" fill="var(--cyan-soft)" stroke="var(--cyan)" stroke-width="3"/>
<text x="890" y="207" text-anchor="middle" class="label">4</text><text x="890" y="232" text-anchor="middle" class="small">CONTROL</text>
<path d="M968 210L1062 210M1052.6 215.7L1062 210L1052.6 204.3" class="model"/>
<ellipse cx="1140" cy="210" rx="72" ry="52" class="viable"/>
<text x="1140" y="207" text-anchor="middle" class="label">5</text><text x="1140" y="232" text-anchor="middle" class="small">VIABILITY</text>
<path d="M1218 210L1312 210M1302.6 215.7L1312 210L1302.6 204.3" class="model"/>
<polygon points="1390.0,144.0 1436.7,163.3 1456.0,210.0 1436.7,256.7 1390.0,276.0 1343.3,256.7 1324.0,210.0 1343.3,163.3" fill="var(--magenta-soft)" stroke="var(--magenta)" stroke-width="3"/>
<text x="1390" y="207" text-anchor="middle" class="label">6</text><text x="1390" y="232" text-anchor="middle" class="small">INTERFACE</text>
<path d="M1468 210L1562 210M1552.6 215.7L1562 210L1552.6 204.3" class="model"/>
<polygon points="1640.0,144.0 1678.8,156.6 1702.8,189.6 1702.8,230.4 1678.8,263.4 1640.0,276.0 1601.2,263.4 1577.2,230.4 1577.2,189.6 1601.2,156.6" fill="var(--violet-soft)" stroke="var(--violet)" stroke-width="3"/>
<text x="1640" y="207" text-anchor="middle" class="label">7</text><text x="1640" y="232" text-anchor="middle" class="small">TRANSFORM</text>
<text x="48" y="372" class="small">Active transition: CAUSAL MECHANISMS → COUPLED HYBRID MULTISCALE DYNAMICS. Geometry is a navigation grammar, not an ontology or evidence scale.</text>
</svg>
