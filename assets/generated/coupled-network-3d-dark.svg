<text x="48" y="690" class="small">STATIC 3D SCHEMATIC · NOT GIS ELEVATION. The separation h is a visual layer coordinate; it is not physical height, measured flow, or live telemetry.</text>
<text x="48" y="718" class="small">The shared interface is the segment between corresponding layer states, validated as non-degenerate in R³.</text>
