<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc"><title id="title">Computed coupled Power–Transportation multilayer geometry</title><desc id="desc">Static projection of a computed 3D two-layer affine system. PyVista and Trimesh validate the 3D scene; the SVG is a deterministic orthographic projection, not GIS elevation.</desc><style>
:root{--bg:#0D1117;--panel:#161B22;--ink:#F0F6FC;--muted:#9DA7B3;--line:#30363D;--topology:#C9D1D9;--green:#56D364;--green-soft:#172D1D;--red:#FF7B72;--red-soft:#3D1A1D;--ghost:#21262D;--power:#FF7B82;--power-soft:#3D1C22;--transport:#56D364;--transport-soft:#172D1D;--information:#58A6FF;--information-soft:#14253D;--organization:#E879F9;--organization-ink:#F5C2FF;--organization-soft:#371B3D;--control:#87CEFA;--control-ink:#BFE8FF;--control-soft:#142A3A;--cyan:#22D3EE;--cyan-soft:#123138;--violet:#A371F7;--violet-soft:#271B3D;--magenta:#F472B6;--magenta-soft:#3C1B31}

text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink)}
.math{font-family:"DejaVu Serif","Liberation Serif",Georgia,serif}
.title{font-size:38px;font-weight:820;letter-spacing:-.02em}
.h2{font-size:26px;font-weight:780}
.label{font-size:20px;font-weight:720}
.small{font-size:18px;fill:var(--muted)}
.micro{font-size:16px;fill:var(--muted);letter-spacing:.08em}
.project-name{font-size:18px;font-weight:720}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.plane{fill:var(--ghost);stroke:var(--line);stroke-width:1.4}
.power{fill:none;stroke:var(--power);stroke-width:3}
.transport{fill:none;stroke:var(--transport);stroke-width:3}
.info{fill:none;stroke:var(--information);stroke-width:2;stroke-dasharray:8 7}
.org{fill:none;stroke:var(--organization);stroke-width:2;stroke-dasharray:2 6}
.model{fill:none;stroke:var(--violet);stroke-width:2.4}
.viable{fill:var(--green-soft);stroke:var(--green);stroke-width:2.4}
.critical{fill:none;stroke:var(--red);stroke-width:3.2;stroke-dasharray:10 8}
.control{fill:none;stroke:var(--control);stroke-width:3.2;stroke-dasharray:8 6}
.state{fill:var(--control);stroke:var(--panel);stroke-width:2}
.node{fill:var(--panel);stroke-width:2.4}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
