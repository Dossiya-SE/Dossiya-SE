<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
<title id="title">Governed living research state</title>
<desc id="desc">Minimal research-state panel. Neutral structure dominates, light yellow marks the active causal-to-dynamics transition, and green marks the active mathematical research state. No red is used for metadata.</desc>
<style>
:root{--bg:#FBFAF6;--panel:#FFFFFF;--ink:#1F2328;--muted:#59636E;--line:#D1D9E0;--topology:#24292F;--green:#1A7F37;--green-soft:#DAFBE1;--red:#CF222E;--red-soft:#FFEBE9;--yellow:#9A6700;--yellow-soft:#FFF8C5;--yellow-ink:#6A4B00;--ghost:#F6F8FA}

text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink)}
.math{font-family:Georgia,"STIX Two Text","Times New Roman",serif}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;fill:var(--muted)}
.title{font-size:31px;font-weight:800;letter-spacing:-.02em}
.h{font-size:20px;font-weight:760} .m{font-size:14px;fill:var(--muted)} .s{font-size:11px;fill:var(--muted)}
.value{font-size:18px;font-weight:720} .math-lg{font-family:Georgia,"STIX Two Text","Times New Roman",serif;font-size:25px}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.flow-yellow{fill:none;stroke:var(--yellow);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:9 11;animation:flow 3.2s linear infinite}
.flow-green{fill:none;stroke:var(--green);stroke-width:3;stroke-linecap:round;stroke-dasharray:10 12;animation:flow 3.8s linear infinite}
.pulse-green{animation:pulse 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.latest{animation:latest 3.4s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-42}}
@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
@keyframes latest{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
@media(prefers-reduced-motion:reduce){.flow-yellow,.flow-green,.pulse-green,.latest{animation:none!important}}
</style>
<rect x="1" y="1" width="1398" height="358" rx="28" fill="var(--bg)" stroke="var(--line)"/>
<circle cx="55" cy="47" r="6" fill="var(--green)" class="pulse-green"/>
<text x="74" y="52" class="eyebrow">CURRENT RESEARCH STATE</text>
<text x="48" y="104" class="title">Power ↔ Transportation</text>
<text x="48" y="132" class="m">Information + Organization enter only when they materially alter operation, coordination, inference or recovery.</text>
<line x1="48" y1="158" x2="1352" y2="158" stroke="var(--line)"/>
<text x="48" y="194" class="eyebrow">CURRENT SCIENTIFIC TRANSITION</text>
<rect x="48" y="215" width="268" height="54" rx="13" class="panel"/>
<text x="68" y="248" class="value">Causal Mechanisms</text>
<path d="M334 242H535" class="flow-yellow"/>
<rect x="554" y="215" width="410" height="54" rx="13" class="panel"/>
<text x="574" y="248" class="value">Coupled Hybrid Multiscale Dynamics</text>
<text x="48" y="296" class="m">physically supported interfaces → coupled state evolution under disturbance and control</text>
<text x="1010" y="194" class="eyebrow">MATHEMATICAL STATE</text>
<text x="1010" y="237" class="math-lg">R_phys → C → (G,I) → F_G → V → ρ_g → u*</text>
<path d="M1010 261H1348" class="flow-green"/>
<line x1="48" y1="318" x2="1352" y2="318" stroke="var(--line)"/>
<text x="48" y="342" class="s">06 public systems  ·  04 featured  ·  state verified 13 Sep 2026  ·  public evidence observed 17 Sep 2026</text>
<text x="1352" y="342" text-anchor="end" class="s">public activity cannot promote a scientific claim</text>
</svg>
