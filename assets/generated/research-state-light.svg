<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 470" role="img" aria-labelledby="title desc">
<title id="title">Governed living research state</title>
<desc id="desc">Compact generated panel distinguishing declared research configuration from observed public repository evidence.</desc>
<style>
:root{--bg:#fbfaf7;--panel:#ffffff;--ink:#11161d;--muted:#606a76;--line:#d8d4cb;--gold:#9a6a12;--blue:#316fc7;--soft:#f3f0e8;--ghost:#eae6dc}

text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink)}
.k{font-size:12px;font-weight:800;letter-spacing:.14em} .h{font-size:30px;font-weight:780} .hero{font-size:45px;font-weight:820;letter-spacing:-.025em}
.v{font-size:19px;font-weight:720} .m{font-size:15px;fill:var(--muted)} .s{font-size:12px;fill:var(--muted)}
.math{font-family:Georgia,"STIX Two Text","Times New Roman",serif;font-size:22px} .math-sm{font-family:Georgia,"STIX Two Text","Times New Roman",serif;font-size:16px}
.flow-gold{stroke:var(--gold);stroke-dasharray:10 13;animation:flowGold 3.1s linear infinite}
.flow-blue{stroke:var(--blue);stroke-dasharray:9 13;animation:flowBlue 3.8s linear infinite}
.pulse-gold{animation:pulseGold 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse-blue{animation:pulseBlue 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.latest{animation:latestPulse 3.4s ease-in-out infinite}
.level-set{fill:none;stroke:var(--blue)}
@keyframes flowGold{to{stroke-dashoffset:-46}}
@keyframes flowBlue{to{stroke-dashoffset:-44}}
@keyframes pulseGold{0%,100%{opacity:.52;transform:scale(.97)}50%{opacity:1;transform:scale(1.04)}}
@keyframes pulseBlue{0%,100%{opacity:.60;transform:scale(.98)}50%{opacity:1;transform:scale(1.035)}}
@keyframes latestPulse{0%,100%{stroke-opacity:.38}50%{stroke-opacity:1}}
@media(prefers-reduced-motion:reduce){.flow-gold,.flow-blue,.pulse-gold,.pulse-blue,.latest{animation:none!important}}
</style>
<rect x="1" y="1" width="1398" height="468" rx="28" fill="var(--bg)" stroke="var(--line)"/>
<text x="48" y="56" class="k" fill="var(--gold)">CURRENT RESEARCH STATE</text>
<text x="48" y="98" class="h">Power ↔ Transportation</text>
<text x="48" y="126" class="m">information + organization as supporting non-physical layers</text>
<line x1="48" y1="158" x2="1352" y2="158" stroke="var(--line)"/>
<text x="48" y="202" class="k" fill="var(--muted)">ACTIVE FORMAL TRANSITION</text>
<text x="48" y="238" class="v" fill="var(--gold)">Causal Mechanisms → Coupled Hybrid Multiscale Dynamics</text>
<path d="M48 269H566" class="flow-gold" stroke-width="3"/>
<text x="48" y="311" class="m">causal interdependency mechanisms and graph-to-dynamics mapping</text>
<text x="720" y="202" class="k" fill="var(--muted)">MATHEMATICAL SIGNATURE</text>
<text x="720" y="243" class="math" fill="var(--blue)">R_phys → C → (G, I_ij) → F_G → V → ρ_g → u*</text>
<path d="M720 270H1265" class="flow-blue" stroke-width="2.7"/>
<text x="720" y="310" class="s">objects are governed by research-state.json; public activity cannot promote a scientific claim</text>
<rect x="48" y="354" width="250" height="82" rx="16" fill="var(--panel)" stroke="var(--line)"/>
<text x="66" y="381" class="k" fill="var(--muted)">PUBLIC SYSTEMS</text>
<text x="66" y="410" class="v" fill="var(--ink)">06</text>
<text x="280" y="410" text-anchor="end" class="s">allowlisted</text>
<rect x="330" y="354" width="250" height="82" rx="16" fill="var(--panel)" stroke="var(--line)"/>
<text x="348" y="381" class="k" fill="var(--muted)">FEATURED</text>
<text x="348" y="410" class="v" fill="var(--gold)">04</text>
<text x="562" y="410" text-anchor="end" class="s">research-facing</text>
<rect x="612" y="354" width="350" height="82" rx="16" fill="var(--panel)" stroke="var(--line)"/>
<text x="630" y="381" class="k" fill="var(--muted)">STATE VERIFIED</text>
<text x="630" y="410" class="v" fill="var(--blue)">13 Sep 2026</text>
<text x="944" y="410" text-anchor="end" class="s">declared configuration</text>
<rect x="1002" y="354" width="350" height="82" rx="16" fill="var(--panel)" stroke="var(--line)"/>
<text x="1020" y="381" class="k" fill="var(--muted)">EVIDENCE OBSERVED</text>
<text x="1020" y="410" class="v" fill="var(--ink)">13 Sep 2026</text>
<text x="1334" y="410" text-anchor="end" class="s">public metadata</text>
</svg>
