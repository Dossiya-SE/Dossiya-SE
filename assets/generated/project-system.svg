<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 610" role="img" aria-labelledby="title desc">
<title id="title">Observed public research systems</title>
<desc id="desc">Public research systems using green for active featured work, light yellow for the most recent public change, and red only for inactive or critical status.</desc>
<style>
:root{--bg:#fffdf6;--panel:#ffffff;--ink:#10151b;--muted:#66706c;--line:#d8d5ca;--green:#157347;--green-soft:#e8f4e7;--red:#c62828;--red-soft:#fdebec;--yellow:#efc84a;--yellow-soft:#fff3bd;--yellow-ink:#6f5610;--ghost:#eeeae0}
@media(prefers-color-scheme:dark){:root{--bg:#0d1210;--panel:#121913;--ink:#f3f7f2;--muted:#9da99f;--line:#344039;--green:#7bd49a;--green-soft:#193025;--red:#ff8585;--red-soft:#34191c;--yellow:#ffd96a;--yellow-soft:#332b16;--yellow-ink:#ffe9a0;--ghost:#1d2721}}
text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink)}
.k{font-size:12px;font-weight:800;letter-spacing:.14em} .h{font-size:30px;font-weight:780} .hero{font-size:45px;font-weight:820;letter-spacing:-.025em}
.v{font-size:19px;font-weight:720} .m{font-size:15px;fill:var(--muted)} .s{font-size:12px;fill:var(--muted)}
.math{font-family:Georgia,"STIX Two Text","Times New Roman",serif;font-size:22px} .math-sm{font-family:Georgia,"STIX Two Text","Times New Roman",serif;font-size:16px}
.label-yellow{fill:var(--yellow-soft);stroke:var(--yellow)} .label-green{fill:var(--green-soft);stroke:var(--green)} .label-red{fill:var(--red-soft);stroke:var(--red)}
.flow-yellow{stroke:var(--yellow);stroke-dasharray:10 13;animation:flowYellow 3.1s linear infinite} .flow-green{stroke:var(--green);stroke-dasharray:9 13;animation:flowGreen 3.8s linear infinite} .flow-red{stroke:var(--red);stroke-dasharray:7 11;animation:flowRed 3.3s linear infinite}
.pulse-yellow{animation:pulseYellow 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center} .pulse-green{animation:pulseGreen 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center} .pulse-red{animation:pulseRed 2.7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.latest{animation:latestPulse 3.4s ease-in-out infinite} .level-set{fill:none;stroke:var(--green)} .critical-boundary{fill:none;stroke:var(--red)}
@keyframes flowYellow{to{stroke-dashoffset:-46}} @keyframes flowGreen{to{stroke-dashoffset:-44}} @keyframes flowRed{to{stroke-dashoffset:-38}}
@keyframes pulseYellow{0%,100%{opacity:.58;transform:scale(.97)}50%{opacity:1;transform:scale(1.04)}} @keyframes pulseGreen{0%,100%{opacity:.62;transform:scale(.98)}50%{opacity:1;transform:scale(1.035)}} @keyframes pulseRed{0%,100%{opacity:.55;transform:scale(.97)}50%{opacity:1;transform:scale(1.04)}}
@keyframes latestPulse{0%,100%{stroke-opacity:.40}50%{stroke-opacity:1}}
@media(prefers-reduced-motion:reduce){.flow-yellow,.flow-green,.flow-red,.pulse-yellow,.pulse-green,.pulse-red,.latest{animation:none!important}}
</style>
<rect x="1" y="1" width="1398" height="608" rx="28" fill="var(--bg)" stroke="var(--line)"/>
<rect x="48" y="28" width="310" height="31" rx="9" class="label-green" stroke-width="1"/>
<text x="62" y="49" class="k" fill="var(--green)">SELECTED PUBLIC RESEARCH SYSTEMS</text>
<text x="48" y="84" class="s">observed 13 Sep 2026 · explicit public allowlist only</text>
<rect x="48" y="116" width="408" height="190" rx="18" fill="var(--yellow-soft)" stroke="var(--yellow)" stroke-width="3" class="latest"/>
<text x="68" y="146" class="k" fill="var(--yellow)">01 · MOST RECENT PUBLIC CHANGE</text>
<text x="68" y="182" font-size="20" font-weight="780">Research Portfolio</text>
<text x="68" y="212" class="m">interactive mathematical visualization and research demonstrations</text>
<text x="68" y="234" class="m"></text>
<text x="68" y="270" class="s">HTML · latest public commit 13 Sep 2026</text>
<text x="68" y="292" class="s">public · active</text>
<rect x="490" y="116" width="408" height="190" rx="18" fill="var(--panel)" stroke="var(--green)" stroke-width="2" class=""/>
<text x="510" y="146" class="k" fill="var(--green)">02 · FEATURED</text>
<text x="510" y="182" font-size="20" font-weight="780">Geometry + Resilience</text>
<text x="510" y="212" class="m">differential geometry, dynamical systems and resilience mathematics</text>
<text x="510" y="234" class="m"></text>
<text x="510" y="270" class="s">Python · latest public commit 09 Sep 2026</text>
<text x="510" y="292" class="s">public · active</text>
<rect x="932" y="116" width="408" height="190" rx="18" fill="var(--panel)" stroke="var(--green)" stroke-width="2" class=""/>
<text x="952" y="146" class="k" fill="var(--green)">03 · FEATURED</text>
<text x="952" y="182" font-size="20" font-weight="780">Optimization + Resilience</text>
<text x="952" y="212" class="m">optimization, constrained decision models and network methods</text>
<text x="952" y="234" class="m"></text>
<text x="952" y="270" class="s">Python · latest public commit 12 Sep 2026</text>
<text x="952" y="292" class="s">public · active</text>
<rect x="48" y="336" width="408" height="190" rx="18" fill="var(--panel)" stroke="var(--green)" stroke-width="2" class=""/>
<text x="68" y="366" class="k" fill="var(--green)">04 · FEATURED</text>
<text x="68" y="402" font-size="20" font-weight="780">Africa Energy Dignity</text>
<text x="68" y="432" class="m">energy-system modeling, geospatial engineering and constrained planning</text>
<text x="68" y="454" class="m"></text>
<text x="68" y="490" class="s">Python · latest public commit 21 Aug 2026</text>
<text x="68" y="512" class="s">public · active</text>
<rect x="490" y="336" width="408" height="190" rx="18" fill="var(--panel)" stroke="var(--line)" stroke-width="1" class=""/>
<text x="510" y="366" class="k" fill="var(--line)">05 · SUPPORTING</text>
<text x="510" y="402" font-size="20" font-weight="780">Engineering Computation</text>
<text x="510" y="432" class="m">reproducible numerical engineering computation</text>
<text x="510" y="454" class="m"></text>
<text x="510" y="490" class="s">Python · latest public commit 21 Aug 2026</text>
<text x="510" y="512" class="s">public · active</text>
<rect x="932" y="336" width="408" height="190" rx="18" fill="var(--panel)" stroke="var(--line)" stroke-width="1" class=""/>
<text x="952" y="366" class="k" fill="var(--line)">06 · SUPPORTING</text>
<text x="952" y="402" font-size="20" font-weight="780">Math Rendering</text>
<text x="952" y="432" class="m">renderer-aware mathematical publication and verification</text>
<text x="952" y="454" class="m"></text>
<text x="952" y="490" class="s">Jupyter Notebook · latest public commit 07 Sep 2026</text>
<text x="952" y="512" class="s">public · active</text>
<text x="48" y="582" class="s">Light-yellow pulse = most recent public change. Recency is not scientific importance, quality, or empirical validation.</text>
</svg>
