<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460" role="img" aria-labelledby="title desc">
  <title id="title">Mathematical Physics of Sustainable Infrastructure Resilience</title>
  <desc id="desc">A mathematical-art banner showing coupled infrastructure networks, state-space trajectories, equations and a viability region.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a2b"/>
      <stop offset="0.48" stop-color="#0b3040"/>
      <stop offset="1" stop-color="#10223d"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7dd3fc"/>
    </marker>
  </defs>

  <rect width="1400" height="460" rx="28" fill="url(#bg)"/>
  <circle cx="1120" cy="220" r="260" fill="url(#halo)"/>

  <g opacity="0.16" stroke="#94a3b8" stroke-width="1">
    <path d="M0 70 H1400 M0 140 H1400 M0 210 H1400 M0 280 H1400 M0 350 H1400 M0 420 H1400"/>
    <path d="M100 0 V460 M200 0 V460 M300 0 V460 M400 0 V460 M500 0 V460 M600 0 V460 M700 0 V460 M800 0 V460 M900 0 V460 M1000 0 V460 M1100 0 V460 M1200 0 V460 M1300 0 V460"/>
  </g>

  <g transform="translate(55 54)">
    <text x="0" y="0" dominant-baseline="hanging" fill="#f8fafc" font-size="40" font-weight="700" font-family="Inter,Arial,sans-serif">Dossiya Dakou</text>
    <text x="0" y="57" fill="#99f6e4" font-size="21" font-family="Inter,Arial,sans-serif">MATHEMATICAL PHYSICS · SUSTAINABLE INFRASTRUCTURE · SCIENTIFIC COMPUTING</text>
    <text x="0" y="105" fill="#cbd5e1" font-size="18" font-family="Inter,Arial,sans-serif">Coupled systems · dynamic interfaces · inverse problems · viability · uncertainty · control</text>

    <g transform="translate(0 155)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
      <rect width="620" height="150" rx="18" fill="#06131f" fill-opacity="0.72" stroke="#2dd4bf" stroke-opacity="0.55"/>
      <text x="24" y="39" fill="#7dd3fc" font-size="19">dxᵢ/dt = fᵢ(xᵢ,θᵢ) + Σⱼ gᵢⱼ(xᵢ,xⱼ,Gᵢⱼ,θᵢⱼ) + Bᵢuᵢ + ξᵢ</text>
      <text x="24" y="78" fill="#c4b5fd" font-size="18">V = {x₀ : ∃u(·), x(t) ∈ Ksafe ∩ Ksus ∩ Keq}</text>
      <text x="24" y="117" fill="#fcd34d" font-size="18">R = ∫₀ᵀ S(t)/S₀ dt  ·  identify → predict → control → recover</text>
    </g>
  </g>

  <g transform="translate(760 52)">
    <ellipse cx="305" cy="174" rx="260" ry="150" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="8 8" opacity="0.8"/>
    <ellipse cx="305" cy="174" rx="192" ry="108" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.55"/>
    <path d="M72 285 C122 232 126 105 208 92 C286 79 304 248 382 232 C465 215 460 72 548 61" fill="none" stroke="#fbbf24" stroke-width="4" filter="url(#glow)"/>
    <path d="M78 292 C160 322 213 266 250 226 C296 176 348 136 419 140 C483 145 516 196 563 235" fill="none" stroke="#a78bfa" stroke-width="3" opacity="0.9"/>

    <g stroke="#7dd3fc" stroke-width="2" opacity="0.75">
      <line x1="128" y1="111" x2="231" y2="158"/>
      <line x1="231" y1="158" x2="332" y2="95"/>
      <line x1="231" y1="158" x2="315" y2="244"/>
      <line x1="332" y1="95" x2="438" y2="136"/>
      <line x1="315" y1="244" x2="438" y2="136"/>
      <line x1="315" y1="244" x2="492" y2="260"/>
      <line x1="438" y1="136" x2="492" y2="260"/>
    </g>

    <g font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">
      <g><circle cx="128" cy="111" r="24" fill="#0f766e" stroke="#99f6e4"/><text x="128" y="116" fill="#fff">P</text></g>
      <g><circle cx="231" cy="158" r="24" fill="#1d4ed8" stroke="#bfdbfe"/><text x="231" y="163" fill="#fff">W</text></g>
      <g><circle cx="332" cy="95" r="24" fill="#7c3aed" stroke="#ddd6fe"/><text x="332" y="100" fill="#fff">T</text></g>
      <g><circle cx="315" cy="244" r="24" fill="#b45309" stroke="#fde68a"/><text x="315" y="249" fill="#fff">SW</text></g>
      <g><circle cx="438" cy="136" r="22" fill="#0f172a" stroke="#7dd3fc"/><text x="438" y="141" fill="#fff">G(t)</text></g>
      <g><circle cx="492" cy="260" r="22" fill="#0f172a" stroke="#f0abfc"/><text x="492" y="265" fill="#fff">u(t)</text></g>
    </g>

    <path d="M116 330 H535" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="326" y="360" text-anchor="middle" fill="#cbd5e1" font-size="15" font-family="Inter,Arial,sans-serif">hazard η(t) → coupled state x(t) → service S(t) → recovery</text>
  </g>

  <text x="55" y="423" fill="#94a3b8" font-size="15" font-family="Inter,Arial,sans-serif">PHYSICS → EVIDENCE → MATHEMATICS → COMPUTATION → DECISION → RESILIENT SERVICE</text>
  <text x="1345" y="423" text-anchor="end" fill="#94a3b8" font-size="15" font-family="Inter,Arial,sans-serif">P · W · T · SW</text>
</svg>
