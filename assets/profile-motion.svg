<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc"><title id="title">Dossiya Dakou research operating sequence</title><desc id="desc">A static scientific sequence from physical reality through causal mechanisms and mathematical structure to engineering decisions.</desc><rect width="1200" height="260" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2878CD"/></marker></defs><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#17212b}.k{font-size:13px;fill:#5e6b78;letter-spacing:1px}.h{font-size:17px;font-weight:800}.b{fill:#fff;stroke:#52606d;stroke-width:1.5}.accent{stroke:#87CEFA;stroke-width:5}.arrow{stroke:#2878CD;stroke-width:3;fill:none;marker-end:url(#a)}</style><text x="55" y="45" class="k">PHYSICS-GROUNDED MATHEMATICAL ENGINEERING</text><text x="55" y="76" font-size="25" font-weight="800">Research operating sequence</text><g transform="translate(55 115)"><rect class="b" width="220" height="82" rx="5"/><path class="accent" d="M0 0H220"/><text class="k" x="20" y="31">01</text><text class="h" x="20" y="58">Physical reality</text></g><g transform="translate(345 115)"><rect class="b" width="220" height="82" rx="5"/><path class="accent" d="M0 0H220"/><text class="k" x="20" y="31">02</text><text class="h" x="20" y="58">Causal mechanisms</text></g><g transform="translate(635 115)"><rect class="b" width="220" height="82" rx="5"/><path class="accent" d="M0 0H220"/><text class="k" x="20" y="31">03</text><text class="h" x="20" y="58">Mathematical structure</text></g><g transform="translate(925 115)"><rect class="b" width="220" height="82" rx="5"/><path class="accent" d="M0 0H220"/><text class="k" x="20" y="31">04</text><text class="h" x="20" y="58">Engineering decision</text></g><path class="arrow" d="M282 156H335M572 156H625M862 156H915"/><text x="55" y="232" class="k">Arrows encode the declared research sequence; no decorative motion or simulated dynamics.</text></svg>