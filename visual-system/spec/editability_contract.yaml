required_outputs:
- visual_EDITABLE.svg
- visual_EDITABLE.pptx
- visual.png
- visual.pdf
- render_request.yaml
- equations.tex
- research_data.json
- manifest.json
- qa_report.json
- SOURCE_BUNDLE.zip
