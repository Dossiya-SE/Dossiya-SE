schema: FGMVS_VISUAL_SYSTEM_FREEZE_V1
version: "1.0"
status: FROZEN_ARCHITECTURE
account: Dossiya-SE
profile_repository: Dossiya-SE/Dossiya-SE
base_commit: de277a9cef5955aab95e9b3f970e61ef04c3a605
render_state: ARCHITECTURE_ONLY

principles:
  non_compensatory_claim_rule: "L(C) <= min_{k in R(C)} L_k"
  simulation_is_not_observation: true
  verification_is_not_validation: true
  calibration_is_not_validation: true
  visual_similarity_is_not_scientific_equivalence: true
  no_formula_without_role: true
  no_geometry_without_semantics: true
  no_color_without_declared_meaning: true
  no_unmeasured_100_percent_fidelity_claim: true

status_models:
  evidence_state:
    - S
    - D
    - M
    - C
    - V
    - E
    - H
    - T
  provenance_class:
    - USER_SPECIFIED
    - OBSERVED
    - PUBLISHED
    - COMPUTED
    - CALIBRATED
    - DERIVED
    - ASSUMED
    - SYNTHETIC
    - ILLUSTRATIVE
    - TO_BE_VALIDATED
  rule: "evidence_state and provenance_class are orthogonal and must never be silently collapsed"

visual_grammar:
  node: research_object_or_typed_entity
  arrow: dependency_transformation_or_justified_coupling
  curve: trajectory_evolution_recovery_control_or_optimization_path
  surface: defined_model_or_admissible_state_space
  boundary: constraint_viability_validity_or_domain_boundary
  vector: direction_gradient_control_flux_sensitivity_or_influence
  vector_length: quantified_sensitivity_or_influence_only
  tube_width: quantified_uncertainty_only
  density: defined_evidence_strength_only
  curvature: mathematically_defined_curvature_only
  convergence: verification
  optimization_path: calibration_or_optimization
  model_observation_pair: validation
  closed_region: admissible_viable_or_bounded_conclusion
  faded_region: unsupported_invalid_infeasible_or_outside_applicability

semantic_palette:
  source_math:
    light: "#4338CA"
    dark: "#A5B4FC"
    secondary_cue: square_or_indigo_rule
  observed_evidence:
    light: "#0369A1"
    dark: "#38BDF8"
    secondary_cue: solid_marker
  state_dynamics:
    light: "#1D4ED8"
    dark: "#60A5FA"
    secondary_cue: solid_trajectory
  interface_coupling:
    light: "#7E22CE"
    dark: "#C084FC"
    secondary_cue: linked_nodes
  hazard_violation:
    light: "#B91C1C"
    dark: "#FB7185"
    secondary_cue: dashed_boundary
  uncertainty_inference:
    light: "#B45309"
    dark: "#FBBF24"
    secondary_cue: band_or_dotted_contour
  viability_admissibility:
    light: "#047857"
    dark: "#34D399"
    secondary_cue: closed_set
  recovery_control:
    light: "#0F766E"
    dark: "#5EEAD4"
    secondary_cue: directed_path
  optimization_decision:
    light: "#A16207"
    dark: "#FACC15"
    secondary_cue: frontier_or_decision_marker
  computed_simulation:
    light: "#475569"
    dark: "#CBD5E1"
    secondary_cue: numeric_or_code_label
  hypothesis_transfer:
    light: "#BE185D"
    dark: "#F472B6"
    secondary_cue: dashed_magenta

canonical_surface:
  format: adaptive_svg
  requirements:
    - viewBox
    - title
    - desc
    - responsive_geometry
    - system_safe_fonts
    - light_dark_tokens
    - no_external_scripts
    - no_foreignObject_dependency
    - no_clipped_labels
  test_widths_px:
    - 1440
    - 768
    - 390

font_policy:
  text: "Inter, Segoe UI, Arial, sans-serif"
  math: "STIX Two Math, Cambria Math, Georgia, serif"
  font_files_must_not_be_distributed: true

