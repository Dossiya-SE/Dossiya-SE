[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dossiya-decision-math"
version = "0.1.0"
description = "Verified operations-research and Bayesian-decision benchmarks for the Dossiya-SE profile"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.setuptools]
py-modules = ["decision_math"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
