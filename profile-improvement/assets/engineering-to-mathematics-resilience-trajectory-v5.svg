<g text-anchor="middle">
<g transform="translate(190 0)"><circle cx="0" cy="280" r="54" fill="var(--bg)" stroke="var(--e)" stroke-width="4"/><text y="296" fill="var(--f)" font-size="36">⚡</text><text y="205" fill="var(--f)" font-size="22" font-weight="800">2016</text><text y="365" fill="var(--ink)" font-size="20" font-weight="800">PROFESSIONAL</text><text y="392" fill="var(--ink)" font-size="20" font-weight="800">ELECTRICAL ENGINEERING</text><text y="434" fill="var(--muted)" font-size="18">power systems · control</text><text y="474" fill="var(--f)" font-size="18" class="math">ẋ=Ax+Bu</text></g>
<g transform="translate(500 0)"><circle cx="0" cy="280" r="54" fill="var(--bg)" stroke="var(--e)" stroke-width="4"/><text y="295" fill="var(--f)" font-size="34">◒</text><text y="365" fill="var(--ink)" font-size="20" font-weight="800">RENEWABLE ENERGY</text><text y="392" fill="var(--ink)" font-size="20" font-weight="800">&amp; ENERGY SYSTEMS</text><text y="434" fill="var(--muted)" font-size="18">solar · wind · storage</text><text y="474" fill="var(--f)" font-size="18" class="math">P=VI</text></g>
<g transform="translate(810 0)"><circle cx="0" cy="280" r="54" fill="var(--bg)" stroke="var(--e)" stroke-width="4"/><text y="295" fill="var(--f)" font-size="34">⊕</text><text y="365" fill="var(--ink)" font-size="20" font-weight="800">SUSTAINABLE</text><text y="392" fill="var(--ink)" font-size="20" font-weight="800">ENGINEERING</text><text y="434" fill="var(--muted)" font-size="18">infrastructure · resources</text><text y="474" fill="var(--f)" font-size="18" class="math">K_R=K_phys∩K_sus</text></g>
<g transform="translate(1120 0)"><circle cx="0" cy="280" r="54" fill="var(--bg)" stroke="var(--e)" stroke-width="4"/><text y="295" fill="var(--f)" font-size="34">↗</text><text y="365" fill="var(--ink)" font-size="20" font-weight="800">FINANCIAL</text><text y="392" fill="var(--ink)" font-size="20" font-weight="800">ENGINEERING</text><text y="434" fill="var(--muted)" font-size="18">stochastic modeling · risk</text><text y="474" fill="var(--f)" font-size="18" class="math">dSₜ=μSₜdt+σSₜdWₜ</text></g>
<g transform="translate(1430 0)"><circle cx="0" cy="280" r="54" fill="var(--bg)" stroke="var(--e)" stroke-width="4"/><text y="295" fill="var(--f)" font-size="34">◇</text><text y="205" fill="var(--f)" font-size="22" font-weight="800">2026 →</text><text y="365" fill="var(--ink)" font-size="20" font-weight="800">DEEPER MATHEMATICS</text><text y="392" fill="var(--ink)" font-size="20" font-weight="800">&amp; MATHEMATICAL PHYSICS</text><text y="434" fill="var(--muted)" font-size="18">geometry · dynamics · PDEs</text><text y="474" fill="var(--f)" font-size="18" class="math">ds²=gᵢⱼdxⁱdxʲ</text></g>
