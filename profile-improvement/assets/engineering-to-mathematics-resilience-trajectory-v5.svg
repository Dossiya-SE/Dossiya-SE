<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
<title id="title">Professional trajectory — engineering to mathematics to resilience</title>
<desc id="desc">A 1920 by 600 conceptual professional trajectory from electrical engineering in 2016 through renewable energy, sustainable engineering and financial engineering toward deeper mathematics and sustainable resilient systems.</desc>
<defs><style>:root{--bg:#fff;--ink:#0B3D24;--muted:#496355;--f:#176A38;--e:#2F8F50;--m:#6FBD83;--l:#DDEFE2;--p:#F5FBF7}@media(prefers-color-scheme:dark){:root{--bg:#06130B;--ink:#ECFFF1;--muted:#A8CBB2;--f:#8FE4A4;--e:#69D383;--m:#4BB86A;--l:#164125;--p:#0A1C10}}text{font-family:Inter,Segoe UI,Arial,sans-serif}.math{font-family:Cambria Math,STIX Two Math,Georgia,serif}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--f)"/></marker></defs>
<rect width="1920" height="600" fill="var(--bg)"/>
<g fill="none" stroke="var(--l)" opacity=".55"><path d="M0 78C220 35 380 120 590 76S980 36 1190 82S1590 120 1920 68"/><path d="M0 98C220 55 380 140 590 96S980 56 1190 102S1590 140 1920 88"/></g>
<text x="960" y="72" text-anchor="middle" fill="var(--ink)" font-size="40" font-weight="800">PROFESSIONAL TRAJECTORY: ENGINEERING → MATHEMATICS → RESILIENCE</text>
<text x="960" y="108" text-anchor="middle" fill="var(--muted)" font-size="19" class="math" font-style="italic">A decade of building foundations · the next decade: deep mathematics for real-world impact</text>
