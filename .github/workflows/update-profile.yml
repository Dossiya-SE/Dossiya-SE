name: Update living research profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "data/framework.json"
      - "data/projects.json"
      - "data/research-state.json"
      - "data/power-network.json"
      - "data/transport-network.json"
      - "data/interfaces.json"
      - "data/network-dynamics.json"
      - "data/visual-palette.json"
      - "scripts/fetch_public_state.py"
      - "scripts/render_research_state.py"
      - "scripts/render_network.py"
      - "scripts/render_network_3d.py"
      - "scripts/apply_visual_palette.py"
      - "scripts/refine_profile_layout.py"
      - "scripts/validate_profile.py"
      - "scripts/validate_network.py"
      - "scripts/validate_network_3d.py"
      - "scripts/validate_network_3d_runtime.py"
      - "scripts/validate_visual_palette.py"
      - "scripts/validate_profile_layout.py"
      - ".github/workflows/update-profile.yml"
  pull_request:
    paths:
      - "README.md"
      - "data/framework.json"
      - "data/projects.json"
      - "data/research-state.json"
      - "data/public-github-state.json"
      - "data/power-network.json"
      - "data/transport-network.json"
      - "data/interfaces.json"
      - "data/network-dynamics.json"
      - "data/visual-palette.json"
      - "scripts/fetch_public_state.py"
      - "scripts/render_research_state.py"
      - "scripts/render_network.py"
      - "scripts/render_network_3d.py"
      - "scripts/apply_visual_palette.py"
      - "scripts/refine_profile_layout.py"
      - "scripts/validate_profile.py"
      - "scripts/validate_network.py"
      - "scripts/validate_network_3d.py"
      - "scripts/validate_network_3d_runtime.py"
      - "scripts/validate_visual_palette.py"
      - "scripts/validate_profile_layout.py"
      - "assets/generated/**"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: living-research-profile
  cancel-in-progress: false

jobs:
  build-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install visual runtime test dependencies
        run: python -m pip install --disable-pip-version-check "CairoSVG==2.8.2" "Pillow==11.3.0"

      - name: Refresh allowlisted public evidence
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_public_state.py

      - name: Validate governed research source state
        run: python scripts/validate_profile.py --input-only

      - name: Validate governed network source state
        run: python scripts/validate_network.py --input-only

      - name: Render living research-state SVG assets
        run: python scripts/render_research_state.py

      - name: Render coupled-network and viability SVG assets
        run: python scripts/render_network.py

      - name: Apply validated neutral-semantic palette
        run: python scripts/apply_visual_palette.py

      - name: Refine scientific container hierarchy
        run: python scripts/refine_profile_layout.py

      - name: Render static isometric 3D hero
        run: python scripts/render_network_3d.py

      - name: Validate static 3D hero semantics
        run: python scripts/validate_network_3d.py

      - name: Runtime-render 3D hero at GitHub widths
        run: python scripts/validate_network_3d_runtime.py

      - name: Upload runtime-render previews
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: 3d-runtime-previews
          path: artifacts/runtime-preview/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Validate generated research profile
        run: python scripts/validate_profile.py

      - name: Validate generated network and mathematical semantics
        run: python scripts/validate_network.py

      - name: Validate scientific information architecture
        run: python scripts/validate_profile_layout.py

      - name: Validate visual contrast and semantic redundancy
        run: python scripts/validate_visual_palette.py

      - name: Verify pull-request rendering is deterministic
        if: github.event_name == 'pull_request'
        run: |
          git diff --check
          echo "Governed scientific state, network semantics, runtime-rendered 3D geometry, palette, container hierarchy and validators completed successfully."

      - name: Commit meaningful profile changes only
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public-github-state.json assets/generated/
          if git diff --cached --quiet; then
            echo "No meaningful public research-state or generated-visual change detected."
            exit 0
          fi
          git commit -m "chore(profile): refresh verified research network state"
          git push
