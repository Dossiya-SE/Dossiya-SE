name: Update living research profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "requirements-visual.txt"
      - "data/**"
      - "scripts/**"
      - "mathematical-art/profile-geometry/**"
      - "assets/generated/**"
      - ".github/workflows/update-profile.yml"
  pull_request:
    paths:
      - "README.md"
      - "requirements-visual.txt"
      - "data/**"
      - "scripts/**"
      - "mathematical-art/profile-geometry/**"
      - "assets/generated/**"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: living-research-profile
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.11.9"

      - name: Install scientific visual dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-visual.txt

      - name: Refresh allowlisted public evidence
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_public_state.py

      - name: Validate governed research source state
        run: python scripts/validate_profile.py --input-only

      - name: Validate governed network source state
        run: python scripts/validate_network.py --input-only

      - name: Compute SCIENTIFIC-GEOMETRY-V3
        run: python scripts/compute_scientific_geometry.py

      - name: Independently verify geometry in Julia
        run: julia mathematical-art/profile-geometry/julia/verify_geometry_v3.jl

      - name: Validate mathematics numerical conditioning and topology
        run: python scripts/validate_scientific_geometry.py

      - name: Validate 3D scene with PyVista and Trimesh
        run: python scripts/validate_computational_3d.py

      - name: Generate TikZ publication geometry
        run: python scripts/render_publication_geometry.py

      - name: Render legacy research-state SVG assets
        run: python scripts/render_research_state.py

      - name: Render legacy coupled-network and viability SVG assets
        run: python scripts/render_network.py

      - name: Apply validated neutral-semantic palette
        run: python scripts/apply_visual_palette.py

      - name: Refine scientific container hierarchy
        run: python scripts/refine_profile_layout.py

      - name: Render legacy static isometric 3D hero
        run: python scripts/render_network_3d.py

      - name: Validate legacy 3D hero semantics
        run: python scripts/validate_network_3d.py

      - name: Runtime-render legacy 3D hero at GitHub widths
        run: python scripts/validate_network_3d_runtime.py

      - name: Validate generated research profile
        run: python scripts/validate_profile.py

      - name: Validate generated network and mathematical semantics
        run: python scripts/validate_network.py

      - name: Validate scientific information architecture
        run: python scripts/validate_profile_layout.py

      - name: Validate governed visual palette
        run: python scripts/validate_visual_palette.py

      - name: Render final V3 README visuals from computed geometry
        run: python scripts/render_geometric_readme.py

      - name: Validate V3 scientific visual semantics
        run: python scripts/validate_geometric_readme.py

      - name: Validate quantitative visual geometry
        run: python scripts/validate_visual_geometry.py

      - name: Revalidate palette after final V3 render
        run: python scripts/validate_visual_palette.py

      - name: Runtime-render all final README visuals
        run: python scripts/validate_geometric_readme_runtime.py

      - name: Verify byte-identical V3 rebuild determinism
        if: github.event_name == 'pull_request'
        run: |
          git diff --check
          python scripts/verify_v3_determinism.py
          echo "G1 mathematics, G2 numerical verification, G3 computational geometry, G4 semantics, G5 visual quality and G6 byte-identical double-build determinism completed."

      - name: Upload V3 geometry audit artifacts
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: scientific-geometry-v3-audit
          path: |
            data/computed-geometry-v3.json
            artifacts/julia-geometry-check.toml
            artifacts/visual-layout-v3.json
            artifacts/v3-determinism-manifest.json
            mathematical-art/profile-geometry/overleaf/profile_geometry_v3.tex
          if-no-files-found: error
          retention-days: 14

      - name: Upload final geometry runtime previews
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: geometric-readme-v3-runtime-previews
          path: artifacts/geometric-readme-preview/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Commit validated generated V3 artifacts to PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
          TRIGGER_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          rm -rf /tmp/profile-v3
          mkdir -p /tmp/profile-v3/assets /tmp/profile-v3/data /tmp/profile-v3/tikz
          cp -R assets/generated/. /tmp/profile-v3/assets/
          cp data/computed-geometry-v3.json /tmp/profile-v3/data/
          cp mathematical-art/profile-geometry/overleaf/profile_geometry_v3.tex /tmp/profile-v3/tikz/

          git fetch origin "$HEAD_REF"
          REMOTE_SHA="$(git rev-parse "origin/$HEAD_REF")"
          if [ "$REMOTE_SHA" != "$TRIGGER_SHA" ]; then
            echo "Stale workflow run: trigger $TRIGGER_SHA, current branch $REMOTE_SHA. Generated artifacts will not be committed."
            exit 0
          fi

          git checkout -B "$HEAD_REF" "$TRIGGER_SHA"
          rm -rf assets/generated
          mkdir -p assets/generated
          cp -R /tmp/profile-v3/assets/. assets/generated/
          cp /tmp/profile-v3/data/computed-geometry-v3.json data/computed-geometry-v3.json
          cp /tmp/profile-v3/tikz/profile_geometry_v3.tex mathematical-art/profile-geometry/overleaf/profile_geometry_v3.tex
          git add assets/generated/ data/computed-geometry-v3.json mathematical-art/profile-geometry/overleaf/profile_geometry_v3.tex
          if git diff --cached --quiet; then
            echo "Computed geometry, TikZ and final SVGs already match validated sources."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): regenerate validated scientific geometry v3"
          git push origin "HEAD:$HEAD_REF"

      - name: Commit meaningful generated V3 changes on main
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public-github-state.json data/computed-geometry-v3.json assets/generated/ mathematical-art/profile-geometry/overleaf/profile_geometry_v3.tex
          if git diff --cached --quiet; then
            echo "No meaningful public state or computed geometry change detected."
            exit 0
          fi
          git commit -m "chore(profile): refresh verified scientific geometry v3"
          git push
