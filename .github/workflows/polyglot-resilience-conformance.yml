name: polyglot-resilience-conformance

on:
  push:
    paths:
      - "polyglot-resilience/**"
      - ".github/workflows/polyglot-resilience-conformance.yml"
  pull_request:
    paths:
      - "polyglot-resilience/**"
      - ".github/workflows/polyglot-resilience-conformance.yml"

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Runtime provenance
        run: |
          python --version
          go version
          node --version

      - name: Static syntax checks
        run: |
          python -m compileall -q polyglot-resilience/implementations/python polyglot-resilience/tests polyglot-resilience/tools
          node --check polyglot-resilience/implementations/javascript/kernel.mjs
          go test polyglot-resilience/implementations/go/main.go

      - name: Validate scientific structure and contracts
        run: python polyglot-resilience/tools/validate_structure.py

      - name: Run reference scientific invariants
        run: python polyglot-resilience/tests/invariants/test_reference_kernel.py

      - name: Run frozen cross-language conformance
        run: python polyglot-resilience/tests/conformance/compare_outputs.py
