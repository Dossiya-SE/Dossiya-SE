name: profile-visual-pipeline

on:
  push:
    paths:
      - 'assets/math-art/**'
      - 'profile-improvement/visual-pipeline/**'
      - '.github/workflows/profile-visual-pipeline.yml'
  pull_request:
    paths:
      - 'assets/math-art/**'
      - 'profile-improvement/visual-pipeline/**'
      - '.github/workflows/profile-visual-pipeline.yml'

permissions:
  contents: write

jobs:
  validate-mathematical-visuals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile deterministic source, renderer and validators
        run: |
          python -m py_compile profile-improvement/visual-pipeline/generate_synthetic_math.py
          python -m py_compile profile-improvement/visual-pipeline/render_profile_visuals.py
          python -m py_compile profile-improvement/visual-pipeline/validate_visual_pipeline.py

      - name: Generate controlled synthetic mathematical source
        run: python profile-improvement/visual-pipeline/generate_synthetic_math.py

      - name: Render all canonical profile visuals
        run: python profile-improvement/visual-pipeline/render_profile_visuals.py

      - name: Validate mathematical source and canonical SVGs
        run: python profile-improvement/visual-pipeline/validate_visual_pipeline.py

      - name: Run adaptive SVG audit
        run: python mathematical-art/audit_adaptive_visuals.py

      - name: Run mathematical presentation audit
        run: python mathematical-art/audit_profile_math.py

      - name: Verify deterministic regeneration
        run: |
          cp profile-improvement/visual-pipeline/synthetic_profile_data.json /tmp/profile-data-a.json
          cp assets/math-art/profile-header-v5.svg /tmp/profile-header-a.svg
          cp assets/math-art/research-operating-system-v5.svg /tmp/research-system-a.svg
          cp assets/math-art/differential-geometry-foundations-v5.svg /tmp/geometry-a.svg
          python profile-improvement/visual-pipeline/generate_synthetic_math.py
          python profile-improvement/visual-pipeline/render_profile_visuals.py
          cmp /tmp/profile-data-a.json profile-improvement/visual-pipeline/synthetic_profile_data.json
          cmp /tmp/profile-header-a.svg assets/math-art/profile-header-v5.svg
          cmp /tmp/research-system-a.svg assets/math-art/research-operating-system-v5.svg
          cmp /tmp/geometry-a.svg assets/math-art/differential-geometry-foundations-v5.svg

      - name: Commit regenerated canonical visuals
        if: github.event_name == 'push' && github.ref_name == 'profile-professional-visual-pipeline-v1'
        run: |
          if ! git diff --quiet -- \
            profile-improvement/visual-pipeline/synthetic_profile_data.json \
            assets/math-art/profile-header-v5.svg \
            assets/math-art/research-operating-system-v5.svg \
            assets/math-art/differential-geometry-foundations-v5.svg; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              profile-improvement/visual-pipeline/synthetic_profile_data.json \
              assets/math-art/profile-header-v5.svg \
              assets/math-art/research-operating-system-v5.svg \
              assets/math-art/differential-geometry-foundations-v5.svg
            git commit -m "Generate professional mathematical profile visuals"
            git push origin HEAD:profile-professional-visual-pipeline-v1
          else
            echo "Canonical visuals are already reproducible and up to date."
          fi
